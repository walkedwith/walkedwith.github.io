<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#B6DEFB">
<title>데구르</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#B6DEFB;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#sa{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stats{font:15px/1.5 system-ui,"Apple SD Gothic Neo",sans-serif;color:#1A2440;padding:20px;overflow:auto;height:100%;box-sizing:border-box}
#stats table{border-collapse:collapse;margin-top:12px}
#stats td,#stats th{border:1px solid #9E8F81;padding:5px 6px;font-size:13px;white-space:nowrap;text-align:center}
#stats th{background:#FDF7E5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sa"></div>
<script>
'use strict';
(function(){
const BUILD='dice-c1-r1';
//<LOGIC>
const START_O={top:1,north:2,east:3};
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const DN=['up','down','left','right'];
const WALLS='#TBx';
function rollO(o,d){
  const t=o.top,n=o.north,e=o.east;
  if(d==='right')return{top:7-e,north:n,east:t};
  if(d==='left')return{top:e,north:n,east:7-t};
  if(d==='up')return{top:7-n,north:t,east:e};
  return{top:n,north:7-t,east:e};
}
function parseLevel(def){
  const rows=def.map,H=rows.length,W=rows[0].length;
  const L={W,H,cells:[],enemies:[],start:null,gate:null,o0:def.o||START_O,par:def.par,name:def.name};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=rows[y][x];let t='.';
    if(c==='S')L.start=[x,y];
    else if(c==='G')L.gate=[x,y];
    else if(c>='1'&&c<='5')L.enemies.push({x,y,n:+c});
    else if(c>='a'&&c<='e'){L.enemies.push({x,y,n:c.charCodeAt(0)-96});t=',';}
    else if(c===',')t=',';
    else if(WALLS.includes(c))t=c;
    L.cells.push(t);
  }
  return L;
}
function cellAt(L,x,y){return x<0||y<0||x>=L.W||y>=L.H?'x':L.cells[y*L.W+x];}
function newState(L){return{x:L.start[0],y:L.start[1],o:{...L.o0},alive:L.enemies.map(()=>true),hearts:3,moves:0,status:'play'};}
function cloneState(s){return{x:s.x,y:s.y,o:{...s.o},alive:s.alive.slice(),hearts:s.hearts,moves:s.moves,status:s.status};}
function enemyAt(L,s,x,y){for(let i=0;i<L.enemies.length;i++)if(s.alive[i]&&L.enemies[i].x===x&&L.enemies[i].y===y)return i;return -1;}
function gateOpen(s){return s.alive.every(a=>!a);}
// ign=true: ignore number comparison (any adjacent enemy falls) - only for the solver's "naive" bound
function stepMove(L,s,d,ign){
  const x=s.x+DIRS[d][0],y=s.y+DIRS[d][1];
  if(WALLS.includes(cellAt(L,x,y))||enemyAt(L,s,x,y)>=0)return{k:'blocked'};
  const isGate=!!L.gate&&L.gate[0]===x&&L.gate[1]===y;
  if(isGate&&!gateOpen(s))return{k:'blocked'};
  const o2=rollO(s.o,d),adj=[];let bounce=false;
  for(let i=0;i<L.enemies.length;i++){
    const e=L.enemies[i];
    if(s.alive[i]&&Math.abs(e.x-x)+Math.abs(e.y-y)===1){adj.push(i);if(o2.top<=e.n&&!ign)bounce=true;}
  }
  const ns=cloneState(s),r={from:[s.x,s.y],to:[x,y],o2,adj,d};
  if(bounce){ns.hearts--;if(ns.hearts<=0)ns.status='fail';return{...r,k:'bounce',s:ns,kills:[]};}
  ns.x=x;ns.y=y;ns.o=o2;ns.moves++;
  for(const i of adj)ns.alive[i]=false;
  if(isGate){ns.status='clear';return{...r,k:'clear',s:ns,kills:adj};}
  return{...r,k:'move',s:ns,kills:adj};
}
const LEVELS=[
  {map:["G.3", ".,.", "...", ".S."],par:6},
  {map:["G.,.", ",5..", "..c.", ",S.."],par:8},
  {map:[".G..", "3..,", "###.", "2..,", ".S.."],par:10},
  {map:[",G..", ".3#.", ",2..", ".#,.", ",.S."],par:11},
  {map:["..G,.", ".,..4", ".T.#.", ".e.1.", "..S,."],par:12},
  {map:["G.,..", ",T.Ta", "4.,3.", ",T.T,", "..,.S"],par:12},
  {map:[".bG.", "3.3,", ".##.", "...,", ".#..", "S..,"],par:13},
  {map:[",.G.,", ".BcB.", ",...,", "5###.", ",3..,", "S.,.."],par:13},
  {map:["...,G", ".,T3.", ".#1B2", ".,.4.", "B.#,.", "S,..."],par:15},
  {map:["33G..", "eT.T,", ".3#..", ",B.B,", "..#..", "S...,"],par:17}
];
//</LOGIC>

/* ---------- storage / stats (PROTO_WORKFLOW §5) ---------- */
const PFX='proto_dice_',DUTY_MS=5*60*1000;
const MODE=/[?&]check(&|$|=)/.test(location.search)?'check':'play';
const mem={};
const LS={
  get(k,d){try{const v=localStorage.getItem(PFX+k);return v==null?d:JSON.parse(v);}catch(e){return k in mem?mem[k]:d;}},
  set(k,v){mem[k]=v;try{localStorage.setItem(PFX+k,JSON.stringify(v));}catch(e){}}
};
const dayKey=(t)=>{const d=new Date(t||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let dutyDay=dayKey(),dutyMs=MODE==='play'?LS.get('duty_'+dutyDay,0):0,dutyLast=Date.now();
function dutyTick(){
  const now=Date.now(),dt=Math.min(2000,now-dutyLast);dutyLast=now;
  if(MODE!=='play'||document.hidden)return;
  if(dayKey()!==dutyDay){dutyDay=dayKey();dutyMs=LS.get('duty_'+dutyDay,0);}
  dutyMs+=dt;LS.set('duty_'+dutyDay,dutyMs);
}
const dutyDone=()=>MODE==='play'&&dutyMs>=DUTY_MS;
function logEv(type,extra){
  const a=LS.get('log',[]);
  a.push(Object.assign({ts:Date.now(),day:dayKey(),type,level:lvlN,build:BUILD,mode:MODE},extra||{}));
  LS.set('log',a.slice(-3000));
}

/* ---------- stats page ---------- */
if(/[?&]stats(&|$|=)/.test(location.search)){
  document.getElementById('cv').remove();
  const days={};
  for(const e of LS.get('log',[])){
    const d=days[e.day]=days[e.day]||{play:{start:0,clear:0,fail:0,vol:0},check:0,builds:{}};
    if(e.mode==='check'){d.check++;continue;}
    d.builds[e.build]=1;
    if(e.type==='start'){d.play.start++;if(e.voluntary)d.play.vol++;}
    else if(e.type==='clear')d.play.clear++;
    else if(e.type==='fail')d.play.fail++;
  }
  const ks=Object.keys(days).sort().reverse();
  const rows=ks.map(k=>{const d=days[k],m=LS.get('duty_'+k,0);
    return `<tr><td>${k}</td><td>${m>=DUTY_MS?'✓':'–'} ${Math.floor(m/60000)}:${String(Math.floor(m/1000)%60).padStart(2,'0')}</td><td><b>${d.play.vol}</b></td><td>${d.play.clear}</td><td>${d.play.fail}</td><td>${d.play.start}</td><td>${d.check}</td><td>${Object.keys(d.builds).join(', ')}</td></tr>`;}).join('');
  const el=document.createElement('div');el.id='stats';
  el.innerHTML=`<h2>데구르 기록</h2><div>빌드 ${BUILD} · 의무 = 하루 누적 5분 · 자발 = 의무 뒤 직접 누른 시작/다시/다음으로 연 판</div><table><tr><th>날짜</th><th>의무</th><th>자발 판수</th><th>클리어</th><th>실패</th><th>시작</th><th>점검(제외)</th><th>빌드</th></tr>${rows||'<tr><td colspan="8">기록 없음</td></tr>'}</table>`;
  document.body.appendChild(el);
  return;
}

/* ---------- assets: art/sprites/<name>.png, silhouette if missing (§6) ---------- */
// w,h,px,py = display size and pivot in logical px (cell = 128)
const AS={
  'bg-sky':{k:'bg'},
  'tile-grass':{k:'tile',w:128,h:160,px:64,py:41},'tile-sand':{k:'tile',w:128,h:160,px:64,py:41},'tile-flower':{k:'tile',w:128,h:160,px:64,py:41},
  'cliff-front':{k:'cliff',w:128,h:96,px:64,py:0},
  'hero-dizzy':{k:'hero',w:128,h:128,px:64,py:116},'hero-cheer':{k:'hero',w:128,h:128,px:64,py:116},
  'blob':{k:'blob',w:112,h:112,px:56,py:101.5},'blob-down':{k:'blob',w:112,h:112,px:56,py:101.5},
  'gate-closed':{k:'gate',w:192,h:224,px:96,py:210},'gate-open':{k:'gate',w:192,h:224,px:96,py:210},
  'fence':{k:'fence',w:128,h:96,px:64,py:88},'tree':{k:'tree',w:128,h:160,px:64,py:150},'bush':{k:'bush',w:128,h:160,px:64,py:150},
  'heart':{k:'heart',w:48,h:48,px:24,py:24},'heart-off':{k:'heart',w:48,h:48,px:24,py:24}
};
for(let i=1;i<=6;i++)AS['hero-'+i]={k:'hero',w:128,h:128,px:64,py:116};
const IMG={};
for(const n in AS){const o=IMG[n]={ok:false,fail:false,img:new Image()};o.img.onload=()=>{o.ok=true;};o.img.onerror=()=>{o.fail=true;};o.img.src='art/sprites/'+n+'.png';}
let silSet=new Set();
const SIL='#D8D4E8',SILD='#BFBAD6';

/* ---------- canvas / layout ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=360,H=640,DPR=1,SAFE={t:0,r:0,b:0,l:0};
let lvl,lvlN=0,S,hist=[],fx=[],A=null,clock=0,overlayOn=false,overlayWait=0,overlayT=0,preview=null;
const RYK=0.645; // tile top face is foreshortened at 30deg: depth = 0.645 x width (measured on tile-grass)
let C=100,k=0.78,GX=0,GY=0,lvlT0=0,clearLogged=false,failLogged=false;
function readSafe(){const cs=getComputedStyle(document.getElementById('sa'));SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function resize(){
  DPR=Math.min(3,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);readSafe();layout();draw();
}
function layout(){
  if(!lvl)return;
  const top=Math.max(64,SAFE.t+56),bot=Math.max(92,SAFE.b+84),aw=W-24,ah=H-top-bot;
  C=Math.max(40,Math.min(aw/lvl.W,ah/(lvl.H*RYK+1.4),150));k=C/128;
  GX=(W-lvl.W*C)/2;GY=top+(ah-(lvl.H*RYK+1.4)*C)/2+0.9*C;
}
const cc=(x,y)=>[GX+(x+.5)*C,GY+(y+.5)*C*RYK];       // tile top centre
const gp=(x,y)=>{const p=cc(x,y);return[p[0],p[1]+28*k];}; // ground point (feet)

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function heartPath(r){ctx.beginPath();ctx.moveTo(0,r*.9);ctx.bezierCurveTo(-r*1.6,-r*.1,-r*.9,-r*1.1,0,-r*.4);ctx.bezierCurveTo(r*.9,-r*1.1,r*1.6,-r*.1,0,r*.9);ctx.closePath();}
function star4(x,y,r,rot){ctx.beginPath();for(let i=0;i<8;i++){const a=rot+i*Math.PI/4,rad=i%2?r*.38:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();}
function silhouette(kind,s){
  ctx.fillStyle=SIL;
  switch(kind){
    case 'bg':ctx.fillStyle='#B6DEFB';ctx.fillRect(0,0,W,H);break;
    case 'tile':ctx.fillStyle=SILD;rr(-62*s,-30*s,124*s,124*s,22*s);ctx.fill();ctx.fillStyle=SIL;rr(-62*s,-62*s,124*s,124*s,22*s);ctx.fill();break;
    case 'cliff':ctx.fillStyle=SILD;rr(-62*s,-12*s,124*s,86*s,24*s);ctx.fill();break;
    case 'hero':rr(-46*s,-92*s,92*s,92*s,28*s);ctx.fill();break;
    case 'blob':rr(-46*s,-74*s,92*s,74*s,36*s);ctx.fill();break;
    case 'gate':ctx.beginPath();ctx.moveTo(-68*s,0);ctx.lineTo(-68*s,-130*s);ctx.arc(0,-130*s,68*s,Math.PI,0);ctx.lineTo(68*s,0);ctx.closePath();ctx.fill();break;
    case 'fence':rr(-58*s,-60*s,116*s,58*s,16*s);ctx.fill();break;
    case 'tree':rr(-44*s,-140*s,88*s,138*s,40*s);ctx.fill();break;
    case 'bush':rr(-52*s,-72*s,104*s,70*s,32*s);ctx.fill();break;
    case 'heart':ctx.fillStyle='#FD836E';heartPath(14*s);ctx.fill();break;
  }
}
// draw sprite `name` with its pivot at (x,y). o: {s:scale, rot, sx, sy, a}
function spr(name,x,y,o){
  o=o||{};const a=AS[name],im=IMG[name],s=(o.s||1)*k;
  ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);ctx.scale(o.sx||1,o.sy||1);if(o.a!=null)ctx.globalAlpha=o.a;
  if(im&&im.ok)ctx.drawImage(im.img,-a.px*s,-a.py*s,a.w*s,a.h*s);
  else{silSet.add(name);if(name==='heart-off'){ctx.globalAlpha*=.35;}silhouette(a.k,s);}
  ctx.restore();
}
function shadow(x,y,rx,alpha){ctx.save();ctx.fillStyle='rgba(40,50,90,'+(alpha==null?.2:alpha)+')';ctx.beginPath();ctx.ellipse(x,y,rx,rx*.32,0,0,7);ctx.fill();ctx.restore();}
function badge(x,y,r,txt,ring){
  ctx.save();ctx.fillStyle='#FEEFC3';ctx.strokeStyle=ring||'#E9D08E';ctx.lineWidth=Math.max(1.5,r*.14);
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1A1E38';ctx.font='800 '+Math.round(r*1.25)+'px "Avenir Next","Trebuchet MS",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+r*.06);ctx.restore();
}
function txt(s,x,y,px,col,align,w){ctx.save();ctx.fillStyle=col||'#1A2440';ctx.font=(w||800)+' '+px+'px "Avenir Next","Apple SD Gothic Neo","Trebuchet MS",system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore();}

/* ---------- animation ---------- */
const ROLL=160,BOUNCE=200,FALL=250,BUMP=140;
function startAnim(segs,events,hold,holdGate){A={t:0,segs,events,hold:hold||new Set(),holdGate:!!holdGate,total:segs.reduce((a,s)=>a+s.dur,0)};}
function finishAnim(){if(!A)return;for(const e of A.events)if(!e.done){e.done=1;e.fn();}A=null;}
function stepAnim(dt){
  if(!A)return;A.t+=dt;
  for(const e of A.events)if(!e.done&&A.t>=e.at){e.done=1;e.fn();}
  if(A.t>=A.total)finishAnim();
}
const sm=u=>u*u*(3-2*u);
function heroVis(){
  const v={x:S.x,y:S.y,sprite:S.status==='clear'?'hero-cheer':S.status==='fail'?'hero-dizzy':'hero-'+S.o.top,rot:0,sx:1,sy:1,hop:0};
  if(!A)return v;
  let t=A.t;
  for(const g of A.segs){
    if(t<=g.dur||g===A.segs[A.segs.length-1]){
      const u=Math.max(0,Math.min(1,t/g.dur));
      if(g.t==='roll'){
        const e=sm(u);v.x=g.f[0]+(g.to[0]-g.f[0])*e;v.y=g.f[1]+(g.to[1]-g.f[1])*e;
        v.hop=Math.sin(Math.PI*u)*.3*C;v.sprite=u<.5?g.sa:g.sb;
        const dx=DIRS[g.d][0];
        if(dx)v.rot=dx*.42*(u<.5?u*2:(u-.5)*2-1);
        else{const q=Math.sin(Math.PI*u);v.sy=1-.16*q;v.sx=1+.08*q;}
      }else if(g.t==='bounce'){
        const e=sm(u);v.x=g.f[0]+(g.to[0]-g.f[0])*e;v.y=g.f[1]+(g.to[1]-g.f[1])*e;
        v.hop=Math.sin(Math.PI*u)*.14*C;v.sprite='hero-dizzy';v.rot=Math.sin(u*Math.PI*4)*.16*(1-u);
      }else if(g.t==='bump'){
        const q=Math.sin(Math.PI*u)*.16;v.x=S.x+DIRS[g.d][0]*q;v.y=S.y+DIRS[g.d][1]*q;
      }
      return v;
    }
    t-=g.dur;
  }
  return v;
}

/* ---------- game actions ---------- */
function startLevel(n,src){
  finishAnim();lvlN=n;lvl=LV[n-1];S=newState(lvl);hist=[];fx=[];overlayOn=false;overlayWait=0;overlayT=0;preview=null;
  layout();lvlT0=Date.now();clearLogged=failLogged=false;
  logEv('start',{src,voluntary:src==='tap'&&dutyDone()});
}
const starsFor=(m,p)=>m<=p?3:m<=p+3?2:1;
function doMove(d){
  if(S.status!=='play')return'ignored';
  finishAnim();
  const r=stepMove(lvl,S,d);
  if(r.k==='blocked'){startAnim([{t:'bump',d,dur:BUMP}],[],null,false);return'blocked';}
  hist.push(cloneState(S));
  const wasOpen=gateOpen(S),old=S;S=r.s;
  const sa='hero-'+old.o.top,sb=r.k==='clear'?'hero-cheer':'hero-'+r.o2.top;
  const roll={t:'roll',f:r.from,to:r.to,d,sa,sb,dur:ROLL};
  if(r.k==='bounce'){
    startAnim([roll,{t:'bounce',f:r.to,to:r.from,dur:BOUNCE}],[{at:ROLL,fn:()=>fx.push({t:'vig',a:0,dur:350})}]);
  }else{
    const opens=!wasOpen&&gateOpen(S);
    startAnim([roll],[{at:ROLL,fn:()=>{
      for(const i of r.kills){const e=lvl.enemies[i];fx.push({t:'fall',x:e.x,y:e.y,n:e.n,a:0,dur:FALL});}
      if(opens)fx.push({t:'glow',a:0,dur:800});
      if(r.k==='clear')fx.push({t:'burst',x:r.to[0],y:r.to[1],a:0,dur:700,big:1});
      if(A){A.hold.clear();A.holdGate=false;}
    }}],new Set(r.kills),opens);
  }
  if(S.status==='clear'&&!clearLogged){clearLogged=true;logEv('clear',{ms:Date.now()-lvlT0,moves:S.moves});if(MODE==='play')LS.set('progress',Math.max(LS.get('progress',0),lvlN));}
  if(S.status==='fail'&&!failLogged){failLogged=true;logEv('fail',{ms:Date.now()-lvlT0});}
  return r.k;
}
function doUndo(){
  finishAnim();if(!hist.length)return'ignored';
  S=hist.pop();fx=[];overlayOn=false;overlayWait=0;preview=null;return'undo';
}
function doNext(){startLevel(S.status==='clear'?(lvlN%LV.length)+1:lvlN,'tap');}

/* ---------- buttons ---------- */
function buttons(){
  const b=[],r=26,y=H-Math.max(16,SAFE.b)-r-8;
  b.push({id:'undo',x:Math.max(16,SAFE.l)+r+4,y,r,off:!hist.length});
  b.push({id:'restart',x:W-Math.max(16,SAFE.r)-r-4,y,r});
  if(overlayOn){
    const cw=Math.min(W-40,340),cx=W/2,cy=H/2,bw=(cw-48)/2,bh=48,by=cy+60;
    if(S.status==='clear'){
      b.push({id:'restart',x:cx-bw/2-8,y:by,w:bw,h:bh,label:'다시',sec:1});
      b.push({id:'next',x:cx+bw/2+8,y:by,w:bw,h:bh,label:lvlN>=LV.length?'처음부터':'다음 판'});
    }else{
      b.push({id:'undo',x:cx-bw/2-8,y:by,w:bw,h:bh,label:'무르기',sec:1});
      b.push({id:'restart',x:cx+bw/2+8,y:by,w:bw,h:bh,label:'다시'});
    }
  }
  return b;
}
function hit(px,py){
  const bs=buttons();
  for(let i=bs.length-1;i>=0;i--){const b=bs[i];
    if(b.r){if(Math.hypot(px-b.x,py-b.y)<=b.r+8)return b.id;}
    else if(Math.abs(px-b.x)<=b.w/2&&Math.abs(py-b.y)<=b.h/2)return b.id;}
  return null;
}
function press(id){if(id==='undo')return doUndo();if(id==='restart'){startLevel(lvlN,'tap');return'restart';}if(id==='next'){doNext();return'next';}}

/* ---------- render ---------- */
function drawBtn(b){
  ctx.save();ctx.globalAlpha=b.off?.4:1;
  if(b.r){
    ctx.fillStyle='rgba(255,255,255,.82)';ctx.strokeStyle='#9E8F81';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#1A2440';ctx.fillStyle='#1A2440';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
    if(b.id==='undo'){ // U-turn arrow
      ctx.beginPath();ctx.moveTo(b.x+9,b.y+9);ctx.lineTo(b.x+3,b.y+9);ctx.arc(b.x+3,b.y,9,Math.PI/2,-Math.PI/2,true);ctx.lineTo(b.x-9,b.y-9);ctx.stroke();
      ctx.beginPath();ctx.moveTo(b.x-6,b.y-17);ctx.lineTo(b.x-15,b.y-9);ctx.lineTo(b.x-6,b.y-1);ctx.closePath();ctx.fill();
    }else{ // circular arrow
      ctx.beginPath();ctx.arc(b.x,b.y,11,-Math.PI*.35,Math.PI*1.35);ctx.stroke();
      ctx.beginPath();ctx.moveTo(b.x+13,b.y-17);ctx.lineTo(b.x+13,b.y-5);ctx.lineTo(b.x+2,b.y-11);ctx.closePath();ctx.fill();
    }
  }else{
    ctx.fillStyle=b.sec?'#FDF7E5':'#F77B6B';ctx.strokeStyle=b.sec?'#9E8F81':'#D8604F';ctx.lineWidth=3;rr(b.x-b.w/2,b.y-b.h/2,b.w,b.h,16);ctx.fill();ctx.stroke();
    txt(b.label,b.x,b.y+1,19,b.sec?'#1A2440':'#FFFFFF');
  }
  ctx.restore();
}
function draw(){
  silSet=new Set();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // background (stretch to cover)
  const bg=IMG['bg-sky'];
  if(bg.ok)ctx.drawImage(bg.img,0,0,W,H);else{silSet.add('bg-sky');silhouette('bg');}
  if(!lvl)return;
  const hv=heroVis();
  // tiles
  for(let y=0;y<lvl.H;y++)for(let x=0;x<lvl.W;x++){
    const c=lvl.cells[y*lvl.W+x];if(c==='x')continue;
    const p=cc(x,y);
    let nm=c===','?'tile-sand':'tile-grass';
    if(nm==='tile-grass'&&IMG['tile-flower'].ok&&(x*7+y*13+lvlN)%5===0)nm='tile-flower';
    spr(nm,p[0],p[1]);
    if(cellAt(lvl,x,y+1)==='x')spr('cliff-front',p[0],p[1]+52*k);
  }
  // objects, sorted by row
  const dr=[];
  for(let y=0;y<lvl.H;y++)for(let x=0;x<lvl.W;x++){
    const c=lvl.cells[y*lvl.W+x];if(c!=='#'&&c!=='T'&&c!=='B')continue;
    dr.push({y,f:()=>{const g=gp(x,y);spr(c==='#'?'fence':c==='T'?'tree':'bush',g[0],g[1]);}});
  }
  const gateIsOpen=gateOpen(S)&&!(A&&A.holdGate);
  if(lvl.gate)dr.push({y:lvl.gate[1],f:()=>{
    const g=gp(lvl.gate[0],lvl.gate[1]);
    if(gateIsOpen){
      const pul=.55+.2*Math.sin(clock/280),rg=ctx.createRadialGradient(g[0],g[1]-100*k,4,g[0],g[1]-100*k,120*k);
      rg.addColorStop(0,'rgba(254,251,214,'+pul+')');rg.addColorStop(.5,'rgba(254,224,144,'+pul*.45+')');rg.addColorStop(1,'rgba(254,224,144,0)');
      ctx.fillStyle=rg;ctx.fillRect(g[0]-130*k,g[1]-230*k,260*k,260*k);
    }
    spr(gateIsOpen?'gate-open':'gate-closed',g[0],g[1]);
  }});
  lvl.enemies.forEach((e,i)=>{
    if(!(S.alive[i]||(A&&A.hold.has(i))))return;
    dr.push({y:e.y,f:()=>{
      const g=gp(e.x,e.y),br=1+.025*Math.sin(clock/230+i*1.7);
      shadow(g[0],g[1],40*k);spr('blob',g[0],g[1],{sy:br,sx:2-br});
      badge(g[0],g[1]-88*k*br,19*k,String(e.n));
    }});
  });
  for(const f of fx)if(f.t==='fall')dr.push({y:f.y,f:()=>{
    const u=f.a/f.dur,g=gp(f.x,f.y);
    shadow(g[0],g[1],40*k,.2*(1-u));
    spr('blob-down',g[0],g[1],{sx:1+.25*u,sy:1-.4*u,a:1-u*u});
    badge(g[0],g[1]-60*k*(1-.4*u)-14*k*u,19*k,String(f.n));
    for(let i=0;i<5;i++){const a=i*1.2566+u*2.2,r=(20+u*58)*k;ctx.fillStyle='rgba(254,224,144,'+(1-u)+')';star4(g[0]+Math.cos(a)*r,g[1]-56*k+Math.sin(a)*r*.7,9*k,u*5+i);ctx.fill();}
  }});
  dr.push({y:hv.y+.01,f:()=>{
    const g=gp(hv.x,hv.y);
    shadow(g[0],g[1],42*k*(1-hv.hop/C*.8),.22);
    spr(hv.sprite,g[0],g[1]-hv.hop,{rot:hv.rot,sx:hv.sx,sy:hv.sy});
    if(S.status==='play'||A)badge(g[0]-50*k,g[1]-hv.hop-70*k,15*k,String(S.o.top),'#7FD8F5');
  }});
  dr.sort((a,b)=>a.y-b.y);
  for(const d of dr)d.f();
  // ghost preview
  if(preview&&S.status==='play'&&!A){
    const r=stepMove(lvl,S,preview);
    if(r.k!=='blocked'){
      const a=cc(S.x,S.y),b=cc(r.to[0],r.to[1]),dx=DIRS[preview][0],dy=DIRS[preview][1];
      ctx.save();ctx.strokeStyle='rgba(127,216,245,.85)';ctx.fillStyle='rgba(127,216,245,.85)';ctx.lineWidth=6*k;ctx.lineCap='round';
      const x0=a[0]+dx*.18*C,y0=a[1]+dy*.18*C+10*k,x1=b[0]-dx*.24*C,y1=b[1]-dy*.24*C+10*k;
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
      const an=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(x1+Math.cos(an)*16*k,y1+Math.sin(an)*16*k);ctx.lineTo(x1+Math.cos(an+2.5)*16*k,y1+Math.sin(an+2.5)*16*k);ctx.lineTo(x1+Math.cos(an-2.5)*16*k,y1+Math.sin(an-2.5)*16*k);ctx.closePath();ctx.fill();
      const g=gp(r.to[0],r.to[1]),s=.66*C;
      ctx.fillStyle='rgba(127,216,245,.30)';ctx.strokeStyle='rgba(127,216,245,.95)';ctx.lineWidth=3;
      rr(g[0]-s/2,g[1]-s-4*k,s,s,.2*s);ctx.fill();ctx.stroke();
      ctx.restore();txt(String(r.o2.top),g[0],g[1]-s/2-4*k,s*.58,'#1A2440');
    }
  }
  // fx: glow / burst / vignette
  for(const f of fx){
    const u=f.a/f.dur;
    if(f.t==='glow'&&lvl.gate){const g=gp(lvl.gate[0],lvl.gate[1]),rad=(60+u*190)*k;
      const rg=ctx.createRadialGradient(g[0],g[1]-100*k,2,g[0],g[1]-100*k,rad);rg.addColorStop(0,'rgba(254,251,214,'+.9*(1-u)+')');rg.addColorStop(1,'rgba(254,224,144,0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);}
    if(f.t==='burst'){const g=gp(f.x,f.y);for(let i=0;i<10;i++){const a=i*.628+u*1.4,r=(30+u*120)*k;ctx.fillStyle='rgba(254,224,144,'+(1-u)+')';star4(g[0]+Math.cos(a)*r,g[1]-60*k+Math.sin(a)*r*.8,(14-u*6)*k,u*4+i);ctx.fill();}}
    if(f.t==='vig'){const rg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);
      rg.addColorStop(0,'rgba(253,131,110,0)');rg.addColorStop(1,'rgba(230,60,50,'+.5*(1-u)+')');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);}
  }
  // HUD
  const hs=Math.min(44,W*.105),hx=Math.max(14,SAFE.l)+hs/2,hy=Math.max(14,SAFE.t)+hs/2+6;
  for(let i=0;i<3;i++)spr(i<S.hearts?'heart':'heart-off',hx+i*(hs+4),hy,{s:hs/48/k});
  const mx=W-Math.max(14,SAFE.r)-6;
  txt(String(S.moves),mx,hy,hs*.8,'#1A2440','right');
  ctx.save();ctx.font='800 '+hs*.8+'px system-ui';const mw=ctx.measureText(String(S.moves)).width;ctx.restore();
  ctx.save();ctx.fillStyle='#1A2440';for(const [ox,oy] of[[-14,5],[-2,-3]]){ctx.beginPath();ctx.ellipse(mx-mw-18+ox,hy+oy,5,8,.25,0,7);ctx.fill();}ctx.restore();
  txt(lvlN+' / '+LV.length,W/2,hy,hs*.42,'rgba(26,36,64,.6)');
  if(dutyDone()){ctx.save();ctx.fillStyle='rgba(255,255,255,.85)';ctx.strokeStyle='#8FBF6A';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx-hs/2+14,hy+hs/2+18,9,0,7);ctx.fill();ctx.stroke();ctx.strokeStyle='#5E9A3A';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx-hs/2+9,hy+hs/2+18);ctx.lineTo(hx-hs/2+13,hy+hs/2+22);ctx.lineTo(hx-hs/2+20,hy+hs/2+14);ctx.stroke();ctx.restore();}
  // overlay
  if(overlayOn){
    const u=Math.min(1,overlayT/260);
    ctx.fillStyle='rgba(26,36,64,'+.35*u+')';ctx.fillRect(0,0,W,H);
    const cw=Math.min(W-40,340),ch=250,cx=W/2,cy=H/2;
    ctx.save();ctx.translate(cx,cy);ctx.scale(.9+.1*sm(u),.9+.1*sm(u));ctx.globalAlpha=u;
    ctx.fillStyle='#FDF7E5';ctx.strokeStyle='#9E8F81';ctx.lineWidth=3;rr(-cw/2,-ch/2,cw,ch,28);ctx.fill();ctx.stroke();
    if(S.status==='clear'){
      const st=starsFor(S.moves,lvl.par);
      for(let i=0;i<3;i++){const sx=(i-1)*70,pop=Math.max(0,Math.min(1,(overlayT-120-i*130)/200)),on=i<st;
        ctx.fillStyle=on?'#FEE090':'#E6E1EE';ctx.strokeStyle=on?'#E7B94F':'#CFC9DD';ctx.lineWidth=3;
        ctx.save();ctx.translate(sx,-70+(i===1?-10:0));const sc=on?(.4+.6*sm(pop)):1;ctx.scale(sc,sc);
        ctx.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,r=j%2?15:34;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
      txt(S.moves+' 걸음',0,-8,26,'#1A2440');
      txt('최단 '+lvl.par,0,22,17,'rgba(26,36,64,.6)',null,700);
    }else{
      txt('앗!',0,-48,40,'#1A2440');
      ctx.fillStyle='#FD836E';ctx.save();ctx.translate(0,8);for(let i=0;i<3;i++){ctx.save();ctx.translate((i-1)*44,0);ctx.globalAlpha*=.35;heartPath(14);ctx.fill();ctx.restore();}ctx.restore();
    }
    ctx.restore();
    ctx.save();ctx.globalAlpha=u;for(const b of buttons())if(b.w)drawBtn(b);ctx.restore();
  }
  for(const b of buttons())if(b.r)drawBtn(b);
}

/* ---------- step ---------- */
function step(dt){
  clock+=dt;stepAnim(dt);
  for(const f of fx)f.a+=dt;fx=fx.filter(f=>f.a<f.dur);
  if(!A&&S.status!=='play'&&!overlayOn){overlayWait+=dt;if(overlayWait>=(S.status==='clear'?600:350)){overlayOn=true;overlayT=0;}}
  if(overlayOn)overlayT+=dt;
  draw();
}

/* ---------- input ---------- */
const SW=24;
function dirOf(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
let ptr=null;
const P=e=>({x:e.clientX,y:e.clientY});
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=P(e);ptr={sx:p.x,sy:p.y,btn:hit(p.x,p.y)};});
cv.addEventListener('pointermove',e=>{
  if(!ptr||ptr.btn)return;const p=P(e),dx=p.x-ptr.sx,dy=p.y-ptr.sy;
  preview=(Math.hypot(dx,dy)>=SW&&S.status==='play')?dirOf(dx,dy):null;if(!A)draw();
});
cv.addEventListener('pointerup',e=>{
  if(!ptr)return;const p=P(e),dx=p.x-ptr.sx,dy=p.y-ptr.sy,b=ptr.btn;ptr=null;preview=null;
  if(b){if(hit(p.x,p.y)===b)press(b);draw();return;}
  if(Math.hypot(dx,dy)>=SW)doMove(dirOf(dx,dy));
  else tapCell(p.x,p.y);
  draw();
});
cv.addEventListener('pointercancel',()=>{ptr=null;preview=null;draw();});
function tapCell(px,py){
  if(S.status!=='play')return'ignored';
  const x=Math.floor((px-GX)/C),y=Math.floor((py-GY)/(C*RYK)),dx=x-S.x,dy=y-S.y;
  if(Math.abs(dx)+Math.abs(dy)!==1)return'ignored';
  return doMove(dirOf(dx,dy));
}
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{
  if(KEYS[e.key]){e.preventDefault();doMove(KEYS[e.key]);}
  else if(e.key==='z'||e.key==='Z'||e.key==='Backspace')doUndo();
  else if(e.key==='r'||e.key==='R')press('restart');
  draw();
});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',resize);

/* ---------- test hook (PROTO_WORKFLOW §6) ---------- */
window.T={
  get state(){return{level:lvlN,par:lvl.par,x:S.x,y:S.y,top:S.o.top,north:S.o.north,east:S.o.east,hearts:S.hearts,moves:S.moves,status:S.status,alive:S.alive.slice(),enemies:lvl.enemies.map((e,i)=>({x:e.x,y:e.y,n:e.n,alive:S.alive[i]})),gateOpen:gateOpen(S),animating:!!A,overlay:overlayOn,hist:hist.length,silhouettes:[...silSet],mode:MODE,dutyMs,build:BUILD};},
  step,
  input(kind,x,y){
    const r=(()=>{
      if(kind.startsWith('swipe-'))return doMove(kind.slice(6));
      if(kind==='undo')return doUndo();
      if(kind==='restart'){startLevel(lvlN,'tap');return'restart';}
      if(kind==='next'){doNext();return'next';}
      if(kind==='tap'){finishAnim();return tapCell(x,y);}
      return'?';
    })();
    draw();return r;
  },
  load(n){startLevel(Math.max(1,Math.min(LV.length,n|0)),'auto');draw();},
  assets(){const ok=[],miss=[];for(const n in IMG)(IMG[n].ok?ok:miss).push(n);return{ok,miss};}
};

/* ---------- boot ---------- */
const LV=LEVELS.map(parseLevel);
resize();
startLevel(MODE==='play'?Math.min(LV.length,LS.get('progress',0)+1):1,'auto');
resize();
setInterval(dutyTick,1000);
let lastT=performance.now();
(function loop(t){const dt=Math.min(50,t-lastT);lastT=t;step(dt);requestAnimationFrame(loop);})(lastT);
})();
</script>
