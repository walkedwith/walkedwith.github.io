<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>party</title>
<style>
html,body{margin:0;height:100%;background:#1b1a24;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#sp{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
</style></head><body><canvas id="cv"></canvas><div id="sp"></div>
<script>
// legend: # wall . floor S stairs P party start M mushroom K sock W thin wall (mole digs)
const MAPS=[[
"########",
"#.....S#",
"#.####.#",
"#.M....#",
"#......#",
"#.####.#",
"#......#",
"#....M.#",
"#......#",
"#..#...#",
"#..P...#",
"########"],[
"########",
"#S.#...#",
"#..W.K.#",
"#..#...#",
"####.###",
"#......#",
"#.M....#",
"#......#",
"#.#..#.#",
"#......#",
"#...P..#",
"########"],[
"########",
"#....WS#",
"#.######",
"#.K....#",
"######.#",
"#...M..#",
"#.######",
"#K.....#",
"######.#",
"#......#",
"#P.....#",
"########"]];
const W=8,H=12,D=[[0,1],[0,-1],[-1,0],[1,0]];
const ANI=[{c:'#f4f1ea'},{c:'#8a5a3a'},{c:'#5cc15a'}]; // 0 rabbit, 1 mole, 2 frog
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),sp=document.getElementById('sp');
let fl,hearts,lead=1,grid,en,body,state,cw,chh,cs,ox,oy,hudH,bot,isz,dpr;
const at=(l,x,y)=>l.find(p=>p.x==x&&p.y==y);
const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);

function load(n){
  fl=n;en=[];body=[];
  grid=MAPS[n].map((r,y)=>[...r].map((c,x)=>{
    if(c=='P')body=[{x,y}];
    if(c=='M'||c=='K')en.push({x,y,k:c,hp:2});
    return 'PMK'.includes(c)?'.':c;}));
  while(body.length<3){ // followers: extend a line of floor cells behind the leader
    const t=body[body.length-1];
    body.push(D.map(d=>({x:t.x+d[0],y:t.y+d[1]})).find(p=>grid[p.y][p.x]=='.'&&!at(body,p.x,p.y)&&!at(en,p.x,p.y)));}
  plan();
}
function restart(){hearts=3;state='play';load(0);draw();}

// leader can enter: floor/stairs, W only for the mole; not an enemy, not own body (tail is vacated by the step)
function pass(x,y){const t=grid[y]&&grid[y][x];
  return !!t&&(t=='.'||t=='S'||(t=='W'&&lead==1))&&!at(en,x,y)&&!at(body.slice(0,2),x,y);}
function epass(x,y){const t=grid[y]&&grid[y][x];
  return t=='.'&&!at(en,x,y)&&!at(body,x,y);}

function path(tx,ty){ // BFS for current leader; an enemy at the target is allowed as goal
  const s=body[0],k=(x,y)=>x+','+y,prev={[k(s.x,s.y)]:null},q=[[s.x,s.y]];
  while(q.length){
    const [x,y]=q.shift();
    if(x==tx&&y==ty){const p=[];let c=[x,y];while(prev[k(...c)]){p.unshift(c);c=prev[k(...c)];}return p;}
    for(const d of D){const nx=x+d[0],ny=y+d[1];
      if(k(nx,ny) in prev)continue;
      if(pass(nx,ny)||(nx==tx&&ny==ty&&at(en,nx,ny))){prev[k(nx,ny)]=[x,y];q.push([nx,ny]);}}}
  return null;
}
function go(cells){ // snake step: each cell visited is pushed at the front, tail drops off
  for(const c of cells){if(grid[c.y][c.x]=='W')grid[c.y][c.x]='.';body.unshift(c);}
  body.length=3;
}
function move(d,two){
  const h=body[0],c1={x:h.x+d[0],y:h.y+d[1]};
  if(!pass(c1.x,c1.y))return false;
  const cells=[c1],c2={x:c1.x+d[0],y:c1.y+d[1]};
  if(lead==0&&two&&grid[c1.y][c1.x]=='.'&&pass(c2.x,c2.y))cells.push(c2);
  go(cells);return true;
}
function hit(e){if(--e.hp<=0)en.splice(en.indexOf(e),1);}

function chase(e){ // greedy 4-neighbour, must get strictly closer
  const h=body[0];let best=null,bd=man(e,h);
  for(const d of D){const p={x:e.x+d[0],y:e.y+d[1]};
    if(epass(p.x,p.y)&&man(p,h)<bd){best=p;bd=man(p,h);}}
  return best;
}
function plan(){for(const e of en){
  if(e.k=='M')e.next=chase(e);
  else{const o=D.map(d=>({x:e.x+d[0],y:e.y+d[1]})).filter(p=>epass(p.x,p.y));e.next=o.length?o[Math.floor(Math.random()*o.length)]:null;}}}
function enemiesAct(){for(const e of en.slice()){
  if(man(e,body[0])==1){hearts--;if(hearts<=0)return;continue;}
  const t=e.k=='M'?chase(e):e.next;
  if(t&&epass(t.x,t.y)){e.x=t.x;e.y=t.y;}}}
function end(){
  const h=body[0];
  if(grid[h.y][h.x]=='S'){if(fl>=2)state='win';else load(fl+1);}
  else{enemiesAct();if(hearts<=0)state='dead';else plan();}
  draw();
}
function tap(cx,cy){
  if(state!='play'||at(body,cx,cy))return;
  const h=body[0],e=at(en,cx,cy);
  if(e&&man(e,h)==1){hit(e);return end();}
  const dx=cx-h.x,dy=cy-h.y,sx=Math.sign(dx),sy=Math.sign(dy);
  if(lead==2&&Math.abs(dx)+Math.abs(dy)==2&&(!dx||!dy)&&at(en,h.x+sx,h.y+sy)&&pass(cx,cy)){go([{x:cx,y:cy}]);return end();}
  const p=path(cx,cy);if(!p||!p.length)return;
  const d=[p[0][0]-h.x,p[0][1]-h.y];
  const two=p[1]&&p[1][0]-p[0][0]==d[0]&&p[1][1]-p[0][1]==d[1];
  if(move(d,two))end();
}
function key(d){
  if(state!='play')return;
  const h=body[0],c1={x:h.x+d[0],y:h.y+d[1]},e=at(en,c1.x,c1.y);
  if(e){const c2={x:c1.x+d[0],y:c1.y+d[1]};
    if(lead==2&&pass(c2.x,c2.y))go([c2]);else hit(e);}
  else if(!move(d,true))return;
  end();
}


// ---------- draw (visual only; game state above is never written here) ----------
function lay(){
  dpr=window.devicePixelRatio||1;cw=innerWidth;chh=innerHeight;
  cv.width=cw*dpr;cv.height=chh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const s=getComputedStyle(sp),top=parseFloat(s.paddingTop)||0;bot=parseFloat(s.paddingBottom)||0;
  hudH=44+top;isz=Math.min(64,cw/5);
  const barH=isz+24+bot,ah=chh-hudH-barH;
  cs=Math.floor(Math.min(cw/W,ah/H));ox=(cw-cs*W)/2;oy=hudH+(ah-cs*H)/2;
}
let X=ctx,off,offK,P={torch:[]},T=0,snap={},pulse=null,fxm={sm:[],st:[],vig:-1e9,tr:null};
const TD=120,OL='rgba(45,28,40,.85)',CY='#4de0e8';
const hs=(x,y,s)=>((x*73856093)^(y*19349663)^(s*83492791))>>>0;
const rr=(x,y,w,h,r)=>{X.beginPath();X.roundRect(x,y,w,h,r);};
const lerp=(a,b,t)=>a+(b-a)*t,c01=v=>Math.max(0,Math.min(1,v));
const circ=(x,y,r,f,st,lw)=>{X.beginPath();X.arc(x,y,r,0,7);if(f){X.fillStyle=f;X.fill();}if(st){X.strokeStyle=st;X.lineWidth=lw||1.5;X.stroke();}};
const blob=(x,y,rx,ry,f,rot)=>{X.beginPath();X.ellipse(x,y,rx,ry,rot||0,0,7);X.fillStyle=f;X.fill();X.lineWidth=1.5;X.strokeStyle=OL;X.stroke();};
const solid=(x,y)=>{const r=grid[y];return !r||r[x]===undefined||r[x]=='#';};
const flr=(x,y)=>{const t=grid[y]&&grid[y][x];return t=='.'||t=='S';};
const line=(c,w,pts)=>{X.strokeStyle=c;X.lineWidth=w;X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();};

// --- static layer pieces ---
function floor(x,y){
  const px=ox+x*cs,py=oy+y*cs,h=hs(x,y,1);
  X.fillStyle=['#9189b0','#968eb5','#8c84ab'][h%3];X.fillRect(px,py,cs,cs);
  X.fillStyle='rgba(255,255,255,.13)';X.fillRect(px,py,cs,1.5);X.fillRect(px,py,1.5,cs);
  X.fillStyle='rgba(45,35,95,.3)';X.fillRect(px,py+cs-1.5,cs,1.5);X.fillRect(px+cs-1.5,py,1.5,cs);
  rr(px+3,py+3,cs-6,cs-6,5);X.strokeStyle='rgba(255,255,255,.07)';X.lineWidth=1;X.stroke();
  if(solid(x,y-1)||(grid[y-1]&&grid[y-1][x]=='W')){const g=X.createLinearGradient(0,py,0,py+cs*.45);g.addColorStop(0,'rgba(35,25,75,.42)');g.addColorStop(1,'rgba(35,25,75,0)');X.fillStyle=g;X.fillRect(px,py,cs,cs*.45);}
  if(solid(x-1,y)){const g=X.createLinearGradient(px,0,px+cs*.3,0);g.addColorStop(0,'rgba(35,25,75,.3)');g.addColorStop(1,'rgba(35,25,75,0)');X.fillStyle=g;X.fillRect(px,py,cs*.3,cs);}
  if(h%5==0){const a=px+cs*(.2+(h>>3)%4*.15),b=py+cs*(.25+(h>>5)%4*.12);line('rgba(60,50,110,.45)',1.2,[[a,b],[a+cs*.14,b+cs*.1],[a+cs*.1,b+cs*.24],[a+cs*.26,b+cs*.34]]);}
  if(h%7==1){const a=px+cs*.65,b=py+cs*.7;X.fillStyle='rgba(50,40,100,.3)';X.beginPath();X.ellipse(a+1,b+2,cs*.07,cs*.04,0,0,7);X.fill();X.fillStyle='#b9b2d2';X.beginPath();X.ellipse(a,b,cs*.065,cs*.045,0,0,7);X.fill();}
}
function wall(x,y,w){
  const px=ox+x*cs,py=oy+y*cs,fh=(!w&&solid(x,y+1))?0:cs*.3,h=hs(x,y,3);
  X.fillStyle=w?'#7d7599':'#3a3459';X.fillRect(px,py,cs,cs);
  rr(px+1,py+1,cs-2,cs-1-fh,5);X.fillStyle=w?'#aaa2c6':'#625b8c';X.fill();
  X.fillStyle='rgba(255,255,255,.2)';rr(px+4,py+2.5,cs-8,2,1);X.fill();
  const th=cs-fh,sx=px+cs*(.32+(h%4)*.1);
  line('rgba(35,28,75,.4)',1,[[sx,py+3],[sx,py+th-2]]);line('rgba(35,28,75,.3)',1,[[px+3,py+th*.55],[sx,py+th*.55]]);
  if(h%3==0)line('rgba(35,28,75,.5)',1.2,[[px+cs*.6,py+4],[px+cs*.52,py+th*.35],[px+cs*.66,py+th*.55],[px+cs*.6,py+th-3]]);
  if(fh){line('rgba(20,15,45,.55)',1,[[px+2,py+cs-fh*.5],[px+cs-2,py+cs-fh*.5]]);line('rgba(20,15,45,.5)',1,[[px+cs*.4,py+cs-fh*.5],[px+cs*.4,py+cs-2]]);line('rgba(20,15,45,.5)',1,[[px+cs*.75,py+th],[px+cs*.75,py+cs-fh*.5]]);}
  if(w){X.fillStyle='#7a5a44';for(let i=0;i<7;i++)X.fillRect(px+hs(x,y,10+i)%(cs-4)+1,py+hs(x,y,20+i)%(cs-4)+1,2,2);
    line('#5a5378',1.5,[[px+3,py+th*.3],[px+cs*.35,py+th*.5],[px+cs*.5,py+th*.3],[px+cs-3,py+th*.7]]);}
  else if(h%6==0){X.fillStyle='#5aa05a';for(const[a,b]of[[.12,.08],[.28,.04]]){X.beginPath();X.ellipse(px+cs*a+3,py+cs*b+3,cs*.1,cs*.05,.6,0,7);X.fill();}}
}
function crystal(cx,cy,s){
  for(const[a,b,w,h]of[[0,0,.22,1],[-.3,.2,.16,.62],[.27,.24,.17,.55]]){
    const x=cx+a*s,y=cy+b*s;X.beginPath();X.moveTo(x,y-h*s*.6);X.lineTo(x+w*s,y-h*s*.1);X.lineTo(x+w*s*.8,y+h*s*.4);X.lineTo(x-w*s*.8,y+h*s*.4);X.lineTo(x-w*s,y-h*s*.1);X.closePath();
    X.fillStyle='#8b4fe0';X.fill();X.strokeStyle='#3f2085';X.lineWidth=1;X.stroke();
    X.fillStyle='#c9a2ff';X.beginPath();X.moveTo(x,y-h*s*.6);X.lineTo(x-w*s,y-h*s*.1);X.lineTo(x-w*s*.3,y+h*s*.4);X.lineTo(x,y);X.fill();}
}
function props(x,y,cnt){
  const px=ox+x*cs,py=oy+y*cs,v=hs(x,y,fl+5)%9,fb=flr(x,y+1),fs=flr(x-1,y)||flr(x+1,y),m=px+cs/2;
  if(x==W-1&&y==H-1||x==0&&y==0)crystal(m,py+cs*.55,cs*.9);
  else if(fb&&v==0&&cnt.t<3){cnt.t++;P.torch.push({x:m,y:py+cs*.38});
    X.fillStyle='#4a2f1c';X.fillRect(m-cs*.1,py+cs*.5,cs*.2,cs*.3);blob(m,py+cs*.5,cs*.2,cs*.1,'#6b4426');}
  else if(fb&&v==1&&!cnt.b){cnt.b=1;const bx=px+cs*.26,bw=cs*.48,by=py+cs*.1;
    X.fillStyle='#3a2a1a';X.fillRect(bx-2,by-2,bw+4,3);X.beginPath();X.moveTo(bx,by);X.lineTo(bx+bw,by);X.lineTo(bx+bw,by+cs*.62);X.lineTo(bx+bw*.75,by+cs*.52);X.lineTo(bx+bw*.5,by+cs*.64);X.lineTo(bx+bw*.25,by+cs*.52);X.lineTo(bx,by+cs*.62);X.closePath();
    X.fillStyle='#7a2d54';X.fill();X.strokeStyle='#4a1a32';X.lineWidth=1;X.stroke();X.fillStyle='#e0a840';X.beginPath();X.moveTo(m,by+cs*.12);X.lineTo(m+bw*.25,by+cs*.28);X.lineTo(m,by+cs*.44);X.lineTo(m-bw*.25,by+cs*.28);X.fill();}
  else if(fb&&v==2&&cnt.c<3){cnt.c++;crystal(m+cs*.1,py+cs*.5,cs*.6);}
  else if(fs&&v>=3&&v<=4&&cnt.o<3){cnt.o++;const q=py+cs*.55;
    if(v==3){blob(m,q,cs*.26,cs*.3,'#8a5a34');X.strokeStyle='#4a3020';X.lineWidth=2;X.beginPath();X.ellipse(m,q-cs*.12,cs*.25,cs*.07,0,0,3.14);X.ellipse(m,q+cs*.12,cs*.25,cs*.07,0,0,3.14);X.stroke();blob(m,q-cs*.27,cs*.22,cs*.08,'#b07a44');}
    else{blob(m,q+cs*.05,cs*.27,cs*.28,'#7a4a2a');blob(m,q-cs*.2,cs*.2,cs*.07,'#5a331c');blob(m,q-cs*.2,cs*.13,cs*.04,'#2a1810');}}
}
function stairs(x,y){
  const px=ox+x*cs,py=oy+y*cs;P.S={x:px+cs/2,y:py+cs/2};
  rr(px+cs*.06,py+cs*.02,cs*.88,cs*.96,[cs*.4,cs*.4,3,3]);X.fillStyle='#d6bd84';X.fill();X.strokeStyle='#6b5530';X.lineWidth=2;X.stroke();for(let i=0;i<4;i++)line('#8a7442',1,[[px+cs*.5+Math.cos(2.9+i*.9)*cs*.3,py+cs*.52+Math.sin(2.9+i*.9)*cs*.38],[px+cs*.5+Math.cos(2.9+i*.9)*cs*.46,py+cs*.52+Math.sin(2.9+i*.9)*cs*.5]]);
  const ix=px+cs*.2,iw=cs*.6,iy=py+cs*.2,ih=cs*.72,g=X.createLinearGradient(0,iy,0,iy+ih);g.addColorStop(0,'#fff6c0');g.addColorStop(1,'#f2b02a');
  rr(ix,iy,iw,ih,[iw/2,iw/2,2,2]);X.fillStyle=g;X.fill();
  for(let i=0;i<3;i++){const sy=iy+ih*(.78-.2*i),sx=ix+iw*(.05+.22*i);X.fillStyle='#fff0b0';X.fillRect(sx,sy,iw*.95-iw*.22*i,ih*.1);X.fillStyle='#c98a22';X.fillRect(sx,sy+ih*.1,iw*.95-iw*.22*i,ih*.06);}
}
function build(){
  const k=[cw,chh,cs,ox,oy,dpr,fl,grid.map(r=>r.join('')).join('')].join('|');
  if(k==offK)return;offK=k;
  off=off||document.createElement('canvas');off.width=cw*dpr;off.height=chh*dpr;
  X=off.getContext('2d');X.setTransform(dpr,0,0,dpr,0,0);P={torch:[]};
  const g=X.createLinearGradient(0,0,0,chh);g.addColorStop(0,'#2a2644');g.addColorStop(1,'#1e1a32');X.fillStyle=g;X.fillRect(0,0,cw,chh);
  const cnt={t:0,b:0,c:0,o:0};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=grid[y][x];
    if(t=='#')wall(x,y);else if(t=='W')wall(x,y,1);else{floor(x,y);if(t=='S')stairs(x,y);}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]=='#')props(x,y,cnt);
  X=ctx;
}

// --- visual-state sync: diff the game state against the last frame (no hooks into logic) ---
function sync(){
  const B=body;
  if(snap.B!==B){
    const cp=B.map(b=>({x:b.x,y:b.y}));snap={B,p:cp,from:cp,t:-1e9,d:[0,1],hp:hearts,em:new Map()};
    en.forEach(e=>snap.em.set(e,{x:e.x,y:e.y,fx:e.x,fy:e.y,t:-1e9,hp:e.hp,fl:-1e9}));return;}
  if(B.some((b,i)=>b.x!=snap.p[i].x||b.y!=snap.p[i].y)){
    const o=snap.p[0];snap.from=snap.p;snap.p=B.map(b=>({x:b.x,y:b.y}));snap.t=T;
    snap.d=[Math.sign(B[0].x-o.x),Math.sign(B[0].y-o.y)];fxm.tr={a:o,b:{x:B[0].x,y:B[0].y},t:T};}
  if(hearts<snap.hp)fxm.vig=T;snap.hp=hearts;
  for(const e of en){let m=snap.em.get(e);
    if(!m){m={x:e.x,y:e.y,fx:e.x,fy:e.y,t:-1e9,hp:e.hp,fl:-1e9};snap.em.set(e,m);}
    if(e.x!=m.x||e.y!=m.y){m.fx=m.x;m.fy=m.y;m.x=e.x;m.y=e.y;m.t=T;}
    if(e.hp<m.hp){m.hp=e.hp;m.fl=T;fxm.st.push({x:e.x,y:e.y,t:T});}}
  for(const[e,m]of snap.em)if(!en.includes(e)){fxm.sm.push({x:m.x,y:m.y,t:T});fxm.st.push({x:m.x,y:m.y,t:T});snap.em.delete(e);}
}

// --- characters ---
function animal(k,x,y,r,fx,fy){
  const bk=0,up=fy<0,ex=fx*r*.3,ey=(up?-.14:fy>0?.08:0)*r;
  X.fillStyle='rgba(30,20,50,.35)';X.beginPath();X.ellipse(x,y+r*.92,r*.95,r*.3,0,0,7);X.fill();
  const pack=(c,w,h)=>blob(fx?x-fx*r*.85:bk?x:x-r*.8,y+r*.15,w,h,c);
  const scarf=c=>{X.beginPath();X.ellipse(x,y+r*.45,r*.78,r*.3,0,.1,Math.PI-.1);X.strokeStyle=c;X.lineWidth=r*.4;X.lineCap='round';X.stroke();X.lineCap='butt';blob(x-r*.72,y+r*.62,r*.22,r*.14,c,.6);};
  const eyes=(c)=>{if(!bk)for(const s of[-1,1])circ(x+s*r*.34+ex,y-r*.02+ey,r*.1,c);};
  if(k==0){
    if(!bk)pack('#c46a3a',r*.38,r*.45);
    for(const s of[-1,1]){const a=x+s*r*.42+ex*.4;blob(a,y-r*1.1,r*.24,r*.7,'#f6ecdc');X.fillStyle='#f4a6b4';X.beginPath();X.ellipse(a,y-r*1.05,r*.1,r*.45,0,0,7);X.fill();}
    blob(x,y,r,r*.95,'#f6ecdc');if(bk)pack('#c46a3a',r*.5,r*.55);
    scarf('#d9484a');eyes('#34222c');
    if(!bk){circ(x+ex*1.2,y+r*.16+ey,r*.1,'#e87a8c');for(const s of[-1,1])circ(x+s*r*.58+ex,y+r*.12+ey,r*.13,'rgba(244,140,160,.5)');}
  }else if(k==1){
    for(const s of[-1,1])blob(x+s*r*.72,y-r*.62,r*.2,r*.2,'#6a4c38');
    blob(x,y,r,r*.95,'#7a5a44');
    X.fillStyle='rgba(255,255,255,.13)';X.beginPath();X.ellipse(x-r*.3,y-r*.4,r*.4,r*.25,-.5,0,7);X.fill();
    scarf('#3ab8b0');

function mush(x,y,r){

function sock(x,y,r){

function enemy(e){
  const m=snap.em.get(e)||{x:e.x,y:e.y,fx:e.x,fy:e.y,t:-1e9,fl:-1e9},f=c01((T-m.t)/TD),q=f*(2-f);

function pdraw(i){

const party=()=>{for(let i=2;i>=0;i--)pdraw(i);};

// --- effects & HUD ---
function star(x,y,s,a){X.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.35:s,t=i*Math.PI/4;X.lineTo(x+Math.cos(t)*r,y+Math.sin(t)*r);}X.closePath();X.fillStyle='rgba(255,246,170,'+a+')';X.fill();circ(x,y,s*.25,'rgba(255,255,255,'+a+')');}

function draw(){
  if(!cs)return;
  T=performance.now();sync();build();X=ctx;X.drawImage(off,0,0,cw,chh);
  X.globalCompositeOperation='lighter';
  const glow=(x,y,R,c,a)=>{const g=X.createRadialGradient(x,y,2,x,y,R);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');X.fillStyle=g;X.fillRect(x-R,y-R,R*2,R*2);};
  for(const t of P.torch)glow(t.x,t.y,cs*1.5,'255,160,60',.32*(.75+.25*Math.sin(T/90+t.x)*Math.sin(T/53)));
  if(P.S)glow(P.S.x,P.S.y,cs*1.6,'255,200,70',.2+.06*Math.sin(T/400));
  X.globalCompositeOperation='source-over';
  for(const t of P.torch){const h=cs*.3*(1+.14*Math.sin(T/70+t.x)),w=cs*.13;
    for(const[s,c]of[[1,'#ff8a1e'],[.55,'#ffe27a']]){X.beginPath();X.moveTo(t.x,t.y-h*s*1.2);X.quadraticCurveTo(t.x+w*s*1.4,t.y-h*s*.2,t.x,t.y+h*s*.3);X.quadraticCurveTo(t.x-w*s*1.4,t.y-h*s*.2,t.x,t.y-h*s*1.2);X.fillStyle=c;X.fill();}}
  const pa=pulse?1-(T-pulse.t)/450:0;
  if(pa>0){const px=ox+pulse.x*cs,py=oy+pulse.y*cs;rr(px+3,py+3,cs-6,cs-6,6);X.fillStyle='rgba(77,224,232,'+.25*pa+')';X.fill();
    X.strokeStyle='rgba(77,224,232,'+pa+')';X.lineWidth=2;X.shadowColor=CY;X.shadowBlur=8;X.stroke();X.shadowBlur=0;circ(px+cs/2,py+cs/2,cs*(.12+.2*(1-pa)),0,'rgba(180,250,255,'+pa+')',2);}
  const ta=fxm.tr?1-(T-fxm.tr.t)/500:0;
  if(ta>0){const a=fxm.tr.a,b=fxm.tr.b;X.save();X.setLineDash([cs*.1,cs*.14]);X.lineCap='round';X.strokeStyle='rgba(77,224,232,'+ta+')';X.lineWidth=3.5;X.beginPath();X.moveTo(ox+(a.x+.5)*cs,oy+(a.y+.5)*cs);X.lineTo(ox+(b.x+.5)*cs,oy+(b.y+.5)*cs);X.stroke();X.restore();}
  const it=en.map(e=>({y:snap.em.has(e)?snap.em.get(e).y:e.y,f:()=>enemy(e)}));
  for(let i=0;i<3;i++)it.push({y:body[i].y+.01*(3-i),f:()=>pdraw(i)});
  it.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  fxm.sm=fxm.sm.filter(s=>T-s.t<450);fxm.st=fxm.st.filter(s=>T-s.t<260);
  for(const s of fxm.sm){const a=(T-s.t)/450;for(let j=0;j<5;j++){const t=j*1.26+s.x;circ(ox+(s.x+.5)*cs+Math.cos(t)*cs*.35*a,oy+(s.y+.5)*cs+Math.sin(t)*cs*.3*a-cs*.1*a,cs*(.1+.17*a),'rgba(236,230,246,'+.75*(1-a)+')');}}
  for(const s of fxm.st){const a=(T-s.t)/260;star(ox+(s.x+.5)*cs+cs*.2,oy+(s.y+.5)*cs-cs*.3,cs*(.12+.2*a),1-a);}
  const va=1-(T-fxm.vig)/200;
  if(va>0){const g=X.createRadialGradient(cw/2,chh/2,Math.min(cw,chh)*.3,cw/2,chh/2,Math.max(cw,chh)*.7);g.addColorStop(0,'rgba(255,30,40,0)');g.addColorStop(1,'rgba(255,30,40,'+.6*va+')');X.fillStyle=g;X.fillRect(0,0,cw,chh);}
  for(let i=0;i<3;i++)heart(26+i*32,hudH-20,10,i<hearts);
  for(let i=0;i<3;i++){const x=cw-22-(2-i)*20,on=i<=fl;circ(x,hudH-20,6.5,on?'#f6c93a':'#4a4558',on?'#9a6a10':'#2a2636',1.5);if(on)circ(x-2,hudH-22,2,'rgba(255,255,255,.75)');}
  for(let i=0;i<3;i++){const p=icon(i),L=i==lead;
    rr(p.x,p.y,isz,isz,12);const g=X.createLinearGradient(0,p.y,0,p.y+isz);g.addColorStop(0,'#4d4a6c');g.addColorStop(1,'#2b2840');X.fillStyle=g;X.fill();
    X.save();X.clip();animal(i,p.x+isz/2,p.y+isz*.6,isz*.3,0,1);X.restore();
    rr(p.x,p.y,isz,isz,12);X.strokeStyle=L?CY:'#6a6690';X.lineWidth=L?3.5:2;if(L){X.shadowColor=CY;X.shadowBlur=14;}X.stroke();X.shadowBlur=0;}

}
const icon=i=>({x:cw/2+(i-1)*(isz+14)-isz/2,y:chh-bot-isz-12});

cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();

addEventListener('keydown',e=>{const d={ArrowDown:D[0],ArrowUp:D[1],ArrowLeft:D[2],ArrowRight:D[3]}[e.key];if(d){e.preventDefault();key(d);}});
