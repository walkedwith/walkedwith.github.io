<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>산책 공 몰기 — 1일차</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9bd0ec;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
#sa{position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
</style></head><body>
<canvas id="c"></canvas><div id="sa"></div>
<script>
(()=>{
const H=640,GY=520,R=16,GATE=2400,cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=360,S=1,SA={t:0,l:0,r:0};
// ---- images
const IM={};let loaded=0;
['max-run-master-v1-left-8f.png','max-push-master-v1-left-8f-cute.png','max-idle-master-v1-front-8f.png','frontyard-story-720.webp'].forEach(n=>{
  const i=new Image();i.onload=i.onerror=()=>{loaded++};i.src='art/'+n;IM[n.split('-')[1]=== 'run'?'run':n.split('-')[1]==='push'?'push':n.split('-')[1]==='idle'?'idle':'bg']=i});
const ready=()=>loaded>=4&&IM.run.naturalWidth;
// ---- world
const props=[],mk=(t,x,o)=>props.push(Object.assign({t,x,done:0,a:0,hits:0},o));
[500,1250,1950].forEach(x=>mk('cone',x));
[820,1480,2150].forEach(x=>mk('pot',x));
[1050,1700].forEach(x=>mk('line',x,{w:240,sw:0}));
mk('mail',2280);
let max,ball,fx,cam,score,phase,now,down,ignore,nudgeX,stuck,btn;
function reset(){
  max={x:100,y:0,dir:1,push:0,pushLen:.15,whiff:0,t:0,nudgeCd:0};
  ball={x:160,y:GY-R,vx:0,vy:0,rot:0};
  fx=[];cam={x:0,y:0};score=0;phase='idle';down=null;ignore=false;nudgeX=-1e9;stuck=0;btn=null;
  props.forEach(p=>{p.done=0;p.a=0;p.hits=0;p.sw=0;p.sh=0});
  cam.x=max.x-.35*W;
}
const burst=(x,y,n)=>{for(let i=0;i<n;i++){const a=i/n*6.28+Math.random();fx.push({k:'s',x,y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,l:.45,m:.45,r:5})}};
const dust=(x,y,n)=>{for(let i=0;i<n;i++)fx.push({k:'d',x,y,vx:-30-Math.random()*110,vy:-20-Math.random()*50,l:.5,m:.5,r:6+Math.random()*5})};
// ---- input (game clock `now`, so it can be driven by hand)
function inDown(sx,sy){
  if(phase==='idle'){phase='play';ignore=true;return}
  if(phase==='end'){const x=sx/S,y=sy/S;if(btn&&x>btn.x&&x<btn.x+btn.w&&y>btn.y&&y<btn.y+btn.h){reset();phase='play'}return}
  down=now}
function inUp(){
  if(ignore){ignore=false;down=null;return}
  if(down==null||phase!=='play')return;
  const d=now-down;down=null;
  const dx=ball.x-max.x,near=dx>-15&&dx<90&&ball.y>=GY-R-60;
  if(!near){max.whiff=.25;return}
  max.push=d<.18?.15:.25;max.pushLen=max.push;max.kick=d>=.18;
  if(d<.18){ball.vx+=260;ball.vy-=60}
  else{const p=Math.min(1,d/.9);ball.vx=350+650*p;ball.vy=-(200+500*p);dust(max.x-10,GY,7)}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();inDown(e.clientX*dpr(),e.clientY*dpr())});
addEventListener('pointerup',inUp);addEventListener('pointercancel',inUp);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)inDown(-1,-1)}});
addEventListener('keyup',e=>{if(e.code==='Space')inUp()});
['gesturestart','dblclick','contextmenu'].forEach(n=>addEventListener(n,e=>e.preventDefault()));
const dpr=()=>Math.min(devicePixelRatio||1,3);
function resize(){
  const d=dpr();cv.width=innerWidth*d;cv.height=innerHeight*d;S=cv.height/H;W=cv.width/S;
  const cs=getComputedStyle(document.getElementById('sa'));SA={t:parseFloat(cs.paddingTop)||0,l:parseFloat(cs.paddingLeft)||0,r:parseFloat(cs.paddingRight)||0};
}
addEventListener('resize',resize);
// ---- simulation
function step(dt){
  now+=dt;const g=ball,m=max;
  // max
  m.t+=dt;m.push=Math.max(0,m.push-dt);m.whiff=Math.max(0,m.whiff-dt);m.nudgeCd=Math.max(0,m.nudgeCd-dt);
  if(phase==='play'){
    let v=0;
    if(m.push<=0){
      if(g.x>m.x+40)v=140;
      else{
        if(g.x-m.x<15)v=-170; // ball behind/under him: walk back until it is just ahead (hysteresis vs the 40px walk rule avoids dithering)
        else if(m.nudgeCd<=0&&Math.abs(g.vx)<60&&g.y>=GY-R-4){ // retrieve: gentle nudge, escalates if the ball keeps getting stopped by a prop
          stuck=g.x<nudgeX+30?stuck+1:0;nudgeX=g.x;
          g.vx+=Math.min(330,130+70*stuck);g.vy-=40;m.push=m.pushLen=.15;m.kick=false;m.nudgeCd=.5}}
      m.x+=v*dt;if(v)m.dir=Math.sign(v)}
    m.v=v;
  }else if(phase==='end'){m.v=m.x<GATE-120?170:0;m.x+=m.v*dt;m.dir=1} // trots to the gate, then faces front
  // ball
  const sub=3,h=dt/sub;
  for(let s=0;s<sub;s++){
    if(phase==='end')break;
    g.vy+=1400*h;g.x+=g.vx*h;g.y+=g.vy*h;
    const air=g.y<GY-R-1;g.vx*=Math.exp(-(air?.12:2.4)*h);
    if(g.y>=GY-R){g.y=GY-R;if(g.vy>0){g.vy=g.vy>70?-g.vy*.45:0;g.vx*=.92}}
    if(g.y>=GY-R-1&&Math.abs(g.vx)<8)g.vx=0;
    g.rot+=g.vx*h/R;
    props.forEach(p=>hit(p));
  }
  if(g.y<GY-R-4&&phase==='play')fx.push({k:'t',x:g.x,y:g.y,vx:0,vy:0,l:.3,m:.3,r:R*.7});
  if(phase==='play'&&g.x>=GATE){phase='end';m.t=0;g.vx=0;g.x=GATE}
  // props anim
  props.forEach(p=>{p.a+=dt;p.sw=(p.sw||0)*Math.exp(-2.5*dt);p.dg=(p.dg||0)*Math.exp(-6*dt)});
  // fx
  fx.forEach(f=>{f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.k==='h'){f.vy+=1400*dt;if(f.y>GY-3){f.y=GY-3;f.vy*=-.3;f.vx*=.6}}if(f.k==='d')f.vy-=20*dt});
  fx=fx.filter(f=>f.l>0);
  // camera
  const lead=Math.min(g.x,m.x+1500);let tx=m.x-.35*W;
  if(phase==='end')tx=GATE-.6*W;else if(lead-tx>.8*W)tx=lead-.8*W;
  cam.x+=(tx-cam.x)*Math.min(1,6*dt);if(phase==='play'&&g.x-cam.x>.9*W)cam.x=g.x-.9*W; // fast kicks outrun the lerp
  cam.x=Math.max(0,cam.x);
  const ty=Math.min(70,Math.max(0,(GY-R-g.y-100)*.5));cam.y+=(ty-cam.y)*Math.min(1,4*dt);
}
function hit(p){
  const g=ball,dx=g.x-p.x;
  if(p.t==='cone'&&!p.done){
    if(Math.abs(dx)<R+13&&g.y>GY-44-R){
      if(Math.abs(g.vx)>150){p.done=1;p.a=0;p.dir=Math.sign(g.vx);score++;burst(p.x,GY-30,7);g.vx*=.6}
      else{g.x=p.x-Math.sign(g.vx||1)*(R+13);g.vx*=-.3}}
  }else if(p.t==='pot'&&!p.done){
    if(Math.abs(dx)<R+25&&g.y>GY-70-R){
      if(Math.abs(g.vx)>100){p.done=1;p.a=0;score+=2;burst(p.x,GY-55,8);
        for(let i=0;i<4;i++)fx.push({k:'h',x:p.x,y:GY-55,vx:(i-1.5)*70+Math.sign(g.vx)*60,vy:-200-Math.random()*150,l:1.6,m:1.6,r:6});g.vx*=.35}
      else{g.x=p.x-Math.sign(g.vx||1)*(R+25);g.vx*=-.3}}
  }else if(p.t==='line'&&p.x<g.x&&g.x<p.x+p.w){
    if(Math.abs(g.y-400)<R){p.sw=1;if(!p.done){p.done=1;score+=3;burst(g.x,400,8)}}
  }else if(p.t==='mail'&&p.hits<2&&Math.abs(dx)<R+22&&g.y>GY-76-R){ // after 2 dings it lets the ball pass (no soft-lock)
    p.hits++;p.dg=1;g.x=p.x+(dx<0?-1:1)*(R+22);g.vx=-Math.sign(dx||1)*Math.max(120,Math.abs(g.vx)*.45);
    if(p.hits===1){score++;burst(p.x,GY-70,6)}}
}
// ---- drawing
const sx=x=>x-cam.x;
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function paw(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y+3*s,7*s,6*s,0,0,6.3);ctx.fill();[[-8,-4],[-3,-9],[3,-9],[8,-4]].forEach(a=>{ctx.beginPath();ctx.ellipse(x+a[0]*s,y+a[1]*s,2.8*s,3.6*s,0,0,6.3);ctx.fill()})}
function star(x,y,r,al){ctx.fillStyle='rgba(255,255,255,'+al+')';ctx.beginPath();for(let i=0;i<8;i++){const a=i*.785,rr=i%2?r*.4:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.fill()}
function sprite(img,cell,x,flip,hop){ // 256px cell drawn at 150px, feet on GY
  const z=150,y=GY-232*z/256-(hop||0);
  if(!ready()){rr(x-25,y+30,50,90,12,'#fff');return}
  ctx.save();ctx.translate(x,0);if(flip)ctx.scale(-1,1);
  ctx.drawImage(img,cell*256,0,256,256,-z/2,y,z,z);ctx.restore()}
function drawMax(){
  const m=max;let img=IM.run,cell,hop=0,x=sx(m.x)-10*m.dir;
  if(phase==='idle'||phase==='end'&&!m.v){img=IM.idle;cell=Math.floor(m.t*6)%8;x=sx(m.x);sprite(img,cell,x,false);return}
  if(m.push>0){img=IM.push;const u=1-m.push/m.pushLen;cell=m.kick?2+Math.floor(u*4):3+Math.floor(u*3)}
  else cell=m.v?Math.floor(m.t*12)%8:0;
  if(m.whiff>0)hop=Math.sin((1-m.whiff/.25)*3.14)*14;
  sprite(img,cell,x,m.dir>0,hop)}
function drawBall(){
  const g=ball,x=sx(g.x),h=GY-R-g.y;
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,GY+4,R*(1-Math.min(.5,h/400)),4,0,0,6.3);ctx.fill();
  ctx.save();ctx.translate(x,g.y);ctx.rotate(g.rot);ctx.fillStyle='#fff';ctx.strokeStyle='#333';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(0,0,R,0,6.3);ctx.fill();ctx.stroke();ctx.fillStyle='#333';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(Math.cos(i*2.09)*9,Math.sin(i*2.09)*9,4.2,0,6.3);ctx.fill()}
  ctx.beginPath();ctx.arc(0,0,3,0,6.3);ctx.fill();ctx.restore();
  if(down!=null&&phase==='play'&&now-down>=.18){ // power gauge arc
    const p=Math.min(1,(now-down)/.9);ctx.lineWidth=4;ctx.lineCap='round';
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(x,g.y,R+14,Math.PI,2*Math.PI);ctx.stroke();
    ctx.strokeStyle='hsl('+(55-55*p)+',95%,55%)';ctx.beginPath();ctx.arc(x,g.y,R+14,Math.PI,Math.PI*(1+p));ctx.stroke()}
}
function drawProp(p){
  const x=sx(p.x);
  if(p.t==='cone'){
    ctx.save();ctx.translate(x,GY);if(p.done)ctx.rotate(Math.min(1,p.a*6)*1.45*p.dir);
    ctx.fillStyle='#f06a1f';ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-5,-44);ctx.lineTo(5,-44);ctx.lineTo(13,0);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-9,-28,18,7);rr(-17,-4,34,5,2,'#d85510');ctx.restore()
  }else if(p.t==='pot'){
    rr(x-25,GY-40,50,40,3,'#c9b79c');ctx.fillStyle='#ad9c82';for(let i=0;i<3;i++)ctx.fillRect(x-25,GY-40+i*13,50,2);
    if(!p.done){ctx.fillStyle='#d4673c';ctx.beginPath();ctx.moveTo(x-15,GY-70);ctx.lineTo(x+15,GY-70);ctx.lineTo(x+11,GY-40);ctx.lineTo(x-11,GY-40);ctx.fill();
      rr(x-17,GY-74,34,7,3,'#c0562d');[['#f5a','-6'],['#fd3','4'],['#f66','12']].forEach((c,i)=>{ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(x+(i-1)*9,GY-80-(i%2)*4,6,0,6.3);ctx.fill()});ctx.fillStyle='#4a9a3a';ctx.fillRect(x-1,GY-80,2,8)}
  }else if(p.t==='line'){
    const x2=sx(p.x+p.w);ctx.fillStyle='#7a5a3a';ctx.fillRect(x-4,380,8,140);ctx.fillRect(x2-4,380,8,140);
    const sw=p.sw*Math.sin(p.a*20);ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,400);ctx.quadraticCurveTo((x+x2)/2,412,x2,400);ctx.stroke();
    ['#f8c','#8cf','#fd6','#9d8'].forEach((c,i)=>{const t=(i+1)/5,lx=x+(x2-x)*t,ly=400+12*4*t*(1-t);
      ctx.save();ctx.translate(lx,ly);ctx.rotate(sw*.6*(i%2?1:-1));ctx.fillStyle=c;ctx.fillRect(-12,0,24,34);ctx.fillRect(-18,0,6,14);ctx.fillRect(12,0,6,14);ctx.restore()})
  }else if(p.t==='mail'){
    ctx.fillStyle='#6b4a2e';ctx.fillRect(x-5,GY-50,10,50);
    ctx.save();ctx.translate(x,GY-62);ctx.rotate((p.dg||0)*Math.sin(p.a*35)*.18);rr(-20,-14,40,28,10,'#3a6fd8');rr(-20,-14,40,5,3,'#5a8ff0');rr(10,-24,3,18,1,'#d33');ctx.restore();
    if(p.dg>.3){ctx.strokeStyle='rgba(255,220,0,'+p.dg+')';ctx.lineWidth=3;for(let i=0;i<3;i++){const a=-1+i*1;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*30,GY-62+Math.sin(a)*30);ctx.lineTo(x+Math.cos(a)*40,GY-62+Math.sin(a)*40);ctx.stroke()}}
  }
}
function drawGate(){
  const x=sx(GATE),end=phase==='end';
  if(end){const r=90+10*Math.sin(now*5),gr=ctx.createRadialGradient(x,GY-60,10,x,GY-60,r+60);gr.addColorStop(0,'rgba(255,230,120,.9)');gr.addColorStop(1,'rgba(255,230,120,0)');ctx.fillStyle=gr;ctx.fillRect(x-200,GY-260,400,300)}
  rr(x+14,GY-95,52,95,16,'#8a5a32');ctx.fillStyle='#e8c9a0';ctx.beginPath();ctx.arc(x+40,GY-108,14,0,6.3);ctx.fill();
  ctx.fillStyle='#6b4a2e';ctx.beginPath();ctx.ellipse(x+40,GY-118,26,6,0,0,6.3);ctx.fill();rr(x+28,GY-136,24,20,6,'#6b4a2e');
  ctx.fillStyle='#fff';ctx.fillRect(x-30,GY-90,10,90);ctx.fillRect(x+80,GY-90,10,90);
  ctx.beginPath();ctx.moveTo(x-34,GY-90);ctx.lineTo(x-25,GY-104);ctx.lineTo(x-16,GY-90);ctx.fill();ctx.beginPath();ctx.moveTo(x+76,GY-90);ctx.lineTo(x+85,GY-104);ctx.lineTo(x+94,GY-90);ctx.fill();
}
function draw(){
  const d=dpr();ctx.setTransform(S,0,0,S,0,0);
  ctx.fillStyle='#bfe3f5';ctx.fillRect(0,0,W,H);
  // far: painting top 700px (hills, greenhouse, fence — skips the painted Max/ball), 0.2x, mirrored tiles hide seams
  if(ready()){const bh=GY+20,tw=720*bh/700,off=cam.x*.2,y=cam.y*.3-20;
    for(let i=Math.floor(off/tw);i*tw-off<W;i++){ctx.save();ctx.translate(i*tw-off,y);if(i&1){ctx.translate(tw,0);ctx.scale(-1,1)}ctx.drawImage(IM.bg,0,0,720,700,0,0,tw,bh);ctx.restore()}
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(0,0,W,GY)}
  ctx.save();ctx.translate(0,cam.y);
  // mid: picket fence 0.7x
  const fo=cam.x*.7;ctx.fillStyle='#fff';ctx.fillRect(0,GY-48,W,5);ctx.fillRect(0,GY-24,W,5);
  for(let i=Math.floor(fo/34);i*34-fo<W;i++){const px=i*34-fo;ctx.beginPath();ctx.moveTo(px,GY);ctx.lineTo(px,GY-62);ctx.lineTo(px+7,GY-70);ctx.lineTo(px+14,GY-62);ctx.lineTo(px+14,GY);ctx.fill()}
  // street
  ctx.fillStyle='#d9d2c4';ctx.fillRect(0,GY,W,50);ctx.fillStyle='#b7b0a2';ctx.fillRect(0,GY+44,W,6);ctx.fillStyle='#6e7077';ctx.fillRect(0,GY+50,W,200);
  ctx.fillStyle='#e8e8e8';for(let i=Math.floor(cam.x/90);i*90-cam.x<W;i++)ctx.fillRect(i*90-cam.x,GY+85,50,5);
  ctx.fillStyle='#c4bdaf';for(let i=Math.floor(cam.x/60);i*60-cam.x<W;i++)ctx.fillRect(i*60-cam.x,GY+22,2,22);
  drawGate();props.forEach(drawProp);
  fx.forEach(f=>{const a=f.l/f.m,x=sx(f.x);
    if(f.k==='s')star(x,f.y,f.r*(1+(1-a)),a);
    else if(f.k==='d'){ctx.fillStyle='rgba(235,225,205,'+a*.8+')';ctx.beginPath();ctx.arc(x,f.y,f.r*(2-a),0,6.3);ctx.fill()}
    else if(f.k==='t'){ctx.fillStyle='rgba(255,255,255,'+a*.5+')';ctx.beginPath();ctx.arc(x,f.y,f.r*a,0,6.3);ctx.fill()}
    else{ctx.fillStyle='#d4673c';ctx.fillRect(x-f.r/2,f.y-f.r/2,f.r,f.r*.8)}});
  drawMax();drawBall();ctx.restore();
  // HUD
  const hx=16+SA.l,hy=26+SA.t*.6;paw(hx+12,hy+8,1.3,'#6b4a2e');
  ctx.fillStyle='#4a3520';ctx.font='bold 28px system-ui,sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(score,hx+34,hy+9);
  const bw=Math.min(110,W*.3),bx=W-16-SA.r-bw;rr(bx,hy+3,bw,10,5,'rgba(0,0,0,.2)');rr(bx,hy+3,Math.max(10,bw*Math.min(1,max.x/GATE)),10,5,'#f5c030');
  if(phase==='end'){
    rr(W/2-110,130,220,240,28,'rgba(255,248,225,.88)');
    paw(W/2-58,200,3,'#6b4a2e');ctx.font='bold 84px system-ui,sans-serif';ctx.textAlign='left';ctx.fillStyle='#4a3520';ctx.fillText(score,W/2-14,205);
    btn={x:W/2-70,y:290,w:140,h:56};rr(btn.x,btn.y,btn.w,btn.h,28,'#f5c030');ctx.fillStyle='#4a3520';ctx.font='bold 26px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('다시',W/2,btn.y+29);
    }
}
// ---- main
now=0;resize();reset();
let last=0;
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.G={step:(dt,n)=>{for(let i=0;i<(n||1);i++)step(dt);draw()},down:()=>inDown(-1,-1),up:inUp,reset,get s(){return{phase,score,max,ball,now,cam}},props,click:(x,y)=>inDown(x*S,y*S),get btn(){return btn}};
})();
</script></body></html>
