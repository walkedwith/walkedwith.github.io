<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>tails</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fb06a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 8px);font:600 14px system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #0006;pointer-events:none}
#probe{position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden}
#b{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:700 22px system-ui,sans-serif;padding:14px 34px;border:0;border-radius:14px;background:#fff;color:#333;box-shadow:0 4px 0 #0004}
#b:active{transform:translate(-50%,-48%)}
[hidden]{display:none!important}
</style>
<canvas id="c"></canvas><div id="hud"></div><div id="probe"></div><button id="b" hidden>다시</button>
<script>
'use strict';
const W = 12, H = 16, TICK = 240, N = 6, GATE = [5, 0];
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];            // 0 up, 1 right, 2 down, 3 left
const KIND = ['#fdfdf5', '#e8963c'];                      // A = white, B = orange
const BUSH = [[7, 7], [7, 12], [8, 3], [3, 3]];
const ANIMALS = [[5, 12, 0], [3, 10, 0], [2, 8, 0], [2, 5, 1], [6, 5, 1], [9, 5, 1]]; // x,y,kind
const cv = document.getElementById('c'), g = cv.getContext('2d');
const hud = document.getElementById('hud'), btn = document.getElementById('b'), probe = document.getElementById('probe');

let hero, dir, hist, tail, animals, q, state, last, got, armed;   // state: 0 play, 1 lose, 2 win
function reset() {
  hero = { x: 5, y: 14 }; dir = 0; hist = []; tail = []; q = []; got = 0; state = 0;
  animals = ANIMALS.map(a => ({ x: a[0], y: a[1], k: a[2] }));
  armed = false;                                           // waits for the first tap, then moves
  last = performance.now();
}

const wall = (x, y) => x <= 0 || y <= 0 || x >= W - 1 || y >= H - 1 || BUSH.some(b => b[0] == x && b[1] == y);

function merge(now) {                                      // 3 consecutive same-kind babies -> 1 adult (in place)
  for (let i = 0; i + 2 < tail.length; i++) {
    const a = tail[i], b = tail[i + 1], c = tail[i + 2];
    if (a.t == 1 && b.t == 1 && c.t == 1 && a.k == b.k && b.k == c.k) {
      tail.splice(i, 3, { k: a.k, t: 2, pulse: now });
      return;
    }
  }
}

function step(now) {
  last = now;
  if (q.length) dir = (dir + q.shift()) % 4;
  const nx = hero.x + DX[dir], ny = hero.y + DY[dir];
  if (nx == GATE[0] && ny == GATE[1]) {                    // gate is a fence until everything is collected
    hero = { x: nx, y: ny }; state = got == N ? 2 : 1; return;
  }
  // last tail segment vacates its cell this step, so it is not an obstacle
  if (wall(nx, ny) || hist.slice(0, tail.length - 1).some(p => p.x == nx && p.y == ny)) { state = 1; return; }
  hist.unshift({ x: hero.x, y: hero.y });
  hero = { x: nx, y: ny };
  const i = animals.findIndex(a => a.x == nx && a.y == ny);
  if (i >= 0) { tail.push({ k: animals[i].k, t: 1 }); animals.splice(i, 1); got++; merge(now); }
  hist.splice(tail.length);
}

function turn(d) {                                         // d: 3 = left, 1 = right
  if (state) return;
  if (!armed) { armed = true; last = performance.now(); return; } // first tap only starts
  if (q.length < 2) q.push(d);
  const now = performance.now();
  if (now - last >= 100) step(now);                        // respond now instead of waiting for the tick
}

addEventListener('keydown', e => {
  if (e.key == 'ArrowLeft' || e.key == 'a') turn(3);
  else if (e.key == 'ArrowRight' || e.key == 'd') turn(1);
  else return;
  e.preventDefault();
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); turn(e.clientX < innerWidth / 2 ? 3 : 1); });
btn.addEventListener('click', reset);
btn.addEventListener('pointerdown', e => e.stopPropagation());

let cs, ox, oy, dpr;
function resize() {
  dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const top = probe.offsetHeight + 34, aw = innerWidth - 24, ah = innerHeight - top - 16;
  cs = Math.max(4, Math.floor(Math.min(aw / W, ah / H)));
  ox = Math.round((innerWidth - W * cs) / 2); oy = Math.round(top + (ah - H * cs) / 2);
}
addEventListener('resize', resize);

function draw(now) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#8fb06a'; g.fillRect(0, 0, innerWidth, innerHeight);
  g.fillStyle = '#a9c97f'; g.fillRect(ox, oy, W * cs, H * cs);
  for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
    if (x && y && x < W - 1 && y < H - 1) continue;        // border cells only
    g.fillStyle = x == GATE[0] && y == GATE[1] ? '#f5d02e' : '#8a5a2b';
    g.fillRect(ox + x * cs, oy + y * cs, cs, cs);
    g.strokeStyle = '#0003'; g.strokeRect(ox + x * cs + .5, oy + y * cs + .5, cs - 1, cs - 1);
  }
  const items = [];                                        // pseudo-2.5D: draw by y, lower rows on top
  const circ = (x, y, r, col, sc = 1) => items.push({ y, f() {
    g.fillStyle = col; g.strokeStyle = '#0006'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(ox + (x + .5) * cs, oy + (y + .5) * cs, r * cs * sc, 0, 7); g.fill(); g.stroke();
  } });
  BUSH.forEach(([x, y]) => items.push({ y, f() {
    g.fillStyle = '#3f8f3a'; g.beginPath(); g.roundRect(ox + x * cs + 2, oy + y * cs + 2, cs - 4, cs - 4, cs * .3); g.fill();
  } }));
  animals.forEach(a => circ(a.x, a.y, .22, KIND[a.k]));
  tail.forEach((s, i) => {
    const p = hist[i]; if (!p) return;
    const t = s.pulse ? (now - s.pulse) / 300 : 1;
    circ(p.x, p.y, s.t == 2 ? .42 : .26, KIND[s.k], t < 1 ? 1 + .45 * Math.sin(Math.PI * t) : 1);
  });
  circ(hero.x, hero.y, .34, state == 1 ? '#c0392b' : '#2b2b33', armed || state ? 1 : 1 + .08 * Math.sin(now / 180));
  items.push({ y: hero.y + .01, f() {                      // nose dot = heading
    g.fillStyle = '#fff'; g.beginPath();
    g.arc(ox + (hero.x + .5 + DX[dir] * .22) * cs, oy + (hero.y + .5 + DY[dir] * .22) * cs, cs * .07, 0, 7); g.fill();
  } });
  items.sort((a, b) => a.y - b.y).forEach(i => i.f());
  if (state == 2) { g.fillStyle = '#f5d02e66'; g.fillRect(0, 0, innerWidth, innerHeight); }
}

function loop(now) {
  if (state == 0 && armed && now - last >= TICK) step(now);
  draw(now);
  hud.textContent = '동물 ' + got + '/' + N;
  btn.hidden = state == 0;
  requestAnimationFrame(loop);
}
resize(); reset(); requestAnimationFrame(loop);
</script>
