<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1-1~1-5 집으로</title>
<style>html,body{margin:0;height:100%;background:#2b211a}iframe{border:0;width:100%;height:calc(100% - 96px);display:block}
#sol{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 8px;min-height:84px;box-sizing:border-box;background:#2b211a;color:#FFE9C0;font:600 14px sans-serif}#sol button{font:600 14px sans-serif;padding:5px 10px;border-radius:9px;border:0;background:#cfe8b8}#sol button.lv{background:#f3dfb6;min-width:30px}#sol button.lv.on{background:#ffb84d}#seq{letter-spacing:1px;flex-basis:100%;text-align:center}#seq b{color:#7fe07a}</style>
<div id="sol"><span id="lvs"></span><span id="lvl">집으로</span><button id="pl">▶ 해답 재생</button><button id="st">한 수</button><button id="ps">■ 멈춤</button><button id="rs">↺ 처음부터</button><span id="seq"></span></div><iframe id="g" src="/index.html"></iframe>
<script>
// 1-1~1-5 「집으로」 시안 — 진짜 게임(index.html · dig.html 빌드본, 2026-10-12부터 중복 사본 대신 이것)을 띄우고, home-engine.js(집 규칙·그림) + pot-engine.js(화분 그림)를 게임 전역에 eval 한 뒤
// levels.json 다섯 판을 1~5판 자리(BAKED[0..4])에 메모리로만 심는다. dig.html 은 안 고친다. 세이브도 안 건드린다(LS.set 막음).
// ?lv=3 이면 3판부터, ?auto=0 이면 판에 자동으로 안 들어간다.
const f=document.getElementById('g'), Q=new URLSearchParams(location.search);
let LVS=null, ENG=null, LVN=Math.min(5,Math.max(1,+Q.get('lv')||1)), on=false, idx=0, timer=null;
const guard=w=>{try{w.eval('LS.set=()=>{}'); w.localStorage.setItem=()=>{};}catch(e){}
 if(!(window.matchMedia&&matchMedia('(pointer: coarse)').matches)) try{Object.defineProperty(w.document,'hidden',{configurable:true,get:()=>false}); Object.defineProperty(w.document,'visibilityState',{configurable:true,get:()=>'visible'});}catch(e){}};   // 앱 창 미리보기는 숨김으로 잡혀 게임 루프가 멈춘다 — 늘 보이는 걸로. 폰(터치)에선 덮지 않는다: 덮으면 앱을 내려도 루프·BGM이 안 멈춘다(2026-10-12)
f.addEventListener('load',()=>guard(f.contentWindow));
// 첫 실행 안내(방 연습·이야기 카드·걸음 막대 코치·도토리 코치·기믹 소개·판 위 알약)는 방석을 가리키게 만들어져 있다 — 시안에서는 모두 끄고 본 것으로 친다.
const QUIET="try{tipSeen.stepCoach=1; tipSeen.acornFirst=1; tipSeen.mealSpend=1}catch(e){} try{showGintro=()=>{}; showBoardTip=()=>{}; acornCoachStart=()=>{}; showHintCoach=()=>{}}catch(e){} try{closeGintro()}catch(e){} try{hideBoardTip()}catch(e){} try{coachSteps=null; el('coach').classList.remove('show')}catch(e){} try{teach=null}catch(e){}";
function enter(){const w=f.contentWindow; guard(w);
 if(!w.__homePatched) w.eval(ENG[0]);
 if(!w.__potPatched) w.eval(ENG[1]);
 LVS.forEach((o,i)=>w.eval('BAKED['+i+']='+JSON.stringify(o)));
 w.eval(QUIET); w.eval('enterLevelGo')(LVN);
 try{w.eval('frameLoopPaused=false; if(!mainFrameRAF&&!mainFrameTimer){ framePrevTs=0; scheduleGameFrame(); }')}catch(e){}   // 숨김으로 잡혔을 때 끊긴 프레임 루프를 다시 건다
 setTimeout(()=>{try{w.eval(QUIET)}catch(e){}},900);
 setTimeout(()=>{document.activeElement&&document.activeElement.blur&&document.activeElement.blur(); try{w.focus()}catch(_){}},950);}   // 방향키가 게임으로 가게
function go(n){ stop(); if(n) LVN=n; on=true; idx=0; enter(); showSeq(); }
const AR={U:'↑',D:'↓',L:'←',R:'→'}, DV={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};
function cur(){return LVS? LVS[LVN-1] : null}
function curSl(){return (cur()&&cur().sl)||''}
function showSeq(){const sl=curSl(), o=cur(); document.querySelectorAll('#lvs button').forEach((b,i)=>b.classList.toggle('on',i===LVN-1));
 document.getElementById('lvl').textContent='1-'+LVN+' 집으로'+(o?' · '+o.role:'')+' · par '+sl.length+' · '+idx+'/'+sl.length;
 document.getElementById('seq').innerHTML=[...sl].map((c,i)=>i<idx?'<b>'+AR[c]+'</b>':AR[c]).join('');}
function stepOne(){const w=f.contentWindow, sl=curSl(); if(!on) return false; if(idx>=sl.length){stop();return;}
 let busy=false; try{busy=w.eval('isAnimating()')}catch(e){} if(busy) return false;
 const d=DV[sl[idx]]; try{w.eval('tryMove('+d[0]+','+d[1]+')')}catch(e){} idx++; showSeq(); return true;}
function stop(){if(timer){clearInterval(timer);timer=null;}}
document.getElementById('lvs').innerHTML=[1,2,3,4,5].map(n=>'<button class="lv" data-n="'+n+'">'+n+'</button>').join(' ');
document.querySelectorAll('#lvs button').forEach(b=>b.onclick=()=>go(+b.dataset.n));
document.getElementById('pl').onclick=()=>{stop(); if(idx>0) go(); timer=setInterval(()=>{stepOne()},120);};   // 해답은 늘 처음 자리에서 재생한다
document.getElementById('st').onclick=()=>{stop(); stepOne();};
document.getElementById('ps').onclick=stop;
document.getElementById('rs').onclick=()=>go();
// 포커스가 바깥에 남아도 방향키가 게임에 가게 넘긴다
const KEYS={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]};
addEventListener("keydown",e=>{const d=KEYS[e.key]; if(!d||!on) return; e.preventDefault(); stop(); try{f.contentWindow.eval("tryMove("+d[0]+","+d[1]+")")}catch(_){} });
const txt=u=>fetch(u,{cache:'no-store'}).then(r=>r.text());
Promise.all([fetch('./levels.json',{cache:'no-store'}).then(r=>r.json()), txt('./home-engine.js'), txt('./pot-engine.js')]).then(([lv,e0,e1])=>{
  LVS=lv; ENG=[e0,e1]; showSeq();
  if(Q.get('auto')==='0') return;
  // 게임이 부트 직후 타이틀 화면을 띄우므로 부트가 끝난 뒤(약 1초) 판으로 들어간다. 판이 안 잡혔으면 다시.
  const start=()=>{ try{ go(); }catch(e){ return setTimeout(start,400); }
    setTimeout(()=>{ try{ if(f.contentWindow.eval('level')!==LVN || f.contentWindow.eval('state')!=='play') go(); }catch(e){} },1500); };
  const boot=()=>setTimeout(start,1000);
  if(f.contentWindow && f.contentWindow.document.readyState==='complete' && f.contentWindow.enterLevelGo) boot();
  else f.addEventListener('load',boot,{once:true});
});
</script>
