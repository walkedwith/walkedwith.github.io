// === RULES BEGIN ===
function rngInt(s,n){let x=s.rng;x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;s.rng=x;return x%n;}
function cargo(){return {stone:0,copper:0,tin:0,peat:0,quartz:0,relic:0};}
function tileHP(k,pick=1){if(pick===0&&['copper','tin','quartz','relic'].includes(k))return 2;return k==='door'?5:k==='rock'?3:['stone','clay'].includes(k)?2:k==='empty'?0:1;}
function attackPower(s){return [6,10,16][s.pick];}
function blocked(k,pick){return k==='bedrock'||pick<2&&['rock','door'].includes(k)||pick===0&&['clay','stone'].includes(k);}
function upgrade(s,pick,events){s.pick=pick;for(const tile of s.board)tile.hp=Math.min(tile.hp,tileHP(tile.kind,pick));events.push({k:'upgrade',pick});}
function reserve(s,pick,needs){const seen=Array(540).fill(false),queue=[];for(let x=0;x<9;x++)if(!blocked(s.board[x].kind,pick)){seen[x]=true;queue.push(x);}
 for(let q=0;q<queue.length;q++){const i=queue[q],x=i%9,y=Math.floor(i/9);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,j=b*9+a;if(a<0||a>=9||b<0||b>=35||seen[j]||blocked(s.board[j].kind,pick))continue;seen[j]=true;queue.push(j);}}
 for(const [k,n,min] of needs){let count=0;for(let i=0;i<315;i++)if(seen[i]&&s.board[i].kind===k)count++;for(let i=min*9;i<315&&count<n;i++)if(seen[i]&&!(k==='stone'&&i%9===4&&i<135)&&['dirt','dirt2','gravel'].includes(s.board[i].kind)){s.board[i]={kind:k,hp:tileHP(k,0)};count++;}}
}
function inside(x,y){return Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&x<9&&y>=-1&&y<60;}
function tileAt(s,x,y){return y<0?{kind:'empty',hp:0}:s.board[y*9+x];}
function reveal(s){const lit=Array(540).fill(false);const light=(x,y,r)=>{for(let b=y-r;b<=y+r;b++)for(let a=x-r;a<=x+r;a++)if(inside(a,b)&&b>=0&&(a-x)*(a-x)+(b-y)*(b-y)<=r*r)lit[b*9+a]=true;};
  light(s.hero.x,s.hero.y,2);for(const l of s.lanterns)light(l.x,l.y,2);for(let i=0;i<540;i++)if(s.board[i].kind==='empty')light(i%9,Math.floor(i/9),1);s.visible=lit;for(let i=0;i<540;i++)if(lit[i])s.seen[i]=true;
}
function backCamp(s,reason,events){const kept=cargo();for(const k of Object.keys(s.bag)){kept[k]=reason==='return'||reason==='hall'?s.bag[k]:Math.floor(s.bag[k]/2);s.stock[k]+=kept[k];}s.result={reason,kept};s.bag=cargo();s.mode='camp';s.hero={x:4,y:-1};s.hp=100;s.swing=null;s.queued=null;s.jobs=[];s.battle=null;events.push({k:'returned',reason,kept});reveal(s);}
function startBattle(s,eye,events){const kinds=s.hero.y<20?(rngInt(s,2)?['beetle','beetle']:['beetle']):s.hero.y<40?['beetle','rat']:['rat','rat','mole'];
  s.battle={elapsed:0,charge:0,eye,enemies:kinds.map(k=>({kind:k,hp:k==='mole'?90:k==='rat'?22:30,max:k==='mole'?90:k==='rat'?22:30,damage:k==='mole'?12:k==='rat'?6:4,interval:k==='mole'?120:k==='rat'?60:90}))};s.mode='battle';s.swing=null;s.queued=null;s.jobs=[];s.noise=0;events.push({k:'battle'});
}
function collapse(s,reason,events){s.mode='down';s.swing=null;s.queued=null;s.jobs=[{at:s.tick+75,k:'returnAfterDown',reason}];events.push({k:'collapsed',reason});}
function battleEnd(s,events){if(s.hp<=0){collapse(s,'defeat',events);return true;}if(s.battle.enemies.every(e=>e.hp<=0)){const amount=1+rngInt(s,2);s.bag.copper+=amount;if(s.battle.eye>=0)s.eyes.splice(s.battle.eye,1);s.battle=null;s.mode='dig';s.noise=0;events.push({k:'victory',amount});return true;}return false;}
function encounter(s,events){if(s.mode!=='dig')return;const i=s.eyes.findIndex(e=>Math.abs(e.x-s.hero.x)+Math.abs(e.y-s.hero.y)===1);if(i>=0)startBattle(s,i,events);}
function moveTo(s,x,y,events,k){const previous={...s.hero};s.hero={x,y};s.maxDepth=Math.max(s.maxDepth,y);s.facing=x<previous.x?-1:x>previous.x?1:s.facing;s.moveUntil=s.tick+8;s.fallAt=s.tick+8;events.push({k,x,y,from:previous});reveal(s);encounter(s,events);}
function cellCommand(s,cmd,events){if(s.mode!=='dig'||!inside(cmd.x,cmd.y)||Math.abs(cmd.x-s.hero.x)+Math.abs(cmd.y-s.hero.y)!==1)return;
  if(s.swing){s.queued={k:'cell',x:cmd.x,y:cmd.y};return;}const tile=tileAt(s,cmd.x,cmd.y);if(tile.kind==='empty'){moveTo(s,cmd.x,cmd.y,events,cmd.y<s.hero.y?'climb':'walk');return;}
  s.facing=cmd.x<s.hero.x?-1:cmd.x>s.hero.x?1:s.facing;s.swing={x:cmd.x,y:cmd.y,start:s.tick};s.jobs.push({at:s.tick+16,k:'impact',x:cmd.x,y:cmd.y},{at:s.tick+32,k:'swingEnd'});events.push({k:'swing'});
}
const RULES={
  init(data,seed){const s={version:3,tick:0,rng:(seed>>>0)||2463534242,round:0,maxDepth:0,jobs:[],mode:'camp',hero:{x:4,y:-1},facing:1,energy:30,hp:100,noise:0,noiseBattles:0,pick:0,forge:false,board:[],bag:cargo(),stock:cargo(),lanterns:[],lanternsLeft:3,eyes:[],seen:Array(540).fill(false),visible:Array(540).fill(false),swing:null,queued:null,moveUntil:0,fallAt:0,battle:null,result:null,completed:false,adUsed:false};
    for(let y=0;y<60;y++)for(let x=0;x<9;x++){const roll=rngInt(s,100);let k=roll<38?'dirt':roll<52?'dirt2':roll<62?'gravel':roll<77&&y>=1?(y>=10||roll<68?'copper':'dirt'):roll<84&&y>=3?'stone':roll<89&&y>=4?'peat':roll<95&&y>=10?'tin':roll<98&&y>=8?'quartz':y>=15?'clay':'dirt';if(y>=20&&(y%7===0)&&roll<30)k='rock';if((x===0||x===8)&&y>16&&roll<16||y===59)k='bedrock';if(y>=35&&y<=37)k='rock';if(y>=50&&y<=51&&x>=3&&x<=5)k='door';s.board.push({kind:k,hp:tileHP(k,0)});}
    // Keep an openable spine to the copper threshold; wood reaches the upper 15 rows.
    for(let y=0;y<35;y++){const i=y*9+4;if(blocked(s.board[i].kind,y<15?0:1))s.board[i]={kind:'dirt',hp:1};}
    for(const y of [12,27,44]){const x=1+rngInt(s,7);s.board[y*9+x]={kind:'relic',hp:2};}
    // One copper per cell: cover campfire + repair + bronze without combat rewards.
    // Reserve below row 9 so guarantees preserve the shallow six-percent roll.
    reserve(s,1,[['stone',6,3],['copper',24,10],['tin',4,10],['peat',5,4]]);
    reserve(s,0,[['copper',6,10],['peat',2,4]]);
    while(s.eyes.length<6){const x=1+rngInt(s,7),y=9+rngInt(s,40);if(y>=35&&y<=37||s.eyes.some(e=>e.x===x&&e.y===y))continue;s.eyes.push({x,y});}return s;
  },
  apply(s,cmd){const events=[];if(cmd.t!==s.tick)return {events};
    if(cmd.k==='depart'&&s.mode==='camp'){let deepest={x:4,y:-1};for(const l of s.lanterns)if(l.y>deepest.y)deepest={...l};s.hero=deepest;s.maxDepth=Math.max(s.maxDepth,deepest.y);s.mode='dig';s.energy=30;s.hp=100;s.noise=0;s.noiseBattles=0;s.lanternsLeft=3;s.bag=cargo();s.result=null;s.adUsed=false;s.round++;s.fallAt=s.tick+8;reveal(s);events.push({k:'departed',x:deepest.x,y:deepest.y});}
    else if(cmd.k==='cell')cellCommand(s,cmd,events);
    else if(cmd.k==='return'&&s.mode==='dig')backCamp(s,'return',events);
    else if(cmd.k==='close'&&s.mode==='ending')backCamp(s,'hall',events);
    else if(cmd.k==='lantern'&&s.mode==='dig'&&s.hero.y>=0&&s.lanternsLeft>0&&!s.lanterns.some(l=>l.x===s.hero.x&&l.y===s.hero.y)){s.lanterns.push({...s.hero});s.lanternsLeft--;reveal(s);events.push({k:'lantern',...s.hero});}
    else if(cmd.k==='copper'&&s.mode==='camp'&&s.pick===0&&s.stock.copper>=6&&s.stock.peat>=2){s.stock.copper-=6;s.stock.peat-=2;upgrade(s,1,events);}
    else if(cmd.k==='repair'&&s.mode==='camp'&&s.pick>=1&&!s.forge&&s.stock.stone>=6&&s.stock.copper>=10){s.stock.stone-=6;s.stock.copper-=10;s.forge=true;events.push({k:'repair'});}
    else if(cmd.k==='bronze'&&s.mode==='camp'&&s.forge&&s.pick===1&&s.stock.copper>=8&&s.stock.tin>=4&&s.stock.peat>=3){s.stock.copper-=8;s.stock.tin-=4;s.stock.peat-=3;upgrade(s,2,events);}
    else if(cmd.k==='ad_reward'&&s.mode==='dig'&&s.energy<=2&&!s.adUsed){s.adUsed=true;s.energy+=10;events.push({k:'ad_reward'});}
    else if(cmd.k==='special'&&s.mode==='battle'&&s.battle.charge>=360&&!s.jobs.some(j=>j.k==='specialEnd')){s.battle.charge=0;s.jobs.push({at:s.tick+24,k:'specialImpact'},{at:s.tick+48,k:'specialEnd'});events.push({k:'special'});}
    return {events};
  },
  tick(s){s.tick++;const events=[];if(s.mode==='down'){const j=s.jobs.find(j=>j.k==='returnAfterDown'&&j.at<=s.tick);if(j)backCamp(s,j.reason,events);return {events};}if(s.mode==='battle'){
      const due=s.jobs.filter(j=>j.at<=s.tick);s.jobs=s.jobs.filter(j=>j.at>s.tick);for(const j of due)if(j.k==='specialImpact'){for(let i=0;i<s.battle.enemies.length;i++){const e=s.battle.enemies[i];if(e.hp>0){const amount=attackPower(s)*3;e.hp=Math.max(0,e.hp-amount);events.push({k:'damage',target:i,amount});}}events.push({k:'specialImpact'});if(battleEnd(s,events))return {events};}
      const b=s.battle;b.elapsed++;b.charge=Math.min(360,b.charge+1);if(b.elapsed%60===44)events.push({k:'attack'});

 for(const [id,box] of Object.entries(geom.buttons)){const texts={depart:'원정 출발 ↓',return:'진영 귀환 ↑',lantern:'등불 '+rules.lanternsLeft+'/3',copper:'모닥불 구리 제작',repair:'대장간 수리',bronze:'청동 만들기',special:rules.battle?.charge>=360?'필살기!':'충전 중',close:'진영으로',bm:'▶ 기운 +10',social:'귀환 기록 공유',yes:'예',no:'아니오',validation:'검증 시작'};if(id==='special'){sprite('ui-portrait',box.x,box.y,{w:280,h:280});ctx.save();ctx.beginPath();ctx.arc(box.x,box.y,96,0,Math.PI*2);ctx.clip();sprite('hero-swing-wood',box.x,box.y+174,{w:260,h:260});ctx.restore();ctx.strokeStyle=rules.battle?.charge>=360?'#fff1a0':'#f5cb65';ctx.lineWidth=12;ctx.beginPath();ctx.arc(box.x,box.y,130,-Math.PI/2,-Math.PI/2+Math.PI*2*(rules.battle?.charge??0)/360);ctx.stroke();label(texts[id],box.x,box.y+105,37);}else if(id==='lantern'){ctx.save();ctx.beginPath();ctx.ellipse(box.x,box.y,box.w/2,box.h/2,0,0,Math.PI*2);ctx.clip();sprite('ui-round',box.x,box.y,{w:box.w,h:box.w*558/578});ctx.restore();const glow=ctx.createRadialGradient(box.x,box.y,5,box.x,box.y,85);glow.addColorStop(0,'#ffbd65cc');glow.addColorStop(.5,'#ff8d3266');glow.addColorStop(1,'#ff8d3200');ctx.fillStyle=glow;ctx.fillRect(box.x-85,box.y-85,170,170);ctx.save();ctx.filter='brightness(1.8)';sprite('lantern',box.x,box.y+65,{w:135,h:135});ctx.restore();sprite('ui-badge',box.x+48,box.y+48,{w:66,h:66});label(rules.lanternsLeft,box.x+48,box.y+48,38);}else{const primary=['depart','return','copper','repair','bronze','close','yes'].includes(id);panel(box,texts[id],['copper','repair','bronze'].includes(id)?35:40,primary?(pointer?.button===id?'ui-btn-gold-down':'ui-btn-gold'):'ui-btn-stone');}}

 if(noticeLeft>0){const railVisible=['camp','dig'].includes(rules.mode);panel({x:railVisible?geom.boardX+540*geom.boardScale:540,y:geom.boardY+130,w:railVisible?1080*geom.boardScale-20:980,h:100},notice,36);}
 if(pickFx){const t=pickFx.elapsed,fly=Math.max(0,Math.min(1,(t-1.2)/1.2)),ease=fly*fly*(3-2*fly),size=t<.6?80+300*t/.6:380+(72-380)*ease;sprite('pick'+pickFx.pick,540+(380-540)*ease,geom.H*.5+(geom.hud[1].y+30-geom.H*.5)*ease,{w:size,h:size});}
 if(rules.mode==='ending'){ctx.fillStyle='#130d05c9';ctx.fillRect(0,geom.boardY,W,geom.boardBottom-geom.boardY);const g=ctx.createRadialGradient(540,geom.H*.48,0,540,geom.H*.48,650);g.addColorStop(0,'#ffdb6dba');g.addColorStop(1,'#f7b72c00');ctx.fillStyle=g;ctx.fillRect(0,geom.boardY,W,geom.boardBottom-geom.boardY);for(const side of [-1,1]){ctx.save();ctx.beginPath();ctx.rect(side<0?0:540,geom.boardY,540,geom.boardBottom-geom.boardY);ctx.clip();sprite('hall-door',540+side*(1-Math.min(1,flash/.45))*220,geom.H*.55,{w:580,h:580});ctx.restore();}hero(540,geom.H*.55,270);panel({x:540,y:geom.H*.65,w:1000,h:130},'옛 대장간 홀 발견',58);}

function state(){return copy({proto:PROTO,build:BUILD,...game,...rules,rules,intro,heroMotion,loop:loopRow,geometry:geom,ad,offer,socialOffer,neighbors,coreLoop,from:query.get('from'),validation:archive.validation,records:archive,checkResult});}
function check(){const snapshot=copy({game,rules,loopRow,archive,ad,offer,socialOffer,fx,numbers,shake,flash,rng,accumulator,silhouettes,camY,actorX,actorY,heroAttack,notice,noticeLeft,pickFx,offerRound,intro,heroMotion,swipeArrow}),savedPointer=pointer;inspecting=true;let result;
 try{load(1);step(60);const idleCannotWin=!rules.completed;load(1);input('depart');const initial=JSON.stringify(rules.board);for(let i=0;i<600;i++){if(i%3===0){const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(fxRandom()*4)];input('cell',rules.hero.x+d[0],rules.hero.y+d[1]);}if(rules.mode==='battle')input('special');if(rules.mode==='camp')input('depart');step(.1);}const info=assets(),stateChanged=JSON.stringify(rules.board)!==initial;result={ok:errors.length===0&&info.failed===0&&info.pending===0&&info.silhouettes===0&&idleCannotWin&&stateChanged,seconds:60,assets:info,errors:errors.slice(),idleCannotWin,stateChanged};
 }catch(err){result={ok:false,seconds:60,error:String(err)};}finally{({game,rules,loopRow,archive,ad,offer,socialOffer,fx,numbers,shake,flash,rng,accumulator,silhouettes,camY,actorX,actorY,heroAttack,notice,noticeLeft,pickFx,offerRound,intro,heroMotion,swipeArrow}=snapshot);pointer=savedPointer;inspecting=false;resize();}return result;}
function showStats(){const el=document.getElementById('stats');el.style.display='block';
  const escape=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const table=(headers,rows)=>'<table><tr>'+headers.map(v=>'<th>'+escape(v)+'</th>').join('')+'</tr>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+escape(v)+'</td>').join('')+'</tr>').join('')+'</table>';
  const percent=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
  el.innerHTML='<h2>'+escape(PROTO)+escape(S('proto.stats.title'))+escape(BUILD)+'</h2><p>'+escape(S('proto.stats.bias'))+'</p>'+
    table([S('proto.column.0'),S('proto.column.1'),S('proto.column.2'),S('proto.duty'),S('proto.column.3'),S('proto.column.4'),S('proto.column.5')],Object.entries(archive.dates).map(([d,r])=>[d,r.mode,Math.floor(r.active),r.active>=300?S('proto.done'):S('proto.progress'),r.voluntary,r.wanted===null?S('proto.unanswered'):r.wanted?S('proto.yes'):S('proto.no'),r.inputs]))+
    '<h3>'+escape(S('proto.stats.loop'))+'</h3>'+table([S('proto.column.6'),S('proto.column.0'),S('proto.column.1'),S('proto.column.7'),S('proto.column.8'),S('proto.column.9'),S('proto.column.10'),S('proto.column.11'),S('proto.column.12'),S('proto.column.13')],archive.loops.map(r=>[r.build,r.date,r.mode,r.round,r.firstInput,r.inputs,r.duration.toFixed(2),r.failures,r.aborted,r.voluntary]))+

}
