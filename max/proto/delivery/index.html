</style></head><body><div id="safe"></div><canvas id="game" aria-label="맥스 동네 배달. 길에서 끌어 길을 잇고, 빈 풀밭에서 끌어 지도를 봅니다."></canvas><section id="stats"></section>
<script>
'use strict';
let checking=false;
const CHECK=new URLSearchParams(location.search).has('check'), STATS=new URLSearchParams(location.search).has('stats');
const LOOP={본다:'해 질 녘 동네 지도·꾸러미 말풍선·시계',한다:'손가락으로 끌어 길을 깐다',받는다:'집에 불·동전·집 주인의 인사',실패:'시계 끝·하트 −1',다시:'새 집으로 배달망 확장',보기:'동네 전체가 노을빛으로 채워짐',이벤트:{시작:'새 말풍선',입력:'닿음→뗌',성공:'배달 도착',실패:'시계 끝',끝:'하루 정산'}};
const POS=[[4,9],[0,11],[5,12],[1,6],[5,6],[3,13],[0,3],[4,3],[2,1],[5,0],[0,0],[3,5]], DEC=[[5,10,'tree2'],[0,5,'tree1'],[3,8,'tree2'],[4,12,'lamp']];
const NEIGHBORS=['보리','콩이','구름','두부','호두','밤이','초코','별이','달이'].map((name,i)=>({name,portrait:['house-blue','house-purple','house-red','house-green'][i%4],contribution:72+i*2}));
const key=(x,y)=>x+','+y, near=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1, parse=s=>s.split(',').map(Number);
const store={read(){try{return JSON.parse(localStorage.getItem('proto_delivery_records'))||{days:{},loops:[],bm:{},social:{}}}catch{return{days:{},loops:[],bm:{},social:{}}}},write(){if(!CHECK&&!checking)try{localStorage.setItem('proto_delivery_records',JSON.stringify(records))}catch{}}};
let records=store.read();const date=()=>new Date().toLocaleDateString('sv-SE');function daily(){return records.days[date()]??=( {active:0,voluntary:0,deliveries:0})}function count(type,id,event){if(CHECK||checking)return;const t=records[type][id]??={shown:0,click:0,complete:0};t[event]++;store.write()}
let S, particles=[],flash=0,shake=0,scroll=0,panVelocity=0,offer=0,ad=null,modal=null,firstDay=true;
function newWorker(){return{x:3,y:10,dir:'down',route:[],cargo:[],home:true,progress:0}}
function load(day=1,carry=false){if(S&&carry)closeLoops();const prev=carry?S:null;S={day,elapsed:0,phase:'play',hearts:3,coins:prev?.coins||0,earned:0,deliveries:0,pieces:(prev?.pieces||0)+8+(Math.min(day,5)-1)*6,roads:prev?.roads||new Set(['3,10']),houses:[],workers:[newWorker()],capacity:prev?.capacity||1,speed:prev?.speed||0,companion:prev?.companion||false,boost:0,boostUsed:false,continueUsed:false,voluntary:false,inputCount:0,guideDismissed:false,changes:0};if(S.companion)S.workers.push(newWorker());const counts=[3,5,7,9,12], start=[2,4,6,8,10];for(let i=0;i<start[Math.min(4,day-1)];i++)addHouse(i,!prev||i>=prev.houses.length);S.total=counts[Math.min(4,day-1)];ad=null;modal=null;offer=0;particles=[];speedShown=false;focusMailbox();return state()}
function addHouse(i,unseen=true){S.houses.push({id:i,pos:POS[i],lit:false,ever:false,unseen,ignition:0,wait:null,next:12+(i*3)%9,loop:null})}
function blocked(x,y){return x<0||x>5||y<0||y>13||(x===2&&y===10)||DEC.some(d=>d[0]===x&&d[1]===y)||POS.some(p=>p[0]===x&&p[1]===y)}
function adjacentRoad(x,y){return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(p=>S.roads.has(key(...p)))}
function pave(x,y){if(S.phase!=='play'||ad||modal||blocked(x,y)||S.roads.has(key(x,y))||!adjacentRoad(x,y))return false;if(!S.pieces){shake=.15;return false}S.roads.add(key(x,y));S.pieces--;S.changes++;return true}
function erase(x,y){if(S.phase!=='play'||ad||modal||S.workers.some(w=>(Math.round(w.x)===x&&Math.round(w.y)===y)||(w.route[0]?.[0]===x&&w.route[0]?.[1]===y)))return false;if(S.roads.delete(key(x,y))){S.pieces++;S.changes++;return true}return false}
function gesture(points){if(S.phase!=='play'||ad||modal||!points.length)return false;const [x,y]=points[0];if(!S.roads.has(key(x,y))&&!adjacentRoad(x,y))return false;pave(x,y);let last=[x,y];for(const target of points.slice(1)){let guard=100;while((last[0]!==target[0]||last[1]!==target[1])&&guard--){last=last[0]!==target[0]?[last[0]+Math.sign(target[0]-last[0]),last[1]]:[last[0],last[1]+Math.sign(target[1]-last[1])];if(blocked(...last))break;pave(...last)}}recordInput();return true}
function recordInput(){S.inputCount++;for(const h of S.houses)if(h.loop){h.loop.inputs++;if(h.loop.first===null)h.loop.first=S.elapsed-h.loop.start}if(!CHECK&&!checking&&daily().active>=300&&!S.voluntary){daily().voluntary++;S.voluntary=true}store.write()}
function bfs(from,goal){const start=key(Math.round(from[0]),Math.round(from[1]));if(!S.roads.has(start))return null;const q=[start],prev=new Map([[start,null]]);for(let i=0;i<q.length;i++){const k=q[i],p=parse(k);if(goal(p)){const out=[];let c=k;while(prev.get(c)!==null){out.unshift(parse(c));c=prev.get(c)}return out}for(const n of [[p[0]-1,p[1]],[p[0]+1,p[1]],[p[0],p[1]-1],[p[0],p[1]+1]]){const nk=key(...n);if(S.roads.has(nk)&&!prev.has(nk)){prev.set(nk,k);q.push(nk)}}}return null}
function finishLoop(h,result){if(!h.loop)return;if(!CHECK&&!checking)records.loops.push({date:date(),day:S.day,house:h.id+1,firstInput:h.loop.first,inputs:h.loop.inputs,duration:S.elapsed-h.loop.start,failures:result==='failure'?1:0,aborted:result==='aborted',result});h.loop=null;store.write()}
function closeLoops(){if(S)for(const h of S.houses)finishLoop(h,'aborted')}
function request(h){h.wait=0;h.loop={start:S.elapsed,first:null,inputs:0};S.changes++}
function reward(h){if(h.wait===null)return;const amount=10+(h.wait<=10?5:0);finishLoop(h,'success');h.wait=null;h.next=12+(h.id*3)%9;h.ignition=h.lit?0:1;h.lit=h.ever=true;h.greeting=1.4;S.coins+=amount;S.earned+=amount;S.deliveries++;S.changes++;if(!CHECK&&!checking)daily().deliveries++;flash=.7;shake=.22;for(let i=0;i<14;i++)particles.push({x:h.pos[0]*180+90,y:h.pos[1]*117+40,vx:Math.cos(i*2.4)*150,vy:-160-(i%4)*40,t:0,coin:i<5,goal:i%2===0});sound();store.write()}
function sound(){try{const a=audioContext??=new(window.AudioContext||window.webkitAudioContext)();a.resume();[660,880,1100].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(.06,a.currentTime+i*.07);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.07+.2);o.start(a.currentTime+i*.07);o.stop(a.currentTime+i*.07+.22)})}catch{}}let audioContext=null;
function assign(w){if(w.cargo.length)return;const reserved=S.workers.flatMap(a=>a===w?[]:a.cargo);let current=[w.x,w.y];for(let slot=0;slot<S.capacity;slot++){let options=S.houses.filter(h=>h.wait!==null&&!w.cargo.includes(h.id)&&!reserved.includes(h.id)).map(h=>({h,path:bfs(current,p=>near(p,h.pos))})).filter(v=>v.path!==null);options.sort(slot===0?(a,b)=>b.h.wait-a.h.wait:(a,b)=>a.path.length-b.path.length||a.h.id-b.h.id);if(!options.length)break;w.cargo.push(options[0].h.id);current=options[0].path.at(-1)||current}w.home=!w.cargo.length}
function worker(w,dt){if(!w.cargo.length&&near([Math.round(w.x),Math.round(w.y)],[2,10]))assign(w);const h=S.houses.find(h=>h.id===w.cargo[0]);if(h&&h.wait===null){w.cargo.shift();w.route=[];return}const target=h?h.pos:[2,10];if(near([w.x,w.y],target)){if(h){reward(h);w.cargo.shift()}else{w.home=true;assign(w)}return}if(!w.route.length){w.route=bfs([w.x,w.y],p=>near(p,target))||[];if(!w.route.length)return}let budget=dt*2.2*(1+.2*S.speed)*(S.boost>0?2:1);while(budget>0&&w.route.length){const p=w.route[0];if(!S.roads.has(key(...p))){w.route=[];break}const dx=p[0]-w.x,dy=p[1]-w.y,dist=Math.abs(dx)+Math.abs(dy);w.dir=dx?dx>0?'right':'left':dy>0?'down':'up';if(dist<=budget){w.x=p[0];w.y=p[1];w.route.shift();budget-=dist}else{w.x+=Math.sign(dx)*budget;w.y+=Math.sign(dy)*budget;budget=0}}}
function endDay(){closeLoops();S.phase='end';offer=2;count('bm','double','shown');count('social','community','shown');if(community()>=1000){flash=1;for(let i=0;i<30;i++)particles.push({x:i*36,y:scroll+250,vx:0,vy:-100,t:0,coin:true});sound()}}
function community(){return NEIGHBORS.reduce((n,a)=>n+a.contribution,0)+S.deliveries}
function step(dt){dt=Math.max(0,Math.min(Number(dt)||0,600));while(dt>0){const d=Math.min(.05,dt);tick(d);dt-=d}return state()}
function tick(dt){if(!pointer&&Math.abs(panVelocity)>.5&&S.phase==='play'&&!ad&&!modal){scroll+=panVelocity*dt;panVelocity*=Math.exp(-10*dt);clampScroll()}flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);particles.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt*70});particles=particles.filter(p=>p.t<1.3);if(ad){ad.left-=dt;if(ad.left<=0){const cb=ad.done;ad=null;cb()}return}if(modal)return;if(S.phase==='continue'){offer-=dt;if(offer<=0)endDay();return}if(S.phase==='end'){offer-=dt;if(offer<=0)nextDay();return}if(S.phase!=='play')return;S.elapsed+=dt;S.boost=Math.max(0,S.boost-dt);if(!CHECK&&!checking){daily().active+=dt}if(S.elapsed>=60&&S.houses.length<S.total)while(S.houses.length<S.total)addHouse(S.houses.length);for(const h of S.houses){h.ignition=Math.max(0,h.ignition-dt);h.greeting=Math.max(0,(h.greeting||0)-dt);if(h.wait===null){h.next-=dt;if(h.next<=0)request(h)}else{h.wait+=dt;if(h.wait>=30){h.lit=false;h.wait=null;h.next=8;finishLoop(h,'failure');S.hearts--;S.changes++;shake=.3;if(S.hearts<=0){S.hearts=0;if(!S.continueUsed){S.phase='continue';offer=2;count('bm','continue','shown')}else endDay();break}}}}if(S.phase==='play'){for(const w of S.workers)worker(w,dt);if(S.elapsed>=120)endDay()} }
function nextDay(){count('social','community','complete');load(S.day+1,true)}
function advertise(id,done){if(ad)return;count('bm',id,'click');ad={id,left:5,done:()=>{count('bm',id,'complete');done()}}}
function speedAd(){if(S.phase!=='play'||S.boostUsed)return;advertise('speed',()=>{S.boostUsed=true;S.boost=30})}
function upgrade(kind){const prices={capacity:S.capacity===1?100:S.capacity===2?300:Infinity,speed:[80,200,500][S.speed]??Infinity,companion:S.companion?Infinity:600},cost=prices[kind];if(S.coins<cost)return false;S.coins-=cost;if(kind==='capacity')S.capacity=S.capacity===1?2:4;else if(kind==='speed')S.speed++;else{S.companion=true;S.workers.push(newWorker())}return true}
function affordable(){return [S.capacity===1?100:S.capacity===2?300:Infinity,[80,200,500][S.speed]??Infinity,S.companion?Infinity:600].filter(v=>v<=S.coins).length}
function input(kind,...args){if(ad)return false;S.guideDismissed=true;if(kind==='drag')return gesture(args[0]);if(kind==='tap')return erase(...args);if(kind==='scroll'){scroll+=args[0];clampScroll()}if(kind==='speed')speedAd();if(kind==='continue'&&S.phase==='continue')advertise('continue',()=>{S.continueUsed=true;S.hearts=1;S.phase='play'});if(kind==='double'&&S.phase==='end')advertise('double',()=>{S.coins+=S.earned;nextDay()});if(kind==='next'&&S.phase==='end')nextDay();if(kind==='upgrade')return upgrade(args[0]);if(kind==='cart'&&S.phase==='play')modal='cart';if(kind==='map'&&S.phase==='play')modal='map';if(kind==='pass'){count('bm','pass','click');modal='pass'}if(kind==='close')modal=null;return state()}
function state(){return{...S,roads:[...S.roads],houses:S.houses.map(h=>({...h})),workers:S.workers.map(w=>({...w})),scroll,modal,ad:ad?{id:ad.id,left:ad.left}:null,community:community(),loopDefinition:LOOP}}
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'), images={},failures=[],silhouettes=new Set();
const NAMES=['ground','road-dirt','road-stone','road-express','house-blue','house-purple','house-red','house-green','mailbox','tree1','tree2','lamp','max-down','max-up','max-left','max-right','parcel','heart','coin',...['pill','gauge-frame','gauge-fill','btn-cart','btn-speed','btn-map','badge-red','badge-play','bubble-clock','bubble-parcel','btn-main','window'].map(n=>'ui-'+n)];
const ready=Promise.all(NAMES.map(n=>new Promise(resolve=>{const im=new Image();images[n]=im;im.onload=resolve;im.onerror=()=>{failures.push(n);resolve()};im.src='art/sprites/'+n+'.png'})));
let W=1080,H=1920,safeTop=0,bottom=0,mapTop=290,bandY=1594,mapHeight=1304,buttons=[],pointer=null,lastTime=null,speedShown=false;
function resize(){const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);H=r.height/(r.width/1080);const safe=getComputedStyle(document.querySelector('#safe'));const scale=1080/r.width;safeTop=parseFloat(safe.paddingTop)*scale;bottom=parseFloat(safe.paddingBottom)*scale;mapTop=safeTop+290;bandY=H-bottom-326;mapHeight=Math.max(1,bandY-mapTop);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);clampScroll()}
function focusMailbox(){panVelocity=0;scroll=10.5*117-mapHeight*.56;clampScroll()}
function clampScroll(){scroll=Math.max(0,Math.min(scroll,Math.max(0,1638-mapHeight,10.5*117-mapHeight*.56)))}
function guideVisible(){return S.day===1&&!S.guideDismissed&&S.inputCount===0&&S.phase==='play'&&!ad&&!modal}
function drawGuide(){if(!guideVisible())return;const cycle=S.elapsed%2.8,t=Math.max(0,Math.min(1,(cycle-.4)/1.7)),x=630+t*180,y=1228.5;
ctx.save();ctx.globalAlpha=.58*Math.min(1,cycle/.25,(2.8-cycle)/.35);ctx.strokeStyle='#fff6dd';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([12,18]);ctx.beginPath();ctx.moveTo(630,1228.5);ctx.lineTo(810,1228.5);ctx.stroke();ctx.setLineDash([]);
ctx.translate(x,y);ctx.rotate(-.25);ctx.fillStyle='#fff6dd';ctx.strokeStyle='#b9a5c9';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-15,-4,30,85,15);ctx.fill();ctx.stroke();ctx.beginPath();ctx.roundRect(-30,42,85,76,24);ctx.fill();ctx.stroke();ctx.restore()}
function houseIndicators(){return S.houses.flatMap(h=>{const y=h.pos[1]*117+20-scroll;if(y>=100&&y<=mapHeight-150){h.unseen=false;return []}return h.unseen?[{id:h.id,x:y>mapHeight-150&&h.pos[0]===3?750:Math.max(65,Math.min(W-65,h.pos[0]*180+90)),y:y<100?mapTop+58:bandY-65,direction:y<100?-1:1}]:[]})}
function drawHouseIndicators(){for(const marker of houseIndicators()){const {x,y,direction}=marker;glow(x,y,65,'255,157,55',.45);sprite('parcel',x-27,y-27,54,54);ctx.fillStyle='#ffe1a0';ctx.beginPath();ctx.moveTo(x,y+direction*55);ctx.lineTo(x-17,y+direction*34);ctx.lineTo(x+17,y+direction*34);ctx.closePath();ctx.fill()}}
function sprite(n,x,y,w,h,filter='none'){const im=images[n];ctx.save();ctx.filter=filter;if(im?.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h);else{silhouettes.add(n);ctx.fillStyle='#b8adc5';ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(w,h)*.22);ctx.fill()}ctx.restore()}
function nine(n,x,y,w,h){const im=images[n];if(!im?.naturalWidth)return sprite(n,x,y,w,h);const sw=im.naturalWidth,sh=im.naturalHeight,b=n==='ui-window'?70:Math.min(sh/2-1,sw/3),db=n==='ui-window'?Math.min(70,h/3,w/3):Math.min(h/2-1,w/3,b*h/sh);const xs=[0,b,sw-b,sw],ys=[0,b,sh-b,sh],xd=[x,x+db,x+w-db,x+w],yd=[y,y+db,y+h-db,y+h];for(let a=0;a<3;a++)for(let b=0;b<3;b++)ctx.drawImage(im,xs[a],ys[b],xs[a+1]-xs[a],ys[b+1]-ys[b],xd[a],yd[b],xd[a+1]-xd[a],yd[b+1]-yd[b])}
function text(s,x,y,size=40,color='#fff6dd'){ctx.font=`800 ${size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.strokeStyle='#4a2a20';ctx.lineWidth=Math.max(4,size*.12);ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y)}

function button(id,label,x,y,w,h,fn,art='ui-btn-main'){nine(art,x,y,w,h);text(label,x+w/2,y+h/2,Math.min(43,h*.36));buttons.push({id,x,y,w,h,fn})}
function gauge(x,y,w,h,value,label){nine('ui-gauge-frame',x,y,w,h);ctx.save();ctx.beginPath();ctx.rect(x+20,y+10,Math.max(0,(w-40)*Math.min(1,value)),h-20);ctx.clip();nine('ui-gauge-fill',x+15,y,w-30,h);ctx.restore();text(label,x+w/2,y+h/2,38)}
