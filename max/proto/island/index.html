</style></head><body><main id="game"><canvas id="scene" aria-label="섬 지도: 조각을 고르고 칸을 탭하세요"></canvas><div id="hud"><button id="pass" aria-label="꾸미기 패스"><img src="art/sprites/house-red.png" alt=""></button><div class="gauge"><div class="fill" id="progress"></div><strong id="stage"></strong></div><div id="timer"><svg viewBox="0 0 36 36" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="14"/><path d="M18 9v9l7 4"/></svg><span id="timerText"></span></div><div class="panel" id="request"><img id="questIcon" alt=""><span id="questText"></span></div><button id="mail" aria-label="이웃 편지"><img src="art/sprites/ui-mail.png" alt=""></button></div><div id="tray"><span id="badge"></span></div><button id="clock" aria-label="시계탑 조각"><img src="art/sprites/clock.png" alt=""></button><div id="offer"><p class="panel">조각 하나만 더 있으면…</p><button class="ad" id="ad">+3 ▶</button></div><div class="panel" id="toast"></div><div id="modal"><section id="window"></section></div><div id="stats"></div><output id="checkResult"></output></main>
<script>
(()=>{'use strict';
const CORE_LOOP={본다:'바다 위 작은 섬(아이소메트릭). 위에 섬의 부탁 하나(그림+숫자: 집 3채를 붙여 마을 / 다리로 두 섬 잇기 / 등대 세우기). 아래 조각 칸 다섯',한다:'아래 조각을 골라(탭) 섬 위 빈칸을 탭 = 그 자리에 퐁 놓임. 물 칸에 놓으면 땅이 솟고 그 위에 놓임. 다리는 두 땅 사이 물에만',받는다:'조각이 통통 튀며 솟고 이웃 조각과 이어짐(지붕 붙음·계단 생김), 작은 사람이 걸어 나옴. 부탁을 채우면 섬이 반짝이며 한 단계 자람',실패:'없음(힐링). 아쉬움 = 오늘 조각을 다 썼는데 부탁 하나가 한 칸 모자람',다시:'부탁이 바뀜, 새 조각 종류가 열림, 이웃이 놓은 조각이 섬 모양을 바꿔 놓음',보기:'탭 한 번에 다리가 놓이며 두 섬 사람들이 건너가 만나는 순간 · 하루 뒤 돌아오면 섬이 남의 손으로 자라 있음',한바퀴:'조각 하나 3~5초 · 부탁 하나 30~60초',이벤트:'루프 시작 = 새 부탁 · 입력 = 칸 탭 · 성공 = 부탁 완료 · 실패 = 조각 소진 · 끝 = 오늘 조각 0'};
const FILES=['water','tile-stone','tile-grass','tile-stairs','tile-rock','house-red','house-mint','house-yellow','house-blue','bridge-a','bridge-b','lighthouse','clock','tree1','tree2','flowers','flag-red','flag-mint','flag-yellow','person-l1','person-l2','person-l3','person-r1','person-r2','person-r3','ui-card','ui-gauge-frame','ui-gauge-fill','ui-tray','ui-slot','ui-slot-sel','ui-badge-blue','ui-pill-ad','ui-heart','ui-mail','ui-window','ui-btn-main'];
const DIMENSIONS={'tile-stone':[280,198],'tile-grass':[280,207],'tile-stairs':[280,211],'tile-rock':[280,213],'bridge-a':[322,253],'bridge-b':[322,249],'house-red':[218,239],'house-mint':[218,245],'house-yellow':[218,241],'house-blue':[218,245],lighthouse:[174,260],clock:[190,290],tree1:[168,203],tree2:[168,215],flowers:[168,151]};
const TYPES=['house','bridge','tree','flowers','land'],LABELS=['집','다리','나무','꽃','땅'],ICONS=['house-yellow','bridge-b','tree1','flowers','tile-stone'];
const QUESTS=[['집 2채 더 짓기',2,'house-red'],['다리로 두 섬 잇기',1,'bridge-b'],['땅 3칸 넓히기',3,'tile-grass'],['나무·꽃 4개',4,'tree1'],['섬 B에 집 3채',3,'house-blue'],['셋째 섬 땅 2칸 + 다리',3,'bridge-a']];
const NEIGHBORS=['하늘','민트','노을','보리','소라','여울','해솔','나루','달래'].map((label,i)=>({id:i,label,color:['red','mint','yellow'][i%3],record:18+i*3,portrait:'person-'+(i%2?'l':'r')+(i%3+1)}));
const el=id=>document.getElementById(id),canvas=el('scene'),ctx=canvas.getContext('2d'),params=new URLSearchParams(location.search);
let checking=params.has('check'),testing=false,images={},assetErrors=[],silhouettes=0,runtimeErrors=[],view={w:1080,h:2340,scale:1,dx:0,dy:0},fx=[],walkers=[],notice='',noticeUntil=0,offerUntil=0,offeredDay=-1,socialOfferedDay=-1,celebrate=0,bridgeMeet=null,adRemaining=0,modalKind='',pointer=null,audioCtx=null,lastFrame=0,saveElapsed=0;
const key=(c,r)=>c+','+r,coords=k=>k.split(',').map(Number),adj=(c,r)=>[[c-1,r],[c+1,r],[c,r-1],[c,r+1]],dateKey=()=>new Date().toLocaleDateString('sv-SE');
function storageRead(k,fallback){try{return JSON.parse(localStorage.getItem('proto_island_'+k))||fallback}catch{return fallback}}
let records=storageRead('records',{days:{},loops:[],bm:{},social:{}}),s;
function fresh(){const cells={};for(const [c,r] of [[0,0],[1,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2],[4,1],[4,2],[5,2],[4,3],[5,3]])cells[key(c,r)]={terrain:[[2,1],[0,2],[5,3],[4,3]].some(p=>p[0]===c&&p[1]===r)?'grass':'stone',object:null};for(const [c,r,obj] of [[0,0,'house-red'],[1,0,'house-mint'],[0,1,'house-yellow'],[2,1,'tree1'],[0,2,'flowers'],[1,2,'house-blue'],[4,1,'lighthouse'],[5,2,'house-red'],[5,3,'tree2']])cells[key(c,r)].object=obj;return {cells,pieces:5,quest:0,counts:[0,0,0,0,0,0],placed:0,day:1,dayElapsed:0,ads:0,selected:null,houseColor:0,loop:null,mail:[],joined:false,thirdBridge:false,voluntary:false};}
s=checking?fresh():storageRead('save',fresh());
function dayRecord(){const d=dateKey();return records.days[d]||(records.days[d]={active:0,voluntary:0,placements:0})}
function save(){if(checking||testing)return;try{localStorage.setItem('proto_island_save',JSON.stringify(s));localStorage.setItem('proto_island_records',JSON.stringify(records))}catch{}}
function metric(group,slot,event){if(checking||testing)return;const bucket=records[group][slot]||(records[group][slot]={shown:0,click:0,complete:0});bucket[event]++;save()}
function beginLoop(){if(s.quest<6)s.loop={quest:s.quest+1,date:dateKey(),elapsed:0,first:null,inputs:0,failures:0,voluntary:false}}
if(!s.loop)beginLoop();
function endLoop(success,abandoned=false){if(!s.loop)return;if(!checking&&!testing)records.loops.push({...s.loop,success,abandoned,ended:new Date().toISOString()});s.loop=null}
function connected(a,b,cells=s.cells){if(!cells[a]||!cells[b])return false;const seen=new Set([a]),queue=[a];for(let i=0;i<queue.length;i++){if(queue[i]===b)return true;const [c,r]=coords(queue[i]);for(const p of adj(c,r)){const k=key(...p);if(cells[k]&&!seen.has(k)){seen.add(k);queue.push(k)}}}return false}
function legal(type,c,r){if(!Number.isInteger(c)||!Number.isInteger(r)||c < -3||c>8||r < -3||r>8)return false;const cell=s.cells[key(c,r)],neighbors=adj(c,r).map(p=>s.cells[key(...p)]);if(type==='land')return !cell&&neighbors.some(Boolean);if(type==='bridge')return !cell&&((neighbors[0]&&neighbors[1])||(neighbors[2]&&neighbors[3]));if(type==='clock')return s.quest>=2&&cell&&!cell.bridge&&!cell.object&&!Object.values(s.cells).some(t=>t.object==='clock');return TYPES.includes(type)&&cell&&!cell.bridge&&!cell.object;}
function options(type){const out=[];for(let c=-3;c<=8;c++)for(let r=-3;r<=8;r++)if(legal(type,c,r))out.push([c,r]);return out}
function progressQuest(){if(s.quest===1)s.counts[1]=s.joined?1:0;if(s.quest===5){const target=[[2,4],[2,5],[3,4],[3,5]].filter(p=>s.cells[key(...p)]&&!s.cells[key(...p)].bridge).length;s.counts[5]=Math.min(2,target)+(s.thirdBridge?1:0)}if(s.quest<6&&s.counts[s.quest]>=QUESTS[s.quest][1]){endLoop(true);s.quest++;celebrate=1.2;burst(540,view.h*.44,40,'#fff3ac');sound(true);showNotice(s.quest===6?'우리 섬이 다 자랐어요!':'섬이 한 단계 자랐어요!');beginLoop();if(s.quest===6)socialStop();}}
function burst(x,y,n=12,color='#fff8d8'){for(let i=0;i<n;i++)fx.push({x,y,vx:Math.cos(i*2.4)*80,vy:-80-Math.sin(i*1.7)*90,life:.8,max:.8,color})}
function sound(big=false){if(testing)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();for(let i=0;i<(big?3:1);i++){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime+i*.08;osc.frequency.setValueAtTime((big?660:520)*(1+i*.25),t);osc.frequency.exponentialRampToValueAtTime(900*(1+i*.2),t+.12);gain.gain.setValueAtTime(.035,t);gain.gain.exponentialRampToValueAtTime(.001,t+.24);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+.25)}}catch{}}
function showNotice(text){notice=text;noticeUntil=3;}
function exhaust(){if(s.loop)s.loop.failures++;endLoop(false);if(s.ads<2&&s.quest<6){offerUntil=2;offeredDay=s.day;metric('bm','pieces','shown')}socialStop();}
function cellInput(c,r){if(s.loop){s.loop.inputs++;if(s.loop.first===null)s.loop.first=s.loop.elapsed;if(!s.loop.voluntary&&dayRecord().active>=300){s.loop.voluntary=true;if(!checking&&!testing)dayRecord().voluntary++}}if(!s.selected||s.pieces<=0)return false;return place(s.selected,c,r,false);}
function place(type,c,r,neighbor=false,neighborId=0){if(!legal(type,c,r)||(!neighbor&&s.pieces<=0)){const cell=s.cells[key(c,r)];if(cell)cell.shake=.25;return false}const k=key(c,r),ns=adj(c,r).map(p=>s.cells[key(...p)]),wasJoined=connected('0,0','4,1');let cell=s.cells[k];if(type==='land')cell=s.cells[k]={terrain:ns.some(t=>t&&t.terrain==='grass')?'grass':'stone',object:null};else if(type==='bridge')cell=s.cells[k]={terrain:'stone',object:null,bridge:ns[0]&&ns[1]?'b':'a'};else{cell.object=type==='house'?'house-'+['red','mint','yellow','blue'][s.houseColor++%4]:type==='tree'?'tree1':type;}
cell.bounce=.35;for(const p of adj(c,r)){const n=s.cells[key(...p)];if(n)n.bounce=.18}if(neighbor)cell.flag=neighborId;else{s.pieces--;if(!checking&&!testing)dayRecord().placements++}s.placed++;
if(type==='house'){if(s.quest===0)s.counts[0]++;if(s.quest===4&&c>=4)s.counts[4]++}if(type==='land'&&s.quest===2)s.counts[2]++;if((type==='tree'||type==='flowers')&&s.quest===3)s.counts[3]++;
s.joined=connected('0,0','4,1');if(type==='bridge'&&!wasJoined&&s.joined){celebrate=1.2;bridgeMeet={c,r,time:1.2,axis:cell.bridge};showNotice('이어졌어요!');sound(true)}if(type==='bridge'&&s.quest===5&&adj(c,r).some(p=>[[2,4],[2,5],[3,4],[3,5]].some(q=>q[0]===p[0]&&q[1]===p[1]))&&connected('0,0',k))s.thirdBridge=true;
const p=project(c,r);burst(p.x,p.y);sound();progressQuest();syncWalkers();if(!neighbor&&s.pieces===0)exhaust();save();renderUI();return true;}
function nextDay(){if(s.loop){endLoop(false,true)}s.day++;metric('bm','pass','shown');s.dayElapsed=0;s.pieces=5;s.ads=0;s.selected=null;s.mail=[];beginLoop();for(let i=0;i<3;i++){const id=((s.day-2)*3+i)%9;const type=['land','tree','flowers'][i];const candidates=options(type);if(candidates.length){const p=candidates[(s.day+i)%candidates.length];place(type,...p,true,id);s.mail.push(id);metric('social','thanks','shown')}}showNotice('밤사이 이웃이 조각 '+s.mail.length+'개를 놓았어요');socialStop();save();renderUI();}
function select(type){if(s.pieces<=0){if(s.ads<2&&s.quest<6&&adRemaining<=0){offerUntil=2;metric('bm','pieces','shown');renderUI()}return;}s.selected=s.selected===type?null:type;renderUI()}
function showModal(kind,html){modalKind=kind;el('window').innerHTML=html;el('modal').style.display='flex'}
function closeModal(){if(adRemaining>0)return;modalKind='';el('modal').style.display='none'}
function startAd(){if(s.pieces||s.ads>=2||s.quest>=6||adRemaining>0)return false;metric('bm','pieces','click');adRemaining=5;offerUntil=0;showModal('ad','<h2>광고 보는 중</h2><p id="adTime">5초</p>');return true}
function socialStop(){if(socialOfferedDay!==s.day){socialOfferedDay=s.day;metric('social','mail','shown')}}
function openMail(){metric('social','mail','click');const rows=NEIGHBORS.slice().sort((a,b)=>b.record-a.record).map(n=>'<p><img src="art/sprites/'+n.portrait+'.png" alt=""> '+n.label+' · 조각 '+n.record+'개'+(s.mail.includes(n.id)?' · 오늘 선물 ✓':'')+'<br><button data-action="visit" data-neighbor="'+n.id+'">놀러 가기</button><button data-action="gift" data-neighbor="'+n.id+'">고마워요 선물</button></p>').join('');showModal('mail','<h2>밤사이 이웃이 조각 '+s.mail.length+'개</h2><p>'+s.mail.map(i=>NEIGHBORS[i].label).join(' · ')+'</p><p>이웃 랭킹 · 함께 놓은 조각 '+s.placed+' / '+(20+s.quest*5)+'</p><progress aria-label="공동 게이지" value="'+s.placed+'" max="'+(20+s.quest*5)+'"></progress>'+rows+'<button data-action="share">섬 사진 공유</button><button data-action="invite">초대 링크</button><button data-action="close">닫기</button>');metric('social','mail','complete');for(let i=0;i<9;i++){metric('social','visit','shown');metric('social','gift','shown')}metric('social','share','shown');metric('social','invite','shown')}
function passModal(){metric('bm','pass','click');showModal('pass','<h2>꾸미기 패스</h2><p>지붕 색과 특별한 조각</p>'+['house-red','house-mint','house-blue'].map(n=>'<img src="art/sprites/'+n+'.png" alt="지붕 색">').join('')+'<p>'+['clock','lighthouse','tree2'].map(n=>'<img style="filter:brightness(0) opacity(.16)" src="art/sprites/'+n+'.png" alt="특별 조각 실루엣">').join('')+'</p><p>패스 · 시제품 미리보기</p><button data-action="close">닫기</button>')}
async function shareIsland(){metric('social','share','click');try{const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const file=new File([blob],'우리-작은-섬.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'우리 작은 섬'});else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}metric('social','share','complete')}catch(e){if(e.name!=='AbortError')showNotice('사진을 저장하지 못했어요')}}
function syncWalkers(){const homes=Object.entries(s.cells).filter(([,t])=>t.object&&t.object.startsWith('house')).slice(0,12);while(walkers.length<homes.length){const [k]=homes[walkers.length];walkers.push({from:k,to:k,t:0,id:walkers.length})}walkers.length=homes.length;}
function step(dt){dt=Math.max(0,Number(dt)||0);if(document.hidden&&!testing)return;s.dayElapsed+=dt;const active=adRemaining<=0&&celebrate<=0&&modalKind==='';if(active){if(s.loop)s.loop.elapsed+=dt;if(!checking&&!testing)dayRecord().active+=dt}if(adRemaining>0){adRemaining=Math.max(0,adRemaining-dt);if(el('adTime'))el('adTime').textContent=Math.ceil(adRemaining)+'초';if(!adRemaining){s.pieces+=3;s.ads++;metric('bm','pieces','complete');closeModal();if(!s.loop)beginLoop();save()}}celebrate=Math.max(0,celebrate-dt);if(bridgeMeet){bridgeMeet.time-=dt;if(bridgeMeet.time<=0)bridgeMeet=null}offerUntil=Math.max(0,offerUntil-dt);noticeUntil=Math.max(0,noticeUntil-dt);for(const t of Object.values(s.cells)){t.bounce=Math.max(0,(t.bounce||0)-dt);t.shake=Math.max(0,(t.shake||0)-dt);t.heart=Math.max(0,(t.heart||0)-dt)}for(const f of fx){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt}fx=fx.filter(f=>f.life>0);for(const w of walkers){w.t+=dt*.4;if(w.t>=1){w.from=w.to;const [c,r]=coords(w.from),choices=adj(c,r).filter(p=>s.cells[key(...p)]);w.to=choices.length?key(...choices[(w.id+s.day+Math.floor(s.dayElapsed))%choices.length]):w.from;w.t=0}}if(s.dayElapsed>=300)nextDay();saveElapsed+=dt;if(saveElapsed>=2){saveElapsed=0;save()}renderUI();}
function project(c,r){return {x:400+(c-r)*140+view.dx,y:(330+view.h-314)/2-400+(c+r)*70+view.dy}}
function unproject(x,y){const base=project(0,0),a=(x-base.x)/140,b=(y-base.y)/70;return [Math.round((a+b)/2),Math.round((b-a)/2)]}
function resize(){const box=el('game').getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);view.w=1080;view.h=box.height/box.width*1080;view.scale=box.width/1080;view.clipTop=(el('request').getBoundingClientRect().bottom-box.top+8)/view.scale;view.clipBottom=(el('tray').getBoundingClientRect().top-box.top-8)/view.scale;ctx.setTransform(dpr*view.scale,0,0,dpr*view.scale,0,0)}
function sprite(id,x,y,w,h,pivot=.5){const im=images[id];if(im&&im.complete&&im.naturalWidth){ctx.drawImage(im,x-w/2,y-h*pivot,w,h)}else{silhouettes++;ctx.fillStyle='#d4d1df';ctx.beginPath();ctx.roundRect(x-w/2,y-h*pivot,w,h,Math.min(w,h)*.2);ctx.fill()}}
function dimensions(id){const im=images[id];return im&&im.naturalWidth?[im.naturalWidth,im.naturalHeight]:(DIMENSIONS[id]||[180,220])}
function drawObject(id,x,y){const [w,h]=dimensions(id);const base=id.startsWith('house')?h-30:h-12;sprite(id,x,y,w,h,base/h)}
function diamond(x,y){const breath=(1-Math.cos(s.dayElapsed*Math.PI*2/.9))/2;ctx.save();ctx.beginPath();ctx.moveTo(x,y-70);ctx.lineTo(x+140,y);ctx.lineTo(x,y+70);ctx.lineTo(x-140,y);ctx.closePath();ctx.strokeStyle='#7ff0c8';ctx.lineWidth=6;ctx.globalAlpha=.6+.3*breath;ctx.shadowColor='#7ff0c880';ctx.shadowBlur=12+6*breath;ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,1080,view.h);for(let y=0,i=0;y<view.h;y+=1620,i++){ctx.save();ctx.translate(540,y+(i%2?1620:0));ctx.scale(1,i%2?-1:1);sprite('water',0,0,1080,1620,0);ctx.restore()}ctx.save();ctx.beginPath();ctx.rect(0,view.clipTop||390,1080,Math.max(0,(view.clipBottom||view.h-345)-(view.clipTop||390)));ctx.clip();const cells=Object.entries(s.cells).map(([k,t])=>({k,t,p:coords(k)}));if(s.selected&&s.pieces)for(const p of options(s.selected)){if(!s.cells[key(...p)])cells.push({k:key(...p),t:null,p})}cells.sort((a,b)=>a.p[0]+a.p[1]-b.p[0]-b.p[1]||a.p[0]-b.p[0]);for(const {t,p} of cells){const v=project(...p);if(!t){diamond(v.x,v.y);continue}const bounce=t.bounce?Math.sin((1-t.bounce/.35)*Math.PI)*25:0;const x=v.x+(t.shake?Math.sin(t.shake*90)*10:0),y=v.y-bounce;if(t.bridge){const [,h]=dimensions('bridge-'+t.bridge);sprite('bridge-'+t.bridge,x,y,322,h,(h-50)/h)}else{const [,h]=dimensions('tile-'+t.terrain);sprite('tile-'+t.terrain,x,y,282,h,70/h)}if(s.selected&&s.pieces&&legal(s.selected,...p))diamond(x,y);if(t.object)drawObject(t.object,x,y);}
for(const w of walkers){const a=project(...coords(w.from)),b=project(...coords(w.to)),t=Math.min(1,w.t);sprite('person-'+(b.x<a.x?'l':'r')+(w.id%3+1),a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t-Math.abs(Math.sin(s.dayElapsed*5+w.id))*5,40,80,1)}
if(bridgeMeet){const m=project(bridgeMeet.c,bridgeMeet.r),t=1-bridgeMeet.time/1.2,dx=bridgeMeet.axis==='b'?140:-140;for(const sign of [-1,1])sprite('person-'+(sign<0?'r2':'l2'),m.x+sign*(dx*(1-t)+16*t),m.y+sign*70*(1-t),40,80,1)}
for(const {t,p} of cells){if(!t||t.flag===undefined)continue;const v=project(...p);sprite('flag-'+NEIGHBORS[t.flag].color,v.x+55,v.y-30,94,154,1);if(t.heart>0)sprite('ui-heart',v.x+75,v.y-190-(1-t.heart)*45,90,83,.5)}ctx.restore();if(celebrate>0){const gradient=ctx.createRadialGradient(540,view.h*.44,0,540,view.h*.44,650);gradient.addColorStop(0,'rgba(255,249,203,'+(celebrate/1.2*.6)+')');gradient.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gradient;ctx.fillRect(0,0,1080,view.h);ctx.fillStyle='white';ctx.font='bold 52px system-ui';ctx.textAlign='center';ctx.fillText(bridgeMeet?'이어졌어요!':'섬이 자랐어요!',540,view.h*.4)}for(const f of fx){ctx.globalAlpha=Math.max(0,f.life/f.max);ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(f.x,f.y,5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;}
function renderUI(){el('stage').textContent='섬 '+(s.quest+1)+'단계 · '+s.placed+'/'+(20+s.quest*5);el('progress').style.width=Math.min(100,s.placed/(20+s.quest*5)*100)+'%';const seconds=Math.max(0,300-Math.floor(s.dayElapsed));el('timerText').textContent=s.day+'일째 · 다음 날 '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');const q=QUESTS[Math.min(5,s.quest)];el('questText').textContent=s.quest<6?q[0]+' '+Math.min(q[1],s.counts[s.quest])+'/'+q[1]:'함께 만든 우리 섬 ✓';el('questIcon').src='art/sprites/'+q[2]+'.png';el('badge').textContent=s.pieces;for(let i=0;i<5;i++){const b=el('slot'+i);if(b)b.className='slot'+(s.selected===TYPES[i]?' selected':'')+(s.pieces===0?' empty':'')}el('clock').style.display=s.quest>=2?'block':'none';el('clock').style.opacity=s.pieces?1:.4;el('offer').style.display=offerUntil>0&&s.pieces===0?'block':'none';el('mail').style.display=(s.mail.length>0||s.pieces===0||s.quest===6)&&offerUntil<=0?'block':'none';el('toast').textContent=notice;el('toast').style.opacity=noticeUntil>0?1:0;}
for(let i=0;i<5;i++){const b=document.createElement('button');b.id='slot'+i;b.className='slot';b.setAttribute('aria-label',LABELS[i]+' 조각');b.innerHTML='<img src="art/sprites/'+ICONS[i]+'.png" alt=""><small>'+LABELS[i]+'</small>';b.onclick=()=>select(TYPES[i]);el('tray').appendChild(b)}
el('clock').onclick=()=>select('clock');el('pass').onclick=passModal;el('mail').onclick=openMail;el('ad').onclick=startAd;el('window').onclick=e=>{const action=e.target.dataset.action;if(action==='close')closeModal();if(action==='share')shareIsland();if(action==='visit'){const n=NEIGHBORS[Number(e.target.dataset.neighbor)];metric('social','visit','click');showModal('visit','<h2>'+n.label+'의 작은 섬</h2><p><img src="art/sprites/house-'+n.color+'.png" alt="이웃 집"><img src="art/sprites/'+n.portrait+'.png" alt="이웃"><img src="art/sprites/tree1.png" alt="나무"></p><p>함께 놓은 조각 '+n.record+'개</p><button data-action="mail">이웃 목록</button><button data-action="close">닫기</button>');metric('social','visit','complete')}if(action==='gift'){const n=NEIGHBORS[Number(e.target.dataset.neighbor)];metric('social','gift','click');metric('social','gift','complete');showNotice(n.label+'에게 고마워요 ♥');sound();e.target.textContent='♥ 보냈어요';e.target.disabled=true}if(action==='mail')openMail();if(action==='invite'){metric('social','invite','click');const url=new URL(location.href);url.search='?from=island';showModal('invite','<h2>함께 섬을 지어요</h2><p style="word-break:break-all;user-select:text">'+url.href.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</p><button data-action="close">닫기</button>');metric('social','invite','complete');if(navigator.clipboard)navigator.clipboard.writeText(url.href).catch(()=>{});}};
function flagTap(x,y){for(const [k,t] of Object.entries(s.cells)){if(t.flag===undefined)continue;const p=project(...coords(k));if(Math.abs(x-(p.x+55))<60&&y<p.y-20&&y>p.y-195){t.heart=1;metric('social','thanks','click');metric('social','thanks','complete');sound();return true}}return false}
canvas.addEventListener('pointerdown',e=>{if(pointer)return;canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,x:e.clientX,y:e.clientY,dx:view.dx,dy:view.dy,drag:false}});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>8)pointer.drag=true;if(pointer.drag){view.dx=Math.max(-1400,Math.min(1400,pointer.dx+(e.clientX-pointer.x)/view.scale));view.dy=Math.max(-1100,Math.min(1100,pointer.dy+(e.clientY-pointer.y)/view.scale))}});canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=pointer;pointer=null;if(p.drag)return;const box=canvas.getBoundingClientRect(),x=(e.clientX-box.left)/view.scale,y=(e.clientY-box.top)/view.scale;if(y<(view.clipTop||390)||y>(view.clipBottom||view.h-345))return;if(!s.loop&&s.pieces>0)beginLoop();if(!flagTap(x,y))cellInput(...unproject(x,y));renderUI();save()});canvas.addEventListener('pointercancel',()=>pointer=null);document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{lastFrame=0;save()});window.addEventListener('pagehide',()=>{if(s.loop&&s.loop.inputs){endLoop(false,true);beginLoop()}save()});window.addEventListener('resize',resize);window.addEventListener('error',e=>runtimeErrors.push(e.message));window.addEventListener('unhandledrejection',e=>runtimeErrors.push(String(e.reason)));
function showStats(){const root=el('stats');root.style.display='block';root.innerHTML='<h2>모두의 작은 섬 · 기록</h2><p>의무: 실제 플레이 누적 5분 / 이후 입력이 있는 루프를 자발 판수로 기록</p><table><tr><th>날짜</th><th>실제 초</th><th>자발 판</th><th>놓기</th></tr>'+Object.entries(records.days).map(([d,v])=>'<tr><td>'+d+'</td><td>'+Math.round(v.active)+'</td><td>'+v.voluntary+'</td><td>'+v.placements+'</td></tr>').join('')+'</table><h3>부탁별 루프</h3><table><tr><th>날짜·부탁</th><th>첫 입력 초</th><th>입력</th><th>초</th><th>실패</th><th>성공/중단</th></tr>'+records.loops.map(v=>'<tr><td>'+v.date+' #'+v.quest+'</td><td>'+(v.first===null?'—':v.first.toFixed(1))+'</td><td>'+v.inputs+'</td><td>'+v.elapsed.toFixed(1)+'</td><td>'+v.failures+'</td><td>'+(v.success?'성공':v.abandoned?'중단':'소진')+'</td></tr>').join('')+'</table>'+['bm','social'].map(g=>'<h3>'+g+'</h3><table><tr><th>자리</th><th>제시</th><th>누름</th><th>완료</th><th>수락률</th></tr>'+Object.entries(records[g]).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.shown+'</td><td>'+v.click+'</td><td>'+v.complete+'</td><td>'+(v.shown?(v.click/v.shown*100).toFixed(1):0)+'%</td></tr>').join('')+'</table>').join('')}
function check(){const backup=JSON.stringify(s),oldTesting=testing,oldRecords=JSON.stringify(records),transient={fx,walkers,notice,noticeUntil,offerUntil,offeredDay,socialOfferedDay,celebrate,bridgeMeet,adRemaining,modalKind,saveElapsed};let result;testing=true;try{s=fresh();fx=[];walkers=[];celebrate=0;adRemaining=0;modalKind='';beginLoop();const before=JSON.stringify(s.cells);let seed=713;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};for(let i=0;i<600;i++){const type=TYPES[Math.floor(random()*5)];s.selected=type;const choices=options(type),p=random()<.35&&choices.length?choices[Math.floor(random()*choices.length)]:[Math.floor(random()*12)-3,Math.floor(random()*12)-3];cellInput(...p);step(.1)}const changed=JSON.stringify(s.cells)!==before;s=fresh();beginLoop();step(60);const idleCannotWin=s.quest===0;result={seconds:60,errors:runtimeErrors.slice(),assetFailures:assetErrors.slice(),silhouettes,stateChanged:changed,idleCannotWin,passed:runtimeErrors.length===0&&assetErrors.length===0&&silhouettes===0&&changed&&idleCannotWin};}finally{s=JSON.parse(backup);records=JSON.parse(oldRecords);testing=oldTesting;({fx,walkers,notice,noticeUntil,offerUntil,offeredDay,socialOfferedDay,celebrate,bridgeMeet,adRemaining,modalKind,saveElapsed}=transient);renderUI()}return result}

window.T={state:()=>JSON.parse(JSON.stringify(s)),step,input:(kind,...args)=>{if(kind==='select')return select(...args);if(kind==='cell')return cellInput(...args);if(kind==='day')return nextDay();if(kind==='ad')return startAd();if(kind==='close')return closeModal();if(kind==='mail')return openMail();if(kind==='pass')return passModal();if(kind==='thanks'){const t=s.cells[key(...args)];if(t&&t.flag!==undefined){t.heart=1;metric('social','thanks','click');metric('social','thanks','complete');return true}}},load:()=>{s=fresh();beginLoop();walkers=[];syncWalkers();renderUI();return true},assets:()=>FILES.map(id=>({file:id+'.png',loaded:!!(images[id]&&images[id].naturalWidth)})),check,legal,options,connected,coreLoop:CORE_LOOP};
resize();syncWalkers();renderUI();metric('bm','pass','shown');if(params.has('from')){metric('social','invite','complete');showNotice('이웃의 초대로 작은 섬에 왔어요')}
Promise.all(FILES.map(id=>new Promise(resolve=>{const im=new Image();images[id]=im;im.onload=resolve;im.onerror=()=>{assetErrors.push(id+'.png');resolve()};im.src='art/sprites/'+id+'.png'}))).then(()=>{draw();if(params.has('stats'))showStats();if(checking)el('checkResult').textContent=JSON.stringify(check());function frame(ms){const dt=lastFrame?Math.min(.1,(ms-lastFrame)/1000):0;lastFrame=ms;if(!params.has('stats')){step(dt);draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)});
})();
</script></body></html>
