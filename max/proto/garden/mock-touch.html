<script>
(() => {

function reset(){scene='garden';energy=16;stars=0;completed=0;egg=false;autoGuided=false;guidePending=false;drag=null;cut=null;advertUntil=0;repaired=[];joined=[];particles=[];flights=[];notice='';items=Array(56).fill(null);covers={};

 const atlas=pics['face-grandpa'];if(key in faceSlots&&atlas&&atlas.width>atlas.height*2){ctx.drawImage(atlas,faceSlots[key]*atlas.width/5,0,atlas.width/5,atlas.height,x,y,w,h);return;}box(x,y,w,h,'#cec6d7',null,Math.min(w,h)*.35);}

function produce(n){if(scene!=='garden'||advertUntil>clock)return false;if(energy<=0){message('맥스에게 새참을 주세요');return false;}

 if(to==='max'){const gain=items[from]==='riceball'?5:items[from]==='lunchbox'?15:0;if(!gain){message('주먹밥이나 도시락을 주세요');return false;}items[from]=null;energy+=gain;reward(108,viewH-170,true);message('기운 +'+gain);return true;}

function join(who){if(scene!=='town'||joined.includes(who))return false;joined.push(who);orders.push(newOrder(who));reward(540,viewH*.5,true);cut={who,line:(who==='duck'?'오리':'토끼')+' 이웃이 합류했어요!',until:clock+1.6};return true;}
function action(id){if(advertUntil>clock)return;if(id==='debug'){stars+=3;reward(900,70);return;}if(id==='garden'){scene='garden';cut=null;}else if(id==='yard'){scene='yard';cut=null;}else if(id==='town'&&repaired.length===5){scene='town';cut=null;}else if(id==='ad'){advertUntil=clock+1;drag=null;}else if(id.startsWith('gen:'))produce(+id.split(':')[1]);else if(id.startsWith('fix:'))repair(+id.split(':')[1]);else if(id.startsWith('join:'))join(id.split(':')[1]);else if(id==='locked')message('아직 잠겨 있어요');}
function yardFrame(){const h=Math.min(viewH,1620);return{y:(viewH-h)/2,h,scale:h/1620};}
function yardPoint(x,y){const f=yardFrame();return{x,y:f.y+y*f.scale};}
function sceneImage(key){const pic=pics[key],f=yardFrame();if(pic)ctx.drawImage(pic,0,f.y,1080,f.h);else sprite(key,0,f.y,1080,f.h);}
function garden(){
 const current=fixes[fixes.findIndex((_,i)=>!repaired.includes(i))]||fixes[4];ctx.save();ctx.beginPath();ctx.roundRect(24,18,1032,145,32);ctx.clip();const pic=pics.yardscene;if(pic)ctx.drawImage(pic,0,500,1080,350,24,18,1032,145);ctx.fillStyle='#fff6dfbb';ctx.fillRect(24,18,1032,145);ctx.restore();sprite(current.icon,40,33,110,110);text(current.label,275,92,48);text('★ '+stars+'/3',638,92,58);button('debug','별+3',880,24,164,128);hits.push({id:'yard',x:24,y:18,w:820,h:145});

 const b=board(),rowH=b.h/8;box(24,b.y-10,1032,b.h+20,'#b58b5b','#a4794c',30);
 for(let i=0;i<56;i++){const p=point(i);sprite('cell',p.x-71,p.y-rowH/2+1,142,rowH-2);if(covers[i])sprite(covers[i],p.x-67,p.y-rowH/2+3,134,rowH-6);else if(items[i]&&drag?.idx!==i){const size=Math.min(122,rowH-10);sprite(items[i],p.x-size/2,p.y-size/2,size,size);}}
 const foot=viewH-295;box(22,foot,1036,277,'#ede2be','#b69a6b',35);const slots=[{x:25,key:'face-max',id:'max',title:'기운 '+energy},{x:230,key:'gen-seeds',id:'gen:0',title:'씨앗'},{x:430,key:'gen-tools',id:'gen:1',title:'공구'},{x:630,key:'gen-snack',id:'gen:2',title:'새참'}];
 for(let slotIndex=0;slotIndex<slots.length;slotIndex++){const s=slots[slotIndex];if(egg)s.x=16+slotIndex*178;ctx.save();if(energy===0&&s.id.startsWith('gen:'))ctx.globalAlpha=.4;sprite(s.key,s.x+15,foot+20,155,155);ctx.restore();text(s.title,s.x+94,foot+220,48);hits.push({id:s.id,x:s.x,y:foot+5,w:egg?174:190,h:260});}
 if(egg){box(736,foot+36,146,150,'#d8d1bb','#a99d82',34);text('🔒',809,foot+105,58);text('달걀',809,foot+220,48);hits.push({id:'locked',x:728,y:foot+5,w:170,h:260});}button('yard','마당',egg?900:844,foot+45,egg?156:190,150);
 if(energy===0)button('ad','기운 ▶',27,foot-130,202,128);
 if(drag){const i=hitCell(drag);if(i>=0){const p=point(i);box(p.x-69,p.y-rowH/2+4,138,rowH-8,'#fff7b044','#fff4a0',20);}sprite(items[drag.idx],drag.x-85,drag.y-135,170,170);}

function yard(){sceneImage('yardscene');const frame=yardFrame(),fixed=pics.yardfixed;

 for(let i=0;i<fixes.length;i++){if(repaired.includes(i))continue;const f=fixes[i],p=yardPoint(f.x,f.y);button('fix:'+i,'★ '+f.cost,p.x-96,p.y-64,192,128);box(p.x-110,p.y+76,220,72,'#fff6dfeb',null,25);text(f.label,p.x,p.y+112,48);}

}
function town(){sceneImage('townmap');button('garden','텃밭',26,24,180,128);button('yard','마당',230,24,180,128);button('debug','별+3',880,24,164,128);
 const neighbors=[{who:'duck',x:600,y:750},{who:'rabbit',x:670,y:405}];for(const n of neighbors){const p=yardPoint(n.x,n.y);box(p.x-96,p.y-83,192,166,'#fff4dbe8','#af8852',82);sprite('face-'+n.who,p.x-64,p.y-72,128,128);text(joined.includes(n.who)?'✓':'＋',p.x+65,p.y+48,52,'#528148');hits.push({id:'join:'+n.who,x:p.x-96,y:p.y-83,w:192,h:166});}

}
function render(){hits=[];ctx.clearRect(0,0,1080,viewH);ctx.save();if(shake>0)ctx.translate(Math.sin(clock*101)*5,Math.cos(clock*89)*4);if(scene==='garden')garden();else if(scene==='yard')yard();else town();ctx.restore();
 for(const f of flights){const t=Math.min(1,f.age/.8),x=f.x+(640-f.x)*t,y=f.y+(92-f.y)*t-Math.sin(t*Math.PI)*110;ctx.save();ctx.strokeStyle='#ffeaaa';ctx.shadowColor='#ffce39';ctx.shadowBlur=25;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(x-45*(1-t),y+75*(1-t));ctx.lineTo(x,y);ctx.stroke();text('★',x,y,90,'#ffcc38');ctx.restore();}

 if(cut){box(28,viewH-340,1024,310,'#fff6dfef','#b48b55',42);sprite('face-'+cut.who,90,viewH-324,160,160);sprite('face-max',270,viewH-324,160,160);text(cut.line,545,viewH-92,51);}

function step(dt){clock+=Math.max(0,dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);for(const f of flights)f.age+=dt;flights=flights.filter(f=>f.age<.9);

}
const position=e=>{const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*1080,y:(e.clientY-b.top)/b.height*viewH};};
let pressed=null;
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||advertUntil>clock||cut)return;e.preventDefault();const p=position(e);canvas.setPointerCapture(e.pointerId);pressed={...p,id:e.pointerId};const i=scene==='garden'?hitCell(p):-1;if(i>=0&&items[i]&&!covers[i])drag={idx:i,...p,id:e.pointerId};render();});
