if(flash){ctx.fillStyle=`rgba(255,245,179,${flash})`;ctx.fillRect(0,0,1080,geom.H);}if(game.card)drawCard();if(game.product&&!ad){ctx.fillStyle='rgba(255,247,222,.96)';ctx.fillRect(190,geom.H*.35,700,geom.H*.25);label(game.product,540,geom.H*.43,52);label('상품 창 · 탭해서 닫기',540,geom.H*.52,36);}if(game.notebook)drawNotebook();if(ad){ctx.fillStyle='rgba(255,247,222,.97)';ctx.fillRect(0,0,1080,geom.H);sprite('face-max',540,geom.H*.4,220);label('광고 보는 중',540,geom.H*.53,48);label(Math.ceil(ad.left),540,geom.H*.59,58);ring(540,geom.H*.4,155,ad.left/5);}drawTutorial();if(checkMode){ctx.fillStyle='#fff9df';ctx.fillRect(10,geom.H-42,450,38);label(checkResult?'CHECK '+(checkResult.ok?'✓':'!'):'CHECK',235,geom.H-23,35);}}
function knownItem(item){return item==='tool-handle'||item==='mat-wood'||(archive.made||[]).includes(item);}
// v5g: 본 단계(지금 든 것 포함)까지만, 다음 하나는 ? 실루엣, 그 뒤는 숨김.
function visibleLine(line,current){if(current==='tool-handle')return line;const last=line.reduce((n,item,i)=>knownItem(item)||item===current?i:n,-1);return line.slice(0,Math.min(line.length,last+2));}
function drawNotebook(){const book=game.notebook;if(!book)return;ctx.fillStyle='rgba(79,75,45,.38)';ctx.fillRect(0,0,1080,geom.H);creamRect({x:540,y:geom.H*.48,w:1020,h:400},'#fff8e8');const shown=visibleLine(book.line,book.item),span=900/shown.length;shown.forEach((item,i)=>{const x=90+span*(i+.5),y=geom.H*.48,known=knownItem(item)||item===book.item;if(i)label('→',x-span/2,y,35);ctx.save();if(!known)ctx.filter='brightness(0)';sprite(item,x,y,Math.min(95,span*.64));ctx.restore();if(!known)label('?',x,y+70,35);if(item===book.item)outline({x,y,w:span*.78,h:135},'#ed9845');});}
function state(){return copy({...game,features:FEATURES,visibleMaterials:visibleMaterials(),cleared:cleared(),clock:clockNow,ad,energyOffer,transition,max:maxPose,geometry:{...geom,orders:geom.orders.slice(0,game.orders.length),producers:producerRects(),buttons:buttonRects(),tabs:game.drawer?drawerTabs():[]},tutorialUI:game.tut?{visible:tutVisible(),guide:tutGuide(),boxes:tutGeometry()}:null,goal:goalState(),mergeUI:mergeUI(),drag,coreLoop,from:query.get('from'),assetReady:Object.values(assetInfo).every(a=>a.loaded)});}
function assets(){return copy({files:assetInfo,failed:Object.values(assetInfo).filter(a=>a.failed).length,pending:Object.values(assetInfo).filter(a=>!a.loaded&&!a.failed).length,silhouettes});}
let checkResult=null;
function solvability(){const totals={plank:0,grass:0,stone:0,wood:0};for(const c of game.cells)if(c.cover){const r=coverRules[c.cover];totals[r.mat]+=r.qty;}for(const k of Object.keys(totals))totals[k]+=game.materials[k];const costs={plank:9,grass:5,stone:7,wood:3};return{materials:totals,costs,repairs:Object.entries(costs).every(([k,n])=>totals[k]>=n),days:fixedOrders.map((orders,i)=>({day:i+1,solvable:orders.every(o=>chains.some(line=>line.includes(o[1]))),initiallySolved:false})),note:'재료 총량과 합치기 체인 검사. 실제 끌기·탭 경로는 tools/check.cjs에서 검증.'};}
function check(){const saved={game:copy(game),clockNow,fx:copy(fx),jobs:jobs.slice(),drag:drag&&copy(drag),maxPose:copy(maxPose),seed,geom:copy(geom),archive:copy(archive),ad:ad&&copy(ad),shake,flash,energyOffer,transition};inspecting=true;try{game.tut=null;loadDay(1);const initial=JSON.stringify(game.cells);for(let n=0;n<600;n++){if(n%7===0){const i=Math.floor(random()*63);input('tap',Math.floor(i/7),i%7);}step(.1);}const changed=initial!==JSON.stringify(game.cells)||game.maxCell!==0;loadDay(1);step(60);const idleCannotWin=game.stars===0&&cleared()===12,search=solvability(),a=assets();return{ok:errors.length===0&&a.failed===0&&a.pending===0&&silhouettes===0&&changed&&idleCannotWin&&search.repairs&&search.days.every(d=>d.solvable),seconds:60,errors:errors.slice(),assets:a,stateChanged:changed,idleCannotWin,search};}finally{game=saved.game;clockNow=saved.clockNow;fx=saved.fx;jobs=saved.jobs;drag=saved.drag;maxPose=saved.maxPose;seed=saved.seed;geom=saved.geom;archive=saved.archive;ad=saved.ad;shake=saved.shake;flash=saved.flash;energyOffer=saved.energyOffer;transition=saved.transition;inspecting=false;render();}}
window.T={state,step,input,load:n=>{loadDay(Math.max(1,Math.floor(n)||1));render();return state();},assets,check};
function discoveryStats(table){const list=archive.discoveries||[],took=list.filter(r=>r.dugAt!==undefined).map(r=>r.dugAt-r.shownAt-(r.blocked||0)).sort((a,b)=>a-b),pct=n=>list.length?Math.round(n/list.length*100)+'%':'—';return table(['기록','값'],[['보임',list.length],['손가락 없이 팜',pct(took.length)],['20초 안에 팜',pct(took.filter(v=>v<=20).length)],['걸린 시간 중앙값 초',took.length?took[Math.floor(took.length/2)].toFixed(1):'—'],['재촉 짖음 필요',pct(list.filter(r=>r.nudges>0).length)]]);}
function showStats(){const el=document.getElementById('stats');el.style.display='block';const table=(headers,rows)=>'<table><tr>'+headers.map(v=>'<th>'+v+'</th>').join('')+'</tr>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+String(v??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</td>').join('')+'</tr>').join('')+'</table>';const rate=r=>r.shown?Math.round(r.pressed/r.shown*100)+'%':'0%';el.innerHTML='<h2>텃밭 기록</h2>'+table(['경제','값'],Object.entries(archive.economy||game.economy))+table(['날짜','실제 초','의무 300초','자발 판수','입력','주문',...(FEATURES.pest?['지킴','도난']:[])],Object.entries(archive.dates).map(([d,r])=>[d,Math.round(r.active),r.active>=300?'완료':Math.round(r.active)+'/300',r.voluntary,r.inputs,r.orders,...(FEATURES.pest?[r.defended,r.stolen]:[])]))+'<h3>주문 루프</h3>'+table(['날짜','날/주문','물건','첫 입력 초','입력 수','시간 초','실패','중단'],archive.loops.map(r=>[r.date,r.day+'/'+r.order,r.item,r.firstInput===null?'—':r.firstInput.toFixed(2),r.inputs,r.duration.toFixed(2),r.failures,r.aborted?'예':'아니오']))+'<h3>BM</h3>'+table(['자리','제시','누름','수락률','완료'],['energy','snack','tools','bag',...(FEATURES.walk?['walk']:[])].map(key=>{const r=archive.bm[key]||{shown:0,pressed:0,completed:0};return[key,r.shown,r.pressed,rate(r),r.completed];}))+'<h3>서랍</h3>'+table(['서랍','열기','넣기','꺼내기'],Object.entries(archive.drawers).map(([key,r])=>[key,r.open,r.put,r.take]))+'<h3>발견 ① 킁킁</h3>'+discoveryStats(table)+'<h3>추가 기록</h3>'+table(['기록','횟수'],Object.entries(archive.features).filter(([k])=>k==='sniffs'||({walks:FEATURES.walk,toys:FEATURES.walk,gifts:FEATURES.share,thanks:FEATURES.share,excited:FEATURES.excite,fertileFound:FEATURES.fertile,fertileGrown:FEATURES.fertile})[k]).map(([k,n])=>[({walks:'산책 횟수',toys:'장난감',gifts:'나눠 주기',thanks:'답례',sniffs:'킁킁 파기',excited:'신남',fertileFound:'기름진 칸 발견',fertileGrown:'기름진 칸 성장'})[k]||k,n]));}
function pointerXY(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*1080/r.width,(e.clientY-r.top)*geom.H/r.height];}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(drag)return;canvas.setPointerCapture(e.pointerId);down(...pointerXY(e),e.pointerId);});canvas.addEventListener('pointermove',e=>{e.preventDefault();move(...pointerXY(e),e.pointerId);});canvas.addEventListener('pointerup',e=>{e.preventDefault();up(...pointerXY(e),e.pointerId);});canvas.addEventListener('pointercancel',()=>{drag=null;});canvas.addEventListener('lostpointercapture',()=>{drag=null;});canvas.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{lastFrame=0;drag=null;if(document.hidden)save();});window.addEventListener('pagehide',()=>{game.orders.forEach(o=>finishLoop(o,true));save();});
resize();loadDay(1);if(query.get('tut')==='0'&&!query.has('scene')&&!statsMode&&!checkMode)restoreBoard();if(query.get('tut')!=='0'&&!statsMode&&!query.has('scene')){const resumeDay=tutRecord.day,requested=Number(query.get('step'));tutStart(Number.isInteger(requested)&&requested>=1&&requested<=9?requested:tutRecord.step);if(!query.has('step')&&resumeDay>=2){loadDay(resumeDay,false);}if(game.tut.step===9&&!query.has('step')&&!checkMode)restoreBoard();resize();}booting=false;
// 확인용 바로가기 ?scene=coop|well|day|chapter (기록은 ?check 와 같이 쓸 것)
{const scene=query.get('scene'),open=j=>{const c=game.cells[j];if(c.cover){c.tilledAt=clockNow-.2;c.flower=game.cells.filter(v=>v.tilledAt!==undefined).length%3===0;}c.cover=null;c.hp=0;};if(scene==='coop'||scene==='well'){game.cells.forEach((c,j)=>{if(scene==='well'||j%7<4&&j<49)open(j);});game.materials={plank:6,grass:3,stone:6,wood:3};[...game.sites,...game.smallSites].forEach(st=>{if(st.cells.every(j=>!game.cells[j].cover)){st.revealed=true;st.revealOrder=++game.revealSerial;}});}if(scene==='day')after(1,()=>showCard('day'));if(scene==='chapter')after(1,()=>{game.chapter=true;showCard('chapter');});}
if(!game.tut&&!checkMode&&!statsMode&&archive.gift!==dateKey()){archive.gift=dateKey();put('riceball',0);seedFertile();save();}
if(statsMode)showStats();let lastFrame=0;
function frame(ms){if(!document.hidden&&!statsMode){if(lastFrame)simulate(Math.min(.05,(ms-lastFrame)/1000));render();}lastFrame=ms;requestAnimationFrame(frame);}requestAnimationFrame(frame);
if(checkMode){const pending=setInterval(()=>{if(Object.values(assetInfo).every(a=>a.loaded||a.failed)){clearInterval(pending);checkResult=check();render();}},100);}
})();
