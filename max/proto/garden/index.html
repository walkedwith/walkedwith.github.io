{const scene=query.get('scene'),open=j=>{game.cells[j].cover=null;game.cells[j].hp=0;};if(scene==='coop'||scene==='well'){game.cells.forEach((c,j)=>{if(scene==='well'||j%7<4&&j<49)open(j);});game.materials={plank:6,grass:3,stone:6,wood:3};game.sites.forEach(st=>{if(st.cells.every(j=>!game.cells[j].cover))st.revealed=true;});}if(scene==='day')after(1,()=>showCard('day'));if(scene==='chapter')after(1,()=>{game.chapter=true;showCard('chapter');});}
