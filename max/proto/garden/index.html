function dateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

const fixedOrders=[[[0,'sprout',2,'riceball'],[1,'nail',1,'rice'],[0,'carrot',1,'riceball'],[1,'riceball',1,'seed-carrot']],[[0,'seedling',2,'lunchbox'],[2,'hinge',1,'riceball'],[0,'carrot-bunch',1,'riceball'],[2,'carrot',2,'seed-carrot']],[[0,'hoe',1,'lunchbox'],[3,'carrot-bunch',1,'riceball'],[0,'basket-carrot',1,'lunchbox'],[3,'lunchbox',1,'hinge']]];

let seed=0x9756321;function random(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296;}
let game,clockNow=0,drag=null,fx=[],jobs=[],shake=0,flash=0,ad=null,visit=null,energyOffer=0,fullFade=0,transition=0;
let geom={H:2340,safeT:0,safeB:0,scale:1080/941,bx:0,by:0,cw:120,cells:[],panelY:0,orders:[]},maxPose={x:140,y:0,kind:'stand',until:0},audioCtx=null;

function sound(kind){if(inspecting)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const notes={merge:[440,660],clear:[330,550,880],order:[523,659,784],day:[523,659,784,1047],dig:[130,85],bark:[170,210],eat:[550,730],bounce:[150]}[kind]||[440];notes.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime+i*.075;osc.type=kind==='dig'||kind==='bark'?'triangle':'sine';osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.09,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+.15);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.17);});}catch(_){}}
function burst(x,y,kind='merge'){shake=kind==='day'?13:6;flash=Math.max(flash,kind==='day'?.35:.12);sound(kind);for(let i=0;i<(kind==='day'?70:22);i++){const angle=random()*Math.PI*2,speed=90+random()*280;fx.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-90,life:.6+random()*.6,total:1.2,color:['#ffec99','#d1e697','#fff9d9','#caa67c'][i%4],size:5+random()*9});}fx.push({x,y,life:.55,total:.55,ring:true});}

function cleared(){return game.cells.filter(c=>!c.hp).length;}
function newOrder(){let def;if(game.day<=3)def=fixedOrders[game.day-1][game.orderCursor++%4];else{const family=Math.floor(random()*3),line=chains[family];const highest=Math.max(0,...game.cells.filter(c=>c.item&&line.includes(c.item)).map(c=>line.indexOf(c.item)));def=[Math.floor(random()*4),line[Math.max(0,Math.min(line.length-1,highest+Math.floor(random()*3)-1))],1+Math.floor(random()*2),'riceball'];game.orderCursor++;}return{face:def[0],item:def[1],left:def[2],reward:def[3],loop:{day:game.day,order:game.orderCursor,item:def[1],start:game.playTime,first:null,inputs:0,failures:0,voluntary:false},delivering:false};}
function finishLoop(order,aborted){if(!order||!order.loop)return;const row={...order.loop,firstInput:order.loop.first===null?null:order.loop.first-order.loop.start,duration:game.playTime-order.loop.start,aborted,date:dateKey()};if(!checkMode&&!inspecting&&!statsMode){archive.loops.push(row);save();}}
function showDailySlots(){metric('bm','shovel','shown');metric('bm','basket','shown');}
function loadDay(n=1,reset=true){if(game)game.orders.forEach(o=>finishLoop(o,true));if(reset){const rows=['M...bbp','....bkb','..Mbbtb','.bbpkbb','bbkbbpb','pbbtbkb','bkbbpbb','bbtbbbk'];game={day:n,stars:0,energy:20,regen:0,cells:rows.join('').split('').map(ch=>({cover:ch==='b'?'bush':ch==='p'?'plank':ch==='k'?'rocks':ch==='t'?'stump':null,hp:ch==='k'?2:ch==='t'?3:'bp'.includes(ch)?1:0,mound:ch==='M'?{uses:0,cool:0}:null,item:null,bump:0})),playTime:0,orders:[],orderCursor:0,totalOrders:0,thirdMound:false,pest:null,pestIn:45+random()*30,defended:0,stolen:0,chapter:false};game.cells[1].item='seed-carrot';game.cells[7].item='rice';game.cells[9].item='nail-rusty';}else{game.day=n;game.stars=0;game.energy=20;game.regen=0;game.orderCursor=0;game.cells.forEach(c=>{if(c.mound)c.mound={uses:0,cool:0};});}

function point(i){return geom.cells[i]||{x:140,y:700,w:120,h:120};}
function emptyNear(i){const originCell=point(i);let best=-1,dist=Infinity;game.cells.forEach((c,j)=>{if(!c.hp&&!c.mound&&!c.item){const p=point(j),d=(p.x-originCell.x)**2+(p.y-originCell.y)**2;if(d<dist){dist=d;best=j;}}});return best;}
function put(item,from){const dest=emptyNear(from);if(dest<0)return false;game.cells[dest].item=item;game.cells[dest].bump=.4;const p=point(dest);fx.push({x:point(from).x,y:point(from).y,toX:p.x,toY:p.y,life:.45,total:.45,item});return true;}
function registerInput(){for(const order of game.orders){if(order.delivering)continue;order.loop.inputs++;if(order.loop.first===null)order.loop.first=game.playTime;}if(!checkMode&&!inspecting&&!statsMode){const d=daily();d.inputs++;if(d.active>=300&&!game.voluntary){game.voluntary=true;d.voluntary++;}save();}}
function fail(i){if(i>=0)game.cells[i].bump=.4;for(const order of game.orders)if(!order.delivering)order.loop.failures++;shake=3;sound('bounce');}
function openCover(i){const c=game.cells[i];if(!c.hp)return;c.hp=0;c.cover=null;c.bump=.4;const p=point(i);burst(p.x,p.y,'clear');if(cleared()>=30&&!game.thirdMound){game.thirdMound=true;const j=!game.cells[31].hp&&!game.cells[31].item&&!game.cells[31].mound?31:emptyNear(31);if(j>=0)game.cells[j].mound={uses:0,cool:0};else game.thirdMound=false;}if(cleared()===56&&!game.chapter){game.chapter=true;transition=1.5;fullFade=1.5;burst(540,geom.H*.5,'day');after(1.5,()=>showCard('chapter'));}}
function hitNeighbors(i){for(const j of [i%7?i-1:-1,i%7<6?i+1:-1,i-7,i+7])if(j>=0&&j<56&&game.cells[j].hp){const c=game.cells[j];c.bump=.35;if(c.hp===1)openCover(j);else{c.hp--;const p=point(j);burst(p.x,p.y,'merge');}}}
function dig(i){const c=game.cells[i];if(!c.mound||c.mound.cool>0||transition>0)return fail(i);const dest=emptyNear(i);if(dest<0)return fail(i);if(game.energy<1){energyOffer=2;metric('bm','energy','shown');return fail(i);}game.energy--;c.mound.uses++;if(c.mound.uses>=8)c.mound.cool=40;const roll=random(),item=roll<.45?'seed-carrot':roll<.75?'rice':'nail-rusty',p=point(i);pose('dig',p.x,p.y,.65);sound('dig');transition=.4;after(.4,()=>{if(!put(item,i)){game.energy++;c.mound.uses--;c.mound.cool=0;}else burst(p.x,p.y,'dig');});}
function feed(i){const c=game.cells[i];if(c.item!=='riceball'&&c.item!=='lunchbox')return fail(i);game.energy=Math.min(40,game.energy+(c.item==='riceball'?5:15));c.item=null;pose('eat',maxPose.x,maxPose.y,.8);burst(maxPose.x,maxPose.y,'eat');}
function deliver(i,row){const c=game.cells[i],order=game.orders[row];if(!order||order.delivering||c.item!==order.item)return fail(i);c.item=null;order.left--;burst(geom.orders[row].x,geom.orders[row].y,'merge');if(order.left)return;order.delivering=true;finishLoop(order,false);transition=1.25;const p=geom.orders[row];pose('carry',p.x,p.y+.2*geom.cw,1.2);burst(p.x,p.y,'order');after(1.2,()=>{game.stars++;game.totalOrders++;if(!checkMode&&!inspecting){daily().orders++;save();}put(order.reward,i);fx.push({x:p.x,y:p.y,toX:250,toY:geom.safeT+90,life:.6,total:.6,item:'ui-star'});if(game.stars>=3){game.orders=game.orders.filter(o=>o!==order);game.orders.forEach(o=>finishLoop(o,true));game.orders=[];after(.65,()=>showCard('day'));transition=.7;}else game.orders[row]=newOrder();});}
function mergeOrMove(i,j){if(i===j)return;const src=game.cells[i],dst=game.cells[j];if(!src.item||dst.hp||dst.mound)return fail(i);const line=chains.find(a=>a.includes(src.item)),level=line.indexOf(src.item);if(src.item===dst.item&&level<line.length-1){dst.item=line[level+1];src.item=null;dst.bump=.35;const p=point(j);burst(p.x,p.y,'merge');hitNeighbors(j);}else{[src.item,dst.item]=[dst.item,src.item];dst.bump=.25;}}

function startAd(slot){if(ad||transition>0||game.card)return;if(slot==='shovel'&&!game.shovels||slot==='basket'&&!game.baskets)return fail(-1);if(slot==='energy'&&game.energy>0)return;metric('bm',slot,'pressed');ad={slot,left:5};drag=null;}
function adDone(){const slot=ad.slot;ad=null;metric('bm',slot,'completed');if(slot==='energy'){game.energy+=20;energyOffer=0;pose('eat',maxPose.x,maxPose.y,.8);}else if(slot==='shovel'){game.shovels--;game.shovelArmed=true;}else{if(put('basket-carrot',55))game.baskets--;else{game.pendingBasket=(game.pendingBasket||0)+1;game.baskets--;}}burst(540,geom.panelY,'eat');}
function spawnPest(){const targets=game.cells.map((c,i)=>({c,i})).filter(v=>chains[0].indexOf(v.c.item)>=3);if(!targets.length)return;targets.sort((a,b)=>Math.min(a.i%7,6-a.i%7)-Math.min(b.i%7,6-b.i%7));const target=targets[0].i,p=point(target),raccoon=game.day>=2&&random()>=.7;game.pest={target,kind:raccoon?'raccoon':'crow',left:raccoon?4:3,total:raccoon?4:3,fromX:p.x<540?geom.bx+15:1080-geom.bx-15,y:p.y,flee:0};}

function simulate(dt){dt=Math.max(0,Number(dt)||0);clockNow+=dt;shake=Math.max(0,shake-dt*24);flash=Math.max(0,flash-dt);energyOffer=Math.max(0,energyOffer-dt);fullFade=Math.max(0,fullFade-dt);for(const c of game.cells)c.bump=Math.max(0,c.bump-dt);for(const f of fx){f.life-=dt;if(!f.toX&&!f.ring){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;}}fx=fx.filter(f=>f.life>0);if(maxPose.until<clockNow&&maxPose.kind!=='stand')pose('stand',point(0).x,point(0).y,99999);

function step(dt){let remaining=Math.min(3600,Math.max(0,dt));while(remaining>0){const part=Math.min(.05,remaining);simulate(part);remaining-=part;}render();return state();}
function rectHit(x,y,r){return x>=r.x-r.w/2&&x<=r.x+r.w/2&&y>=r.y-r.h/2&&y<=r.y+r.h/2;}

canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(drag)return;canvas.setPointerCapture(e.pointerId);down(...pointerXY(e),e.pointerId);});canvas.addEventListener('pointermove',e=>{e.preventDefault();move(...pointerXY(e),e.pointerId);});canvas.addEventListener('pointerup',e=>{e.preventDefault();up(...pointerXY(e),e.pointerId);});canvas.addEventListener('pointercancel',()=>{drag=null;});canvas.addEventListener('lostpointercapture',()=>{drag=null;});canvas.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{lastFrame=0;drag=null;if(document.hidden)save();});window.addEventListener('pagehide',()=>{game.orders.forEach(o=>finishLoop(o,true));save();});
resize();loadDay(1);if(!checkMode&&!statsMode&&archive.gift!==dateKey()){archive.gift=dateKey();put('riceball',0);save();}
if(query.has('from')&&!checkMode&&!statsMode){metric('social','invite-arrival','shown');metric('social','invite-arrival','completed');}
if(statsMode)showStats();let lastFrame=0;
function frame(ms){if(!document.hidden&&!statsMode){if(lastFrame)simulate(Math.min(.05,(ms-lastFrame)/1000));render();}lastFrame=ms;requestAnimationFrame(frame);}requestAnimationFrame(frame);
if(checkMode){const pending=setInterval(()=>{if(Object.values(assetInfo).every(a=>a.loaded||a.failed)){clearInterval(pending);checkResult=check();render();}},100);}
})();
</script></body></html>
