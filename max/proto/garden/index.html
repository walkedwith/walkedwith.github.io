function render(){if(!game||!canvas.width)return;ctx.setTransform(canvas.width/1080,0,0,canvas.height/geom.H,0,0);ctx.fillStyle='#82d849';ctx.fillRect(0,0,1080,geom.H);ctx.save();ctx.translate(Math.sin(clockNow*73)*shake,Math.cos(clockNow*67)*shake*.6);const s=geom.scale,bw=941*s,bh=1672*s;ctx.fillStyle='#cfe6f0';ctx.fillRect(geom.bx,0,bw,geom.H);imageAt('top-strip',540,geom.by+120-700*s/2,bw,700*s);/* Fade the overlap rather than drawing a hard seam. */ctx.save();const gradient=ctx.createLinearGradient(0,geom.by,0,geom.by+120);gradient.addColorStop(0,'rgba(239,223,191,0)');gradient.addColorStop(1,'rgba(239,223,191,1)');ctx.fillStyle=gradient;ctx.fillRect(geom.bx,geom.by,bw,120);ctx.restore();if(assetInfo['board-base'].loaded){const pic=pictures['board-base'],blend=120;ctx.drawImage(pic,0,blend/s,941,1672-blend/s,geom.bx,geom.by+blend,bw,bh-blend);for(let dy=0;dy<blend;dy+=2){ctx.globalAlpha=dy/blend;ctx.drawImage(pic,0,dy/s,941,2/s,geom.bx,geom.by+dy,bw,2);}ctx.globalAlpha=1;}else imageAt('board-base',540,geom.by+bh/2,bw,bh);
for(let i=0;i<56;i++){const c=game.cells[i],p=point(i),jig=c.bump?Math.sin(c.bump*60)*6:0;if(c.cover){imageAt('tile-wild',p.x,p.y,p.w,p.h);sprite(`cover-${c.cover}`,p.x+jig,p.y,p.w*.95);}if(c.mound){const t=game.digJuice?.cell===i?clockNow-game.digJuice.start:99,scaleY=t>=.08&&t<.20?.8:t>=.20&&t<.32?1.1:t>=.32&&t<.45?1.1-(t-.32)/.13*.1:1;ctx.save();ctx.translate(p.x+jig,p.y);ctx.scale(1,scaleY);sprite(c.mound.cool?'mound-dug':'mound',0,0,p.w*.8);ctx.restore();if(c.mound.cool)ring(p.x,p.y,p.w*.3,1-c.mound.cool/40);}if(c.sniff){sprite('sniff-mark',p.x,p.y,p.w*.7);ring(p.x,p.y,p.w*.34,1-c.sniff.left/c.sniff.total,'#ecd192');}if(c.item&&!(c.flightUntil>clockNow)&&!(drag&&drag.moved&&!drag.drawer&&drag.src===i)){const hintBounce=game.hint?.until>clockNow&&game.hint.cells.includes(i)?Math.abs(Math.sin((game.hint.until-clockNow)*12))*p.h*.12:0,bump=1+(c.bump?Math.sin(c.bump*15)*.13:0);const land=clockNow-(c.landAt??-99),squash=land<.1?.8+land*2:1;ctx.save();ctx.translate(p.x+jig,p.y-hintBounce);ctx.scale(1,squash);sprite(c.item,0,0,p.w*.72*bump);ctx.restore();if(orderItem(c.item))sprite('ui-check',p.x+p.w*.34,p.y-p.h*.34,geom.cw*.28);}}

const gp=game.grandpa;if(gp.job?.tool&&!gp.job.fromDrawer&&['enter','walk'].includes(gp.phase)){const drop=point(gp.job.drop);sprite(gp.job.tool,drop.x,drop.y,geom.cw*.72);}for(const queued of gp.queue)if(queued.tool&&!queued.fromDrawer){const drop=point(queued.drop);sprite(queued.tool,drop.x,drop.y,geom.cw*.72);}const gpHome=grandpaHome();let gpPos=gp.phase==='home'?gpHome:actorPoint(gp.cell,gp.path,gp.elapsed,.25);if(['enter','exit'].includes(gp.phase)){const p=point(gp.cell),t=Math.min(1,gp.elapsed/.25),mix=gp.phase==='enter'?t:1-t;gpPos={x:gpHome.x+(p.x-gpHome.x)*mix,y:gpHome.y+(p.y-gpHome.y)*mix-Math.sin(t*Math.PI)*geom.cw*.06};}if(gp.phase!=='home')drawActor(gp.phase==='home'?'grandpa':'grandpa-'+(['enter','walk','return','exit'].includes(gp.phase)?'walk':gp.phase),gpPos.x,gpPos.y-geom.orders[0].body.h/2,geom.orders[0].body.h,gp.flip);if(gp.job&&(['lift','swing'].includes(gp.phase)||gp.job.fromDrawer&&['enter','walk'].includes(gp.phase)))sprite(gp.job.tool||'hammer',gpPos.x,gpPos.y-geom.cw*1.6,geom.cw*.5);

const motion=game.motion;if(gp.path?.length&&['walk','return'].includes(gp.phase)){const next=gp.path[0];if(next%7!==gp.cell%7)gp.flip=next%7<gp.cell%7;}const dog={...dogPoint()},dogX=dog.x,dogY=dog.y;let dogKind=maxPose.kind,flip=false;
if(motion?.path.length){const dest=point(motion.path[0]),here=point(game.maxCell),dx=dest.x-here.x,dy=dest.y-here.y;const direction=Math.abs(dx)>Math.abs(dy)?'side':dy<0?'up':'down';flip=direction==='side'&&dx<0;dogKind=direction+(Math.floor(clockNow/.15)%2+1);}
const actionTravel=maxPose.kind==='carry'&&!motion;if(actionTravel){const t=Math.min(1,(clockNow-maxPose.start)/.22);dog.x+=(maxPose.x-dog.x)*t;dog.y+=(maxPose.y-dog.y)*t;}
if(game.walk){const w=game.walk,t=w.phase==='exit'?w.elapsed/.4:w.phase==='enter'?1-w.elapsed/.4:0;if(['exit','enter'].includes(w.phase)){dog.y+=(geom.H+geom.cw-dog.y)*Math.min(1,t);dogKind=(w.phase==='exit'?'down':'up')+(Math.floor(clockNow/.15)%2+1);}}
if(game.excitement.until>clockNow&&game.walk?.phase!=='away'){if(motion&&Math.floor(clockNow*4)%3===0)dogKind='happy';dog.y-=Math.abs(Math.sin(clockNow*8))*geom.cw*.09;for(let n=0;n<5;n++){const a=clockNow*2+n*Math.PI*2/5;sprite('ui-star',dog.x+Math.cos(a)*geom.cw*.65,dog.y+Math.sin(a)*geom.cw*.45,geom.cw*.15);}}

const digAge=game.digJuice?clockNow-game.digJuice.start:99;ctx.save();ctx.translate(dog.x,dog.y);if(digAge<.08)ctx.scale(1,1-.12*Math.min(1,digAge/.08));if(game.walk?.phase!=='away')drawActor('max-'+dogKind,0,-geom.cw*.30,geom.cw*1.25,flip);ctx.restore();
if(game.bubble&&game.bubble.until>clockNow){const b=game.bubble,p=point(b.target),cost=Object.entries(b.cost||{});ctx.fillStyle='#fff8e8';ctx.beginPath();ctx.roundRect(p.x-125,p.y-geom.cw*1.5,250,92,20);ctx.fill();if(b.tool)sprite(b.tool,p.x,p.y-geom.cw*1.5+46,72);cost.forEach(([k,n],i)=>{sprite('mat-'+k,p.x-75+i*120,p.y-geom.cw*1.5+46,52);label(n,p.x-30+i*120,p.y-geom.cw*1.5+46,35);});}
if(maxPose.kind==='bark'){for(let i=0;i<3;i++){ctx.strokeStyle='#fff0ad';ctx.lineWidth=6;ctx.beginPath();ctx.arc(dogX+geom.cw*.45,dogY-25,30+i*22,-.8,.8);ctx.stroke();}}
if(game.pest){const p=pestPoint(),flee=game.pest.flee;const offset=flee?(1-flee/.85)*(p.x<540?-220:220):0;sprite('pest-'+game.pest.kind+(flee?'-flee':''),p.x+offset,p.y,geom.cw*.8);if(!flee){sprite('ui-alert',p.x,p.y-geom.cw*.6,55);ring(p.x,p.y,geom.cw*.55,game.pest.left/game.pest.total);}}
for(const f of fx){ctx.save();ctx.globalAlpha=f.digFlight?1:Math.min(1,f.life*2);if(f.item){const t=1-f.life/f.total;sprite(f.item,f.x+(f.toX-f.x)*t,f.y+(f.toY-f.y)*t-(f.digFlight?4*t*(1-t)*geom.cw*1.2:Math.sin(t*Math.PI)*100),geom.cw*.72*(f.digFlight?1.15:1));}else if(f.text){/* HUD ticks draw above the panel. */}else if(f.ring){ctx.strokeStyle='#fff7b7';ctx.lineWidth=8*f.life/f.total;ctx.beginPath();ctx.arc(f.x,f.y,10+(1-f.life/f.total)*100,0,Math.PI*2);ctx.stroke();}else{ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(f.x,f.y,f.size,0,Math.PI*2);ctx.fill();}ctx.restore();}ctx.restore();drawHUD();for(const f of fx)if(f.text){ctx.save();ctx.globalAlpha=Math.min(1,f.life*2);label(f.text,f.x,f.y,f.size,f.color);ctx.restore();}if(drag?.moved&&drag.item)sprite(drag.item,drag.x,drag.y,geom.cw*.85,.9);

function drawNotebook(){const book=game.notebook;if(!book)return;ctx.fillStyle='rgba(79,75,45,.38)';ctx.fillRect(0,0,1080,geom.H);creamRect({x:540,y:geom.H*.48,w:1020,h:400},'#fff8e8');const span=900/book.line.length;book.line.forEach((item,i)=>{const x=90+span*(i+.5),y=geom.H*.48,known=(archive.made||[]).includes(item);if(i)label('→',x-span/2,y,35);ctx.save();if(!known)ctx.filter='brightness(0)';sprite(item,x,y,Math.min(95,span*.64));ctx.restore();if(!known)label('?',x,y+70,35);if(item===book.item)outline({x,y,w:span*.78,h:135},'#ed9845');});}
function state(){return copy({...game,cleared:cleared(),clock:clockNow,ad,energyOffer,transition,max:maxPose,geometry:geom,goal:goalState(),drag,coreLoop,from:query.get('from'),assetReady:Object.values(assetInfo).every(a=>a.loaded)});}

function solvability(){const totals={plank:0,grass:0,stone:0,wood:0};for(const c of game.cells)if(c.cover){const r=coverRules[c.cover];totals[r.mat]+=r.qty;}for(const k of Object.keys(totals))totals[k]+=game.materials[k];const costs={plank:6,grass:3,stone:6,wood:3};return{materials:totals,costs,repairs:Object.entries(costs).every(([k,n])=>totals[k]>=n),days:fixedOrders.map((orders,i)=>({day:i+1,solvable:orders.every(o=>chains.some(line=>line.includes(o[1]))),initiallySolved:false})),note:'재료 총량과 합치기 체인 검사. 실제 끌기·탭 경로는 tools/check.cjs에서 검증.'};}
function check(){const saved={game:copy(game),clockNow,fx:copy(fx),jobs:jobs.slice(),drag:drag&&copy(drag),maxPose:copy(maxPose),seed,archive:copy(archive),ad:ad&&copy(ad),visit:visit&&copy(visit),shake,flash,energyOffer,transition};inspecting=true;try{loadDay(1);const initial=JSON.stringify(game.cells);for(let n=0;n<600;n++){if(n%7===0){const i=Math.floor(random()*56);input('tap',Math.floor(i/7),i%7);}step(.1);}const changed=initial!==JSON.stringify(game.cells)||game.maxCell!==0;loadDay(1);step(60);const idleCannotWin=game.stars===0&&cleared()===12,search=solvability(),a=assets();return{ok:errors.length===0&&a.failed===0&&a.pending===0&&silhouettes===0&&changed&&idleCannotWin&&search.repairs&&search.days.every(d=>d.solvable),seconds:60,errors:errors.slice(),assets:a,stateChanged:changed,idleCannotWin,search};}finally{game=saved.game;clockNow=saved.clockNow;fx=saved.fx;jobs=saved.jobs;drag=saved.drag;maxPose=saved.maxPose;seed=saved.seed;archive=saved.archive;ad=saved.ad;visit=saved.visit;shake=saved.shake;flash=saved.flash;energyOffer=saved.energyOffer;transition=saved.transition;inspecting=false;render();}}
window.T={state,step,input,load:n=>{loadDay(Math.max(1,Math.floor(n)||1));render();return state();},assets,check};
function showStats(){const el=document.getElementById('stats');el.style.display='block';const table=(headers,rows)=>'<table><tr>'+headers.map(v=>'<th>'+v+'</th>').join('')+'</tr>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+String(v??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</td>').join('')+'</tr>').join('')+'</table>';const rate=r=>r.shown?Math.round(r.pressed/r.shown*100)+'%':'0%';el.innerHTML='<h2>텃밭 기록</h2>'+table(['날짜','실제 초','의무 300초','자발 판수','입력','주문','지킴','도난'],Object.entries(archive.dates).map(([d,r])=>[d,Math.round(r.active),r.active>=300?'완료':Math.round(r.active)+'/300',r.voluntary,r.inputs,r.orders,r.defended,r.stolen]))+'<h3>주문 루프</h3>'+table(['날짜','날/주문','물건','첫 입력 초','입력 수','시간 초','실패','중단'],archive.loops.map(r=>[r.date,r.day+'/'+r.order,r.item,r.firstInput===null?'—':r.firstInput.toFixed(2),r.inputs,r.duration.toFixed(2),r.failures,r.aborted?'예':'아니오']))+'<h3>BM</h3>'+table(['자리','제시','누름','수락률','완료'],['energy','snack','tools','bag','walk'].map(key=>{const r=archive.bm[key]||{shown:0,pressed:0,completed:0};return[key,r.shown,r.pressed,rate(r),r.completed];}))+'<h3>소셜</h3>'+table(['자리','제시','누름','완료'],Object.entries(archive.social).map(([key,r])=>[key,r.shown,r.pressed,r.completed]))+'<h3>서랍</h3>'+table(['서랍','열기','넣기','꺼내기'],Object.entries(archive.drawers).map(([key,r])=>[key,r.open,r.put,r.take]))+'<h3>우리식 넷</h3>'+table(['기록','횟수'],Object.entries(archive.features).map(([k,n])=>[({walks:'산책 횟수',toys:'장난감',gifts:'나눠 주기',thanks:'답례',sniffs:'킁킁 파기',excited:'신남'})[k]||k,n]));}
