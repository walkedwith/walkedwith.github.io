<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>맥스와 동네 친구들 · 뒷마당</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#536e39;font-family:ui-rounded,"Apple SD Gothic Neo",sans-serif;color:#675036}#game{position:relative;margin:auto;width:min(100%,650px);height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 48% 42%,#d4df88,#a5bd64 65%,#76914a)}canvas{position:absolute;inset:0;width:100%;height:100%}header{position:absolute;z-index:2;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 17px);display:flex;justify-content:space-between;align-items:center;gap:12px} .goal{display:flex;align-items:center;gap:9px;background:#fff2d6;border:2px solid #fff9e9;border-radius:30px;padding:6px 16px 6px 7px;box-shadow:0 4px 0 #75532c35;font-weight:800;font-size:15px}.goal img{width:34px;height:34px;object-fit:contain}button{font:inherit;color:inherit;cursor:pointer;border:2px solid #fff5dc;background:linear-gradient(#fff5de,#e7cfa1);box-shadow:0 4px 0 #6e4c3338}#again{border-radius:21px;min-width:64px;min-height:44px;font-size:14px;font-weight:800}footer{position:absolute;z-index:2;bottom:calc(env(safe-area-inset-bottom,0px) + 19px);left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:12px}.caption{font-size:13px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px #fff9;color:#4e6134}.party{display:flex;gap:clamp(10px,3vw,22px);justify-content:center;width:100%}.friend{position:relative;display:flex;align-items:center;flex-direction:column;border:0;background:none;box-shadow:none;padding:0;min-width:60px;width:20%;max-width:106px;gap:7px;font-size:12px;font-weight:800}.portrait{display:flex;justify-content:center;align-items:center;position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:3px solid #fff4d9;background:radial-gradient(circle at 45% 28%,#fff9e7,#dfbf8d);box-shadow:0 5px 0 #71502e4d;transition:box-shadow .15s,transform .15s}.portrait img{width:80%;height:89%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 1px #6e51202a)}.friend[aria-pressed=true] .portrait{border-color:#efffff;box-shadow:0 0 0 3px #5ecfc2,0 0 22px #a4fff0,0 5px 0 #507b51;transform:translateY(-4px)}.friend[aria-pressed=true] .portrait:before{content:'◆';position:absolute;top:-15px;color:#fff4b5;font-size:16px;text-shadow:0 2px 2px #806329}.label{white-space:nowrap;color:#465831;text-shadow:0 1px #f8f3d4}.friend:active .portrait,#again:active{transform:translateY(2px)}@media(max-height:580px){footer{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);gap:6px}.friend{max-width:65px}header{top:calc(env(safe-area-inset-top,0px) + 8px)}}
</style>
</head>
<body><main id="game"><canvas id="yard" aria-label="7열 9행 뒷마당 미로. 칸을 누르면 한 칸 이동합니다."></canvas><header><div class="goal"><img src="art/sprites/ball.png" alt="공"><span id="goal-copy">공을 찾아요</span></div><button id="again" type="button">다시</button></header><footer><div class="caption">칸을 톡 · 친구를 바꿔 앞장서요</div><nav class="party" aria-label="앞장설 친구"><button class="friend" data-friend="max" aria-label="맥스, 울타리 파기" aria-pressed="true"><span class="portrait"><img src="art/sprites/max.png" alt="맥스"></span><span class="label">맥스 · 파기</span></button><button class="friend" data-friend="chick" aria-label="꼬꼬, 화단 넘기" aria-pressed="false"><span class="portrait"><img src="art/sprites/chick.png" alt="꼬꼬"></span><span class="label">꼬꼬 · 넘기</span></button><button class="friend" data-friend="duck" aria-label="오리, 물 헤엄" aria-pressed="false"><span class="portrait"><img src="art/sprites/duck.png" alt="오리"></span><span class="label">오리 · 헤엄</span></button><button class="friend" data-friend="frog" aria-label="개구리, 연잎 뛰기" aria-pressed="false"><span class="portrait"><img src="art/sprites/frog.png" alt="개구리"></span><span class="label">개구리 · 연잎</span></button></nav></footer></main>
<script>
(() => {
'use strict';
const canvas=document.querySelector('#yard'), ctx=canvas.getContext('2d'), root=document.querySelector('#game');
const friends=['max','chick','duck','frog'], images={}, failures=[];
const assetKeys=[...friends,'raccoon','ball','tile-grass','tile-path','tile-fence-h','tile-fence-v','tile-water','tile-lily','tile-flowerbed','tile-hole','tile-bush','tile-rock','tile-stump'];
// The three narrow gates are mandatory: fence (Max), flowerbed (Chick), lily (Frog).
const blueprint=['#....G#','#L#####','#LWWWW#','#.....#','####F##','#.....#','###H###','#.....#','#.....#'];
const patrols=[[[5,5],[4,5],[3,5],[2,5],[1,5]],[[5,3],[4,3],[3,3],[2,3]]];
const tileW=134,rowPitch=110,boardX=71,boardH=1038;
let worldH=1920,boardY=400,scale=1,clock=0,lastFrame=0,ready=false,audioCtx;
let grid,order,trail,previousTrail,enemies,previousEnemies,movingAt=-5,bumpAt=-5,bumpVector=[0,0],phase='play',phaseAt=0,particles=[],ripples=[],moves=0,used={},gesture=null;
function reset(){grid=blueprint.map(row=>row.split(''));order=friends.slice();trail=[[3,7],[3,8],[2,8],[1,8]];previousTrail=trail.map(p=>p.slice());enemies=patrols.map(()=>({index:0,dir:1}));previousEnemies=enemies.map((e,i)=>patrols[i][e.index].slice());phase='play';phaseAt=clock;particles=[];ripples=[];moves=0;used={};movingAt=-5;bumpAt=-5;document.querySelector('#goal-copy').textContent='공을 찾아요';syncPortraits();}
function syncPortraits(){document.querySelectorAll('[data-friend]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.friend===order[0])));}
function lead(key){if(phase!=='play')return;const idx=order.indexOf(key);order=order.slice(idx).concat(order.slice(0,idx));syncPortraits();bumpAt=-5;}
function fit(){const rect=root.getBoundingClientRect();scale=rect.width/1080;worldH=rect.height/scale;const header=document.querySelector('header').getBoundingClientRect(),footer=document.querySelector('footer').getBoundingClientRect();const available=(footer.y-header.bottom)/scale-boardH,gap=Math.max(0,Math.min(60,available/2));const upper=(header.bottom-rect.y)/scale+gap,lower=(footer.y-rect.y)/scale-gap;boardY=Math.max(upper,(upper+lower-boardH)/2);const dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);}
function cellPoint(x,y){return [boardX+(x+.5)*tileW,boardY+y*rowPitch+89];}
function enemyNext(e,i){let idx=e.index+e.dir,dir=e.dir;if(idx<0||idx>=patrols[i].length){dir=-dir;idx=e.index+dir;}return {index:idx,dir};}
function permitted(kind,key){if(kind==='#')return false;if(kind==='H')return key==='max';if(kind==='F')return key==='chick';if(kind==='W')return key==='duck';if(kind==='L')return key==='frog';return true;}
function sound(won){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume().catch(()=>{});const startAt=audioCtx.currentTime;const tones=won?[523,659,784,1047]:[155,100];tones.forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz,startAt+i*.075);gain.gain.setValueAtTime(0,startAt+i*.075);gain.gain.linearRampToValueAtTime(.09,startAt+i*.075+.012);gain.gain.exponentialRampToValueAtTime(.001,startAt+i*.075+.23);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(startAt+i*.075);osc.stop(startAt+i*.075+.25);});}catch{}}
function burst(x,y,amount=40){for(let i=0;i<amount;i++){const a=i*2.39996;particles.push({x,y,vx:Math.cos(a)*(95+i%6*34),vy:Math.sin(a)*(100+i%5*38)-95,born:clock,life:.7+(i%8)*.09,color:['#fff9bb','#ffd75b','#fff','#acf6c8'][i%4],size:7+i%4*3});}}
function move(dx,dy){if(!ready||phase!=='play'||clock-movingAt<.17)return false;const [x,y]=trail[0],nx=x+dx,ny=y+dy,kind=grid[ny]?.[nx];if(!kind||!permitted(kind,order[0])){bumpAt=clock;bumpVector=[dx,dy];return false;}
previousTrail=trail.map(p=>p.slice());trail=[[nx,ny],...trail.slice(0,3)];movingAt=clock;moves++;if(kind==='H'){grid[ny][nx]='O';used.max=true;burst(...cellPoint(nx,ny),14);}if(kind==='F')used.chick=true;if(kind==='L')used.frog=true;if(kind==='W')used.duck=true;
previousEnemies=enemies.map((e,i)=>patrols[i][e.index].slice());enemies=enemies.map(enemyNext);
const caught=enemies.some((e,i)=>{const pos=patrols[i][e.index],old=previousEnemies[i];return (pos[0]===nx&&pos[1]===ny)||(old[0]===nx&&old[1]===ny);});
if(caught){phase='caught';phaseAt=clock;sound(false);burst(...cellPoint(nx,ny),18);return true;}
if(kind==='G'){phase='won';phaseAt=clock;burst(...cellPoint(nx,ny),70);sound(true);document.querySelector('#goal-copy').textContent='공을 찾았어요!';}return true;}
function tapCell(x,y){const [lx,ly]=trail[0],dx=x-lx,dy=y-ly;if(!dx&&!dy)return false;return Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy));}
function sprite(key,x,y,w,h){const im=images[key];if(im){ctx.drawImage(im,x-w/2,y-h,w,h);}else{ctx.fillStyle='#c9c6d4';ctx.beginPath();ctx.roundRect(x-w/2,y-h,w,h,Math.min(w,h)*.25);ctx.fill();}}
function glow(x,y,r,strength=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,250,175,${.8*strength})`);g.addColorStop(1,'rgba(255,248,170,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function star(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function draw(){ctx.setTransform(canvas.width/1080,0,0,canvas.height/worldH,0,0);ctx.clearRect(0,0,1080,worldH);if(!ready)return;
ctx.save();const age=clock-phaseAt;if((phase==='won'||phase==='caught')&&age<.32)ctx.translate(Math.sin(age*95)*9*(1-age/.32),Math.cos(age*87)*5*(1-age/.32));
// Background dressing uses supplied sprites only; all positions belong to the board.
ctx.globalAlpha=.8;for(let i=0;i<10;i++){sprite('tile-bush',i%2?1068:12,boardY-15+i*122,176,164);}ctx.globalAlpha=1;
ctx.fillStyle='#4f622d35';ctx.beginPath();ctx.roundRect(boardX-9,boardY+13,956,boardH,26);ctx.fill();
for(let y=0;y<9;y++)for(let x=0;x<7;x++){const kind=grid[y][x],[cx,cy]=cellPoint(x,y);const ground=kind==='W'?'tile-water':kind==='L'?'tile-lily':kind==='F'?'tile-flowerbed':kind==='.'||kind==='G'?'tile-path':'tile-grass';sprite(ground,cx,cy+41,tileW+5,146);if(kind==='#'){const decor=(x*3+y*7)%11===0?'tile-rock':'tile-bush';sprite(decor,cx,cy+4,132,decor==='tile-rock'?106:132);}if(kind==='H')sprite('tile-fence-h',cx,cy+9,147,88);
// tile-hole contains a painted Max: show that illustration while digging, then keep its lower soil patch.
if(kind==='O'){const im=images['tile-hole'];if(im){if(clock-movingAt<.17&&trail[0][0]===x&&trail[0][1]===y)sprite('tile-hole',cx,cy+42,136,159);else ctx.drawImage(im,0,220,284,112,cx-68,cy-10,136,54);}}
if(kind==='G'){const jump=phase==='won'?Math.abs(Math.sin(age*7))*75*Math.exp(-age*.7):Math.sin(clock*2)*7;glow(cx,cy-25,120,.65);sprite('ball',cx,cy-12-jump,96,98);ctx.fillStyle='#fffbd3';for(let j=0;j<3;j++){const a=clock*.8+j*2.1;star(cx+Math.cos(a)*79,cy-50+Math.sin(a)*57,9+Math.sin(clock*4+j)*3);}}
}
// Perimeter fence follows the same board origin at every viewport height.
for(let x=0;x<7;x++){const cx=boardX+(x+.5)*tileW;sprite('tile-fence-h',cx,boardY-3,145,79);sprite('tile-fence-h',cx,boardY+boardH+7,145,79);}
for(let y=0;y<9;y+=2){sprite('tile-fence-v',boardX-9,boardY+y*rowPitch+126,45,159);sprite('tile-fence-v',boardX+938+9,boardY+y*rowPitch+126,45,159);}
const units=[],progress=Math.min(1,Math.max(0,(clock-movingAt)/.17)),ease=1-Math.pow(1-progress,3);
for(let i=0;i<4;i++){const p=trail[i],old=previousTrail[i],x=old[0]+(p[0]-old[0])*ease,y=old[1]+(p[1]-old[1])*ease;units.push({key:order[i],x,y,idx:i});}
enemies.forEach((e,i)=>{const p=patrols[i][e.index],old=previousEnemies[i],next=patrols[i][enemyNext(e,i).index],[px,py]=cellPoint(...next);ctx.fillStyle='#f85444';ctx.shadowColor='#ffdc91';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(px,py-8,13+Math.sin(clock*4)*2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff0c7';ctx.lineWidth=4;ctx.stroke();units.push({key:'raccoon',x:old[0]+(p[0]-old[0])*ease,y:old[1]+(p[1]-old[1])*ease,idx:5+i});});
units.sort((a,b)=>a.y-b.y||b.idx-a.idx).forEach(unit=>{let [px,py]=cellPoint(unit.x,unit.y);const landing=grid[trail[0][1]][trail[0][0]],jumpHeight=unit.idx===0&&((unit.key==='frog'&&landing==='L')||(unit.key==='chick'&&landing==='F'))?53:12;let hop=Math.sin(progress*Math.PI)*jumpHeight;if(unit.idx===0&&clock-bumpAt<.3){const push=Math.sin((clock-bumpAt)/.3*Math.PI)*19;px+=bumpVector[0]*push;py+=bumpVector[1]*push;}if(phase==='won'&&unit.idx<4)hop+=Math.max(0,Math.sin(age*9-unit.idx*.8))*52;if(phase==='caught'&&unit.key==='max'){hop+=Math.sin(Math.min(1,age/.6)*Math.PI)*95;px+=Math.sin(age*35)*12;}ctx.fillStyle='#46552b36';ctx.beginPath();ctx.ellipse(px,py+2,42,15,0,0,Math.PI*2);ctx.fill();if(unit.idx===0){ctx.strokeStyle='#efffc5';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(px,py,49,23,0,0,Math.PI*2);ctx.stroke();}const dims=unit.key==='max'?[79,124]:unit.key==='chick'?[84,104]:unit.key==='duck'?[88,94]:unit.key==='frog'?[97,90]:[100,114];sprite(unit.key,px,py+6-hop,...dims);});
for(const p of particles){const t=clock-p.born;if(t>p.life)continue;ctx.globalAlpha=1-t/p.life;ctx.fillStyle=p.color;star(p.x+p.vx*t,p.y+p.vy*t+145*t*t,p.size*(1-t/p.life));}ctx.globalAlpha=1;
for(const r of ripples){const t=clock-r.born;if(t>.5)continue;ctx.strokeStyle=`rgba(245,255,215,${1-t*2})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(r.x,r.y,15+t*80,0,Math.PI*2);ctx.stroke();}
if(phase==='won'&&age<1.2){const [gx,gy]=cellPoint(5,0);glow(gx,gy,320,Math.max(0,1-age/1.2));}ctx.restore();}
function advance(dt){clock+=Math.max(0,Math.min(dt,1));if(phase==='caught'&&clock-phaseAt>.85)reset();particles=particles.filter(p=>clock-p.born<p.life);ripples=ripples.filter(r=>clock-r.born<.5);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();gesture={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',e=>{e.preventDefault();if(!gesture||gesture.id!==e.pointerId)return;const down=gesture;gesture=null;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>22)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.x)/scale,y=(e.clientY-rect.y)/scale,cx=Math.floor((x-boardX)/tileW),cy=Math.floor((y-boardY)/rowPitch);if(cx<0||cx>=7||cy<0||cy>=9)return;ripples.push({x,y,born:clock});tapCell(cx,cy);});
canvas.addEventListener('pointercancel',()=>{gesture=null;});document.querySelectorAll('[data-friend]').forEach(button=>button.addEventListener('click',()=>lead(button.dataset.friend)));document.querySelector('#again').addEventListener('click',reset);document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});window.addEventListener('resize',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
// Inspection only: no storage, analytics, monetization, menus, or meta progression.
window.T={state:()=>({ready,phase,moves,leader:order[0],order:order.slice(),trail:trail.map(p=>p.slice()),grid:grid.map(r=>r.join('')),enemies:enemies.map((e,i)=>({cell:patrols[i][e.index],next:patrols[i][enemyNext(e,i).index]})),used:{...used},worldH,boardY,boardX,tileW,rowPitch}),step:dt=>{advance(dt);draw();},input:(kind,...args)=>kind==='lead'?lead(args[0]):kind==='move'?move(...args):kind==='tap'?tapCell(...args):false,load:reset,assets:()=>({loaded:Object.keys(images),failed:failures.slice()})};
reset();fit();Promise.all(assetKeys.map(key=>new Promise(resolve=>{const im=new Image();im.onload=()=>{images[key]=im;resolve();};im.onerror=()=>{failures.push(key);resolve();};im.src='art/sprites/'+key+'.png';}))).then(()=>{ready=true;});
function frame(stamp){const dt=lastFrame?Math.min((stamp-lastFrame)/1000,.05):0;lastFrame=stamp;if(!document.hidden)advance(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script></body></html>
