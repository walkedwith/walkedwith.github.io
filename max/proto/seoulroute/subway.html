<style>

  #panel{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 60px);background:#0b1020e8;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;display:none}

<body>
<canvas id="c"></canvas>
<button id="gear">⚙</button>
<div id="panel"></div>
<script>
// Subway segment, silhouette build (no art yet). Same contract as index.html (PORT.md): RULES = integer state
// machine, 60 ticks/s, milli-units, xorshift32. One run = corridor crowd -> stairs/escalator fork -> platform doors
// -> board before the doors close. Same 45s limit and result card as the motorbike so the two can be compared.

const DATA = {
  version: 1,
  tickRate: 60,
  rng: { shiftA: 13, shiftB: 17, shiftC: 5 },
  half: 2,                          // lanes -2..2 = five walking lines / five doors
  playerW: 420, playerLen: 600,
  slowTicks: 96, slowFloor: 150, boostTicks: 90, boostPermille: 1150,
  followGap: 900, walkGap: 700, accel: 4, brakeDecel: 6,
  spawnDz: 30000, despawnBehind: 6000, spawnClear: 2500, laneClear: 1000,
  brushGap: 160,
  // the three places, in world milli-units from the start
  fork: 74000,                      // where the corridor turns into stairs + escalator, side by side (10-24: not two branches)
  climb: { len: 16000, stairsPermille: 550, belt: 3600, walk: 2200 }, // lanes -2..0 stairs (slow, crowded) | railing | lane 1 escalator walking line, lane 2 standing line
  junctionBack: 9000,               // after the climb: the line where your side picks the platform (left lanes = 1번, right lanes = 2번) — same rule as the motorbike turn
  doorBack: 16000,                  // platform length after the junction, before the door line
  platPenalty: 600,                 // ticks added when you walk onto the wrong platform (back up the stairs)
  missPenalty: 600,                 // ticks added to your time when you board the wrong car (long transfer walk)
  // train cycle at the door line: closed (arriving) / open / closing / gone
  phases: [ { k: 'R', t: 300 }, { k: 'G', t: 240 }, { k: 'Y', t: 75 }, { k: 'X', t: 480 } ],
  // kinds: w milli-lanes, len milli-units, v milli-units/s (negative = coming at you), pick = weight, zones where they appear
  kinds: [
    { id: 'walker', w: 500, len: 500, solid: true, walk: true, vMin: 800, vMax: 2000, pick: 50, zones: ['corridor', 'stairs', 'platform'], turn: true },
    { id: 'oncoming', w: 500, len: 500, solid: true, free: true, vMin: -3800, vMax: -2400, pick: 25, zones: ['corridor', 'stairs'] },
    { id: 'luggage', w: 650, len: 900, solid: true, walk: true, vMin: 500, vMax: 1100, pick: 12, zones: ['corridor'] },
    { id: 'wet', w: 600, len: 600, solid: false, pick: 13, zones: ['corridor', 'platform'] },
    { id: 'stander', w: 500, len: 500, solid: true, walk: true, vMin: 0, vMax: 0, pick: 0, zones: [] }, // escalator riders, door queues
  ],
  knobs: {
    speed: 5000,                    // your walking pace, milli-units per second
    people: 14,                     // crowd kept ahead of you
    turnChance: 14,                 // per 10000 per tick: a walker turns their head and drifts a lane
    blinkTicks: 48, laneTicks: 9, peopleLaneTicks: 36,
    hitbox: 800,
    runTicks: 2700,                 // same limit as the motorbike
    wantDoor: 0,                    // 0 = random door each run, 1..5 fixed
    wantPlat: 0,                    // 0 = random platform, 1 or 2 fixed
    queueMax: 4,                    // longest door queue
  },
};

// === RULES BEGIN ===
function idiv(a, b) { return Math.trunc(a / b); }
function rngInt(s, n) {
  const r = DATA.rng; let x = s.rng;
  x ^= x << r.shiftA; x >>>= 0; x ^= x >>> r.shiftB; x ^= x << r.shiftC; x >>>= 0;
  s.rng = x; return x % n;
}
function smooth(from, to, t, total) {
  const u = idiv(t * 1000, total), e = idiv(u * u * (3000 - 2 * u), 1000000);
  return from + idiv((to - from) * e, 1000);
}
function xOverlap(s, o) { return 2000 * Math.abs(s.x - o.x) < (DATA.kinds[o.kind].w + DATA.playerW) * s.cfg.hitbox; }
function zOverlap(o) { return 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen; }
function laneFree(s, lane, dz, len, skip) {
  for (const o of s.obs) {
    if (o === skip || (o.lane !== lane && o.to !== lane)) continue;
    if (2 * Math.abs(o.dz - dz) < len + DATA.kinds[o.kind].len + 2 * DATA.laneClear) return false;
  }
  return true;
}
const CYCLE = DATA.phases.reduce((a, p) => a + p.t, 0);
function zoneAt(s, world) { // 'corridor' | 'climb' | 'link' | 'platform' for a world distance
  if (world < DATA.fork) return 'corridor';
  if (world < DATA.fork + DATA.climb.len) return 'climb';
  return world < junctionAt(s) ? 'link' : 'platform';
}
const escLane = lane => lane >= 1; // in the climb zone: lanes 1,2 ride the escalator, -2..0 take the stairs; at the junction the same split picks the platform
function junctionAt(s) { return DATA.fork + DATA.climb.len + DATA.junctionBack; }
function doorAt(s) { return junctionAt(s) + DATA.doorBack; }
function phaseAt(s) {
  let t = (s.tick + s.off) % CYCLE, i = 0;
  while (t >= DATA.phases[i].t) { t -= DATA.phases[i].t; i++; }
  return { i, left: DATA.phases[i].t - t };
}
function doorsOpen(s) { const k = DATA.phases[phaseAt(s).i].k; return k === 'G' || k === 'Y'; }
function lineGap(s) { return doorAt(s) - s.dist - idiv(DATA.playerLen, 2); }
function held(s) { return lineGap(s) > 0 && !doorsOpen(s); }
function follow(target, aheadV, gap, keep) {
  if (gap >= 3 * keep) return target;
  if (gap <= keep) return Math.min(target, idiv(aheadV * Math.max(0, gap), keep));
  return Math.min(target, aheadV + idiv((gap - keep) * target, 2 * keep));
}
function spawnOne(s, dz, ev, forceKind, forceLane, v0) {
  const world = s.dist + dz, zone = zoneAt(s, world);
  let kind = forceKind;
  if (kind === undefined) {
    const ok = DATA.kinds.map((k, i) => k.zones.includes(zone) ? k.pick : 0), sum = ok.reduce((a, b) => a + b, 0);
    if (sum === 0) return;
    let r = rngInt(s, sum); kind = 0;
    while (r >= ok[kind]) { r -= ok[kind]; kind++; }
  }
  const lane = forceLane !== undefined ? forceLane : rngInt(s, 2 * DATA.half + 1) - DATA.half;
  if (zone === 'climb' && escLane(lane) && forceKind === undefined) { // escalator: standing line all standers, walking line mostly walkers
    if (lane === DATA.half || rngInt(s, 100) < 30) kind = 4; else kind = 0;
  }
  const kd = DATA.kinds[kind];
  for (const o of s.obs) if (o.lane === lane && Math.abs(o.dz - dz) < DATA.spawnClear) return;
  const v = v0 !== undefined ? v0 : idiv(kd.vMin + rngInt(s, kd.vMax - kd.vMin + 1), DATA.tickRate); // base pace; the zone adjusts it each tick (peopleSpeed)
  const o = { id: s.nextId++, kind, lane, to: lane, x: lane * 1000, fromX: lane * 1000, moveT: s.cfg.peopleLaneTicks,
    dz, v, cv: v, blink: 0, touch: false, brushed: false };
  s.obs.push(o);
  if (ev) ev.push({ k: 'spawn', id: o.id, kind, lane });
}
function playerSpeed(s) {
  const k = s.cfg, zone = zoneAt(s, s.dist);
  let target = idiv(k.speed, DATA.tickRate);
  if (zone === 'climb') target = escLane(s.lane) ? idiv(DATA.climb.belt + (s.lane === 1 ? DATA.climb.walk : 0), DATA.tickRate) : idiv(target * DATA.climb.stairsPermille, 1000);
  if (s.slow > 0) target = idiv(target * (DATA.slowFloor + idiv((1000 - DATA.slowFloor) * (DATA.slowTicks - s.slow), DATA.slowTicks)), 1000);
  if (s.boost > 0) target = idiv(target * DATA.boostPermille, 1000);
  for (const o of s.obs) {
    const kd = DATA.kinds[o.kind];
    if (!kd.solid || kd.free || o.dz <= 0 || !xOverlap(s, o)) continue; // oncoming people are not followed: dodge or bump
    target = follow(target, o.cv, o.dz - idiv(kd.len + DATA.playerLen, 2), DATA.followGap);
  }
  if (held(s)) target = follow(target, 0, lineGap(s), DATA.followGap);
  return target;
}
function peopleSpeed(s, o) { // walkers keep a gap behind whoever walks ahead in their line (you included); queues wait for the doors
  const kd = DATA.kinds[o.kind];
  let t = o.v;
  if (kd.free) return t;
  if (zoneAt(s, s.dist + o.dz) === 'climb') t = escLane(o.lane) ? t + idiv(DATA.climb.belt, DATA.tickRate) : idiv(t * DATA.climb.stairsPermille, 1000); // belt carries, stairs slow
  if (o.queue) t = doorsOpen(s) ? idiv(2000, DATA.tickRate) : 0;
  for (const p of s.obs) {
    if (p === o || !DATA.kinds[p.kind].solid || DATA.kinds[p.kind].free || p.dz <= o.dz || (p.lane !== o.lane && p.to !== o.lane)) continue;
    t = follow(t, p.cv, p.dz - o.dz - idiv(kd.len + DATA.kinds[p.kind].len, 2), DATA.walkGap);
  }
  if (o.dz < 0 && s.lane === o.lane) t = follow(t, s.vp, -o.dz - idiv(kd.len + DATA.playerLen, 2), DATA.walkGap);
  return t;
}
const RULES = {
  init(data, seed, knobs) {
    const cfg = Object.assign({}, data.knobs, knobs || {});
    const s = { v: data.version, tick: 0, rng: (seed >>> 0) || 1, cfg,
      lane: 0, fromX: 0, x: 0, moveT: cfg.laneTicks, moveDir: 0, vp: 0, brake: false,
      dist: 0, obs: [], nextId: 1, slow: 0, boost: 0, hits: 0, brushes: 0, squeezes: 0, squeezing: false, stuck: 0, wait: 0,
      via: -1, plat: -1, wantPlat: 0, queued: false, off: 0, want: 0, extra: 0, done: false, win: false, boarded: false };
    s.off = rngInt(s, CYCLE);
    s.want = cfg.wantDoor ? cfg.wantDoor - 1 - data.half : rngInt(s, 2 * data.half + 1) - data.half;
    s.wantPlat = cfg.wantPlat ? cfg.wantPlat - 1 : rngInt(s, 2);
    for (let i = 0; i < cfg.people; i++) spawnOne(s, 5000 + rngInt(s, 25000), null);
    return s;
  },
  apply(s, cmd) {
    const ev = [];
    if (cmd.k === 'lane' && !s.done) {
      const to = Math.max(-DATA.half, Math.min(DATA.half, s.lane + cmd.dir));
      if (to === s.lane || (zoneAt(s, s.dist) === 'climb' && escLane(to) !== escLane(s.lane))) ev.push({ k: 'bump', dir: cmd.dir }); // edge, or the railing between stairs and escalator
      else { ev.push({ k: 'lane', from: s.lane, to }); s.fromX = s.x; s.lane = to; s.moveT = 0; s.moveDir = cmd.dir; }
    }
    if (cmd.k === 'brake' && !s.done && s.brake !== !!cmd.on) { s.brake = !!cmd.on; ev.push({ k: 'brake', on: s.brake }); }
    return { events: ev };
  },
  tick(s) {
    const ev = [];
    if (s.done) return { events: ev };
    const k = s.cfg;
    s.tick++;
    if (s.slow > 0) s.slow--;
    if (s.boost > 0) s.boost--;
    if (s.moveT < k.laneTicks) { s.moveT++; s.x = smooth(s.fromX, s.lane * 1000, s.moveT, k.laneTicks); }
    else s.x = s.lane * 1000;
    const closed = held(s) && lineGap(s) < 3 * DATA.followGap;
    const want = playerSpeed(s);
    const vp = s.brake ? Math.max(0, Math.min(want, s.vp - DATA.brakeDecel)) : want < s.vp ? want : Math.min(want, s.vp + DATA.accel);
    s.vp = vp; s.dist += vp;
    if (vp * 10 < idiv(k.speed, DATA.tickRate) * 7 && zoneAt(s, s.dist) !== 'climb') { if (closed) s.wait++; else s.stuck++; } // the climb is slow by design, not 'stuck'
    if (s.via < 0 && s.dist >= DATA.fork) { s.via = escLane(s.lane) ? 1 : 0; ev.push({ k: 'fork', branch: s.via }); } // stairs or escalator: whichever lane you are in
    if (s.plat < 0 && s.dist >= junctionAt(s)) { // the junction: your side is your platform
      s.plat = escLane(s.lane) ? 1 : 0;
      if (s.plat !== s.wantPlat) { s.extra += DATA.platPenalty; ev.push({ k: 'wrongplat', want: s.wantPlat, plat: s.plat }); }
      ev.push({ k: 'junction', side: s.plat });
      s.obs = s.obs.filter(o => o.dz < 2000); // the other platform's crowd went the other way
      for (let i = 0; i < k.people; i++) spawnOne(s, 4000 + rngInt(s, DATA.doorBack - 6000), ev);
    }
    if (!s.queued && s.dist >= doorAt(s) - DATA.doorBack) { // onto the platform: a queue at every door
      s.queued = true;
      const line = doorAt(s) - s.dist;
      for (let lane = -DATA.half; lane <= DATA.half; lane++) {
        const n = rngInt(s, k.queueMax + 1);
        for (let i = 0; i < n; i++) {
          spawnOne(s, line - 900 - i * 800, ev, 4, lane, 0);
          s.obs[s.obs.length - 1].queue = true;
        }
      }
    }
    if (s.dist >= doorAt(s)) { // through the door: boarded
      s.boarded = true; s.done = true; s.win = true;
      if (s.lane !== s.want) { s.extra += DATA.missPenalty; ev.push({ k: 'miss', want: s.want, lane: s.lane }); }
      ev.push({ k: 'done', win: true, tick: s.tick + s.extra });
      return { events: ev };
    }
    for (const o of s.obs) { const t = peopleSpeed(s, o); o.cv = t < o.cv ? t : Math.min(t, o.cv + DATA.accel); }
    for (const o of s.obs) {
      const kd = DATA.kinds[o.kind];
      o.dz += o.cv - vp;
      if (o.queue && o.dz + s.dist > doorAt(s) + 500) o.dz = -DATA.despawnBehind - 1; // boarded ahead of you
      if (o.blink > 0) {
        o.blink--;
        if (o.blink === 0) { o.fromX = o.x; o.lane = o.to; o.moveT = 0; }
      } else if (kd.turn && o.cv > 0 && o.moveT >= k.peopleLaneTicks && o.dz > 1500 && rngInt(s, 10000) < k.turnChance) {
        const to = o.lane + (rngInt(s, 2) === 0 ? -1 : 1);
        if (Math.abs(to) <= DATA.half && laneFree(s, to, o.dz, kd.len, o)) { o.to = to; o.blink = k.blinkTicks; ev.push({ k: 'blink', id: o.id, to }); }
      }
      if (o.moveT < k.peopleLaneTicks) { o.moveT++; o.x = smooth(o.fromX, o.lane * 1000, o.moveT, k.peopleLaneTicks); }
    }
    let left = false, right = false;
    for (const o of s.obs) {
      const kd = DATA.kinds[o.kind], zo = zOverlap(o), xo = xOverlap(s, o);
      if (zo && xo) {
        if (!o.touch) {
          o.touch = true;
          if (kd.solid) { s.hits++; s.slow = DATA.slowTicks; ev.push({ k: 'hit', id: o.id }); }
          else { s.slow = Math.max(s.slow, idiv(DATA.slowTicks, 3)); ev.push({ k: 'splash', id: o.id }); }
        }
      } else {
        o.touch = false;
        if (zo && kd.solid) {
          if (o.x < s.x) left = true; else right = true;
          const side = 2 * Math.abs(s.x - o.x) - kd.w - DATA.playerW;
          if (!o.brushed && side < 2 * DATA.brushGap) { o.brushed = true; s.brushes++; ev.push({ k: 'brush', id: o.id }); }
        }
      }
    }
    if (left && right && !s.squeezing) { s.squeezes++; s.boost = DATA.boostTicks; ev.push({ k: 'squeeze' }); }
    s.squeezing = left && right;
    s.obs = s.obs.filter(o => o.dz > -DATA.despawnBehind && o.dz < DATA.spawnDz + 15000);
    let ahead = 0;
    for (const o of s.obs) if (o.dz > 0) ahead++;
    if (ahead < k.people && !s.queued) spawnOne(s, DATA.spawnDz + rngInt(s, 8000), ev);
    if (s.tick >= k.runTicks) { s.done = true; s.win = false; ev.push({ k: 'done', win: false, tick: s.tick }); }
    return { events: ev };
  },
};
// === RULES END ===

function canon(v) {
  if (v === null || typeof v === 'boolean' || v === undefined) return String(v);
  if (typeof v === 'number') { if (!Number.isSafeInteger(v)) throw Error('canon integer required: ' + v); return String(v); }
  if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}
function fnv(str) { let h = 2166136261; for (const b of new TextEncoder().encode(str)) h = Math.imul(h ^ b, 16777619) >>> 0; return h.toString(16).padStart(8, '0'); }
function replay(log) {
  const s = RULES.init(DATA, log.seed, log.knobs);
  let i = 0, events = 0;
  while (s.tick < log.endTick && !s.done) {
    while (i < log.cmds.length && log.cmds[i].t === s.tick) events += RULES.apply(s, log.cmds[i++]).events.length;
    events += RULES.tick(s).events.length;
  }
  return { hash: fnv(canon(s)), events, tick: s.tick };
}

// ---- dev knobs ----
const KNOBS = [
  ['camBack', '카메라 거리', 2, 14, 0.5, 8, null],
  ['speed', '내 걸음', 3, 9, 0.5, 5, v => Math.round(v * 1000)],
  ['people', '사람 수', 4, 24, 1, 14, v => v],
  ['turnChance', '비켜 오기 빈도', 0, 40, 1, 14, v => v],
  ['queueMax', '문 앞 줄 최대', 0, 8, 1, 4, v => v],
  ['runTicks', '제한 시간 초', 20, 90, 5, 45, v => v * 60],
  ['wantDoor', '빠른 하차 문(0 무작위)', 0, 5, 1, 0, v => v],
  ['wantPlat', '승강장(0 무작위)', 0, 2, 1, 0, v => v],
];
const KNOB_KEY = 'proto_seoulroute_subway1';
const V = {};
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KNOB_KEY) || '{}'); } catch (e) {}
const panel = document.getElementById('panel');
for (const [k, label, min, max, step, def] of KNOBS) {
  V[k] = saved[k] ?? def;
  const row = document.createElement('label');
  row.innerHTML = `<span class="n">${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${V[k]}"><span class="v">${V[k]}</span>`;
  const input = row.querySelector('input'), out = row.querySelector('.v');
  input.oninput = () => { V[k] = +input.value; out.textContent = input.value; try { localStorage.setItem(KNOB_KEY, JSON.stringify(V)); } catch (e) {} };
  panel.appendChild(row);
}
document.getElementById('gear').onclick = () => { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; };
const ruleKnobs = () => Object.fromEntries(KNOBS.filter(r => r[6]).map(r => [r[0], r[6](V[r[0]])]));

// ---- presentation: silhouettes only (grey-violet rounded shapes), floor/walls drawn in code ----
const W = 720, HORIZON = 457, LANE_PX = 128;
let H = 1280, PLAYER_Y = 1090, CAM_H = 3.63;
const zPlayer = () => V.camBack;
const focal = () => zPlayer() * (PLAYER_Y - HORIZON) / CAM_H;
const FX = { pops: [], shake: 0, flash: 0, flashCol: '#fff', age: {}, bend: null };
let S, LOG;
function reset(seed = (Date.now() >>> 0)) {
  S = RULES.init(DATA, seed, ruleKnobs());
  LOG = { seed: (seed >>> 0) || 1, knobs: ruleKnobs(), cmds: [], endTick: 0 };
  FX.pops = []; FX.shake = 0; FX.flash = 0; FX.age = {}; FX.bend = null;
}
function command(cmd) { if (S.done) return; LOG.cmds.push(Object.assign({ t: S.tick }, cmd)); onEvents(RULES.apply(S, cmd).events); }

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  H = Math.max(1280, Math.round(W * innerHeight / innerWidth));
  PLAYER_Y = H - 190;
  CAM_H = (PLAYER_Y - HORIZON) / LANE_PX;
  scale = Math.min(innerWidth / W, innerHeight / H) * dpr;
  offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

let ac = null;
function audioOn() { if (!ac) try { ac = new AudioContext(); } catch (e) { ac = null; } }
function blip(freq, len, type = 'sine', vol = 0.2, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len);
}
let lastPhase = -1;
function onEvents(events) {
  for (const e of events) {
    if (e.k === 'spawn') FX.age[e.id] = 0;
    if (e.k === 'lane') blip(220, 0.08, 'triangle', 0.08, 1.6);

    ctx.fillText(`틈새 ${S.squeezes} · 스침 ${S.brushes} · 쿵 ${S.hits}`, W / 2, 620);
    ctx.fillText(S.via < 0 ? '계단까지 못 감' : `${S.via ? '에스컬레이터' : '계단'} · ${S.plat < 0 ? '승강장 못 감' : S.plat === S.wantPlat ? `${S.plat + 1}번 승강장 ✓` : `반대 승강장 +${DATA.platPenalty / 60}초`}`, W / 2, 670);
    if (S.boarded) ctx.fillText(S.lane === S.want ? '빠른 하차 칸 ✓' : `다른 칸 +${DATA.missPenalty / 60}초`, W / 2, 715);
    ctx.fillStyle = '#9fb3ff'; ctx.fillText('탭해서 다시', W / 2, 780);
  }
}

let anchor = null, anchorY = 0;
cv.addEventListener('pointerdown', e => { audioOn(); if (S.done) { reset(); return; } anchor = e.clientX; anchorY = e.clientY; });
cv.addEventListener('pointermove', e => {
  if (anchor === null) return;
  const dx = e.clientX - anchor;
  if (Math.abs(dx) > 28) { command({ k: 'lane', dir: Math.sign(dx) }); anchor = e.clientX; }
  const dy = e.clientY - anchorY;
  if (dy > 36 && !S.brake) command({ k: 'brake', on: true });
  if (dy < 18 && S.brake) command({ k: 'brake', on: false });
});
addEventListener('pointerup', () => { anchor = null; if (S.brake) command({ k: 'brake', on: false }); });
addEventListener('pointercancel', () => { anchor = null; if (S.brake) command({ k: 'brake', on: false }); });
addEventListener('keydown', e => {
  audioOn();
  if (e.key === 'ArrowLeft') command({ k: 'lane', dir: -1 });
  if (e.key === 'ArrowRight') command({ k: 'lane', dir: 1 });
  if (e.key === 'ArrowDown' && !S.brake) command({ k: 'brake', on: true });
  if ((e.key === ' ' || e.key === 'Enter') && S.done) reset();
});
addEventListener('keyup', e => { if (e.key === 'ArrowDown' && S.brake) command({ k: 'brake', on: false }); });

reset();
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!window.__pause) { acc += dt; while (acc >= 1 / 60) { acc -= 1 / 60; onEvents(RULES.tick(S).events); } }
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.T = {
  state: () => S, log: () => LOG, hash: () => fnv(canon(S)), replay, reset, command,
  // pace bot: weaves like the motorbike bot; heads for `branch` before the climb (0 stairs lanes, 1 escalator standing lane 2,
  // 2 escalator walking lane 1, -1 whichever side it is on), and gets into the wanted door's lane within `plan` units of the door.
  bot(react, runs = 10, seed = 1, branch = -1, plan = 20) {
    const out = { win: 0, hits: 0, sq: 0, stuck: 0, wait: 0, miss: 0, ticks: 0 };
    const every = Math.max(1, Math.round(react * 60));
    for (let r = 0; r < runs; r++) {
      const s = RULES.init(DATA, seed + r, ruleKnobs());
      const inLane = (o, l) => o.lane === l || o.to === l;
      const clearAhead = l => Math.min(99999, ...s.obs.filter(o => DATA.kinds[o.kind].solid && inLane(o, l) && o.dz > 0).map(o => o.dz));
      const sideFree = l => !s.obs.some(o => DATA.kinds[o.kind].solid && inLane(o, l) && 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen + 1400);
      const climbEnd = DATA.fork + DATA.climb.len;
      const okLane = l => {
        if (s.dist < climbEnd) {
          if (s.dist >= DATA.fork && escLane(l) !== escLane(s.lane)) return false; // railing
          if (branch < 0 || DATA.fork - s.dist > 15000) return true;
          return branch === 0 ? l <= 0 : branch === 1 ? l === 2 : l === 1;
        }
        if (s.plat < 0) return junctionAt(s) - s.dist > plan * 1000 || (escLane(l) ? 1 : 0) === s.wantPlat;
        return doorAt(s) - s.dist > plan * 1000 || l === s.want;
      };
      while (!s.done) {
        if (s.tick % every === 0 && s.moveT >= s.cfg.laneTicks) {
          if (!okLane(s.lane)) {
            const dir = s.dist < climbEnd ? (branch === 0 ? -1 : branch === 1 ? Math.sign(2 - s.lane) || 1 : Math.sign(1 - s.lane) || 1) : s.plat < 0 ? (s.wantPlat ? 1 : -1) : Math.sign(s.want - s.lane);
            if (sideFree(s.lane + dir)) RULES.apply(s, { k: 'lane', dir });
          } else if (clearAhead(s.lane) < 5000) {
            const opts = [s.lane - 1, s.lane + 1].filter(l => Math.abs(l) <= DATA.half && okLane(l) && sideFree(l)).sort((a, b) => clearAhead(b) - clearAhead(a));
            if (opts.length && clearAhead(opts[0]) > clearAhead(s.lane)) RULES.apply(s, { k: 'lane', dir: Math.sign(opts[0] - s.lane) });
          }
        }
        RULES.tick(s);
      }
      out.win += s.win ? 1 : 0; out.hits += s.hits; out.sq += s.squeezes; out.stuck += s.stuck; out.wait += s.wait; out.miss += (s.plat >= 0 && s.plat !== s.wantPlat ? 1 : 0) + (s.boarded && s.lane !== s.want ? 1 : 0); out.ticks += s.tick + s.extra;
    }
    const n = runs;
    return `${react}s ${branch === 1 ? '에스컬레이터 서기' : branch === 2 ? '에스컬레이터 걷기' : branch === 0 ? '계단' : '아무 쪽'} 승${out.win}/${n} 쿵${(out.hits / n).toFixed(1)} 틈새${(out.sq / n).toFixed(1)} 막힘${(out.stuck / n / 60).toFixed(1)}초 대기${(out.wait / n / 60).toFixed(1)}초 다른칸${(out.miss / n).toFixed(1)} ${(out.ticks / n / 60).toFixed(1)}초`;
  },
};
</script>
</body>
</html>
