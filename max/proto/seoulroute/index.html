<canvas id="c"></canvas>

<div id="panel"></div>
<script>
// Speed/timing test for the seoulroute motorbike segment. Port contract: PORT.md.
// RULES = pure integer state machine (60 ticks/s, milli-units, xorshift32) -> GDScript 1:1.
// Everything below RULES END is presentation: pseudo-3D road + depth-scaled sprites, reacting to events.

const DATA = {
  version: 3,
  tickRate: 60,
  rng: { shiftA: 13, shiftB: 17, shiftC: 5 },
  half: 2,                      // lanes are -half..half (5 lanes); edge lanes are turn-only (left -half, right +half)
  playerW: 420, playerLen: 900, // milli-lanes, milli-units
  slowTicks: 96, slowFloor: 150, boostTicks: 90, boostPermille: 1150,
  followGap: 1400,              // bumper gap kept behind a solid thing in your lane
  carGap: 900, carAccel: 3,
  accel: 3, brakeDecel: 5,      // your speed rises this much per tick (milli-units/tick), and falls this much while braking
  filterPermille: 450,          // a stopped car does not block you: you ease past it on the lane line at this share of cruise     // cars keep this gap and speed back up this much per tick, so queues pull away one by one
  spawnDz: 45000, despawnBehind: 9000, spawnClear: 4000, laneClear: 1500,
  brushGap: 160,                // side gap (milli-lanes) that counts as brushing past
  // Intersections: one stop line at a time. Your lane at the line is your move (left lane turns left, right lane turns
  // right, middle goes straight); the order card says which move it wants. Wrong move = detour added to the goal.
  cross: { first: 60000, rand: 30000, missPenalty: 35000, commit: 2500, turnPick: [40, 30, 30] }, // straight/right/left of 100
  phases: [ { k: 'G', t: 240 }, { k: 'Y', t: 45 }, { k: 'L', t: 120 }, { k: 'R', t: 135 } ], // straight green, yellow, left arrow, red
  kinds: [                      // w milli-lanes, len milli-units, v milli-units/s; pick = weight out of 100
    { id: 'sedan', w: 800, len: 1700, solid: true, car: true, vMin: 2000, vMax: 5000, pick: 60 },
    { id: 'bus', w: 920, len: 3000, solid: true, car: true, vMin: 1500, vMax: 3500, pick: 15, curb: true, stopPct: 40 },
    { id: 'manhole', w: 500, len: 500, solid: false, pick: 6 },
    { id: 'cone', w: 300, len: 400, solid: true, pick: 8 },
    { id: 'puddle', w: 650, len: 700, solid: false, pick: 6 },
    { id: 'barrier', w: 850, len: 500, solid: true, pick: 5 },
  ],
  // Signature routes (10-24: Gangnam things that only happen here). All integers, world milli-units from the start.
  //  curve  [[untilMilli, k]]  road bend, k in per-mille of the max bend (+ right, - left) — VIEW ONLY
  //  grade  [[untilMilli, g]]  camera pitch in per-mille (+ climbing) — VIEW ONLY;  crest [milli] jump points — VIEW ONLY
  //  busLane: rightmost lane is a bus-only lane: nothing but fast buses, cams fine you for riding it   — RULE
  //  cams   [milli]: enforcement cameras on busLane routes (fine if you are in the right lane as you pass) — RULE
  //  alley  {n, cut}: at the n-th crossing the right-turn lane is a back-alley shortcut (-cut milli, crowded for alleyTicks) — RULE
  routes: [
    { id: 'teheran', name: '테헤란로', tag: '오르막 · 정상 점프', radio: '테헤란로 오르막 — 정상에서 뜹니다', curve: [[1e9, 0]], grade: [[40000, 0], [120000, 520], [135000, 0], [1e9, -260]], crest: [120000] },
    { id: 'daero', name: '강남대로', tag: '버스 전용차로 · 단속', radio: '강남대로 버스 전용차로 단속 중', curve: [[1e9, 0]], grade: [[1e9, 0]], crest: [], busLane: true, cams: [45000, 95000, 145000, 195000] },
    { id: 'hannam', name: '한남대교', tag: 'S 커브 · 강 바람', radio: '한남대교 진입 — 커브 주의', curve: [[50000, 0], [100000, 800], [150000, -950], [200000, 0], [1e9, 0]], grade: [[40000, 0], [80000, 220], [1e9, 0]], crest: [] },
    { id: 'alley', name: '역삼 골목', tag: '골목 지름길', radio: '첫 교차로 — 오른쪽이 골목 지름길', curve: [[70000, 0], [130000, 380], [1e9, 0]], grade: [[1e9, 0]], crest: [], alley: { n: 1, cut: 18000 } },
  ],
  alleyTicks: 480, fineTip: 500,
  turnTicks: 48, turnPermille: 550, turnRamp: 12,  // cornering: after you leave the stop line into a turn, speed eases to 55% and back over 48 ticks
  knobs: {                      // integer rule tunables; the gear panel edits these
    speed: 7000,                // your cruising speed, milli-units per second (10-24 phone: 9 still felt fast)
    cars: 15,                   // things kept ahead of you
    carChange: 12,              // per 10000 per tick, per car: chance to start signalling a lane change
    blinkTicks: 48,             // turn signal before a car moves over
    carLaneTicks: 30, laneTicks: 9,
    hitbox: 800,                // per-mille of sprite width that collides
    runTicks: 2700,             // time limit
    goalPct: 75,                // goal distance = cruising nonstop for this % of the limit
    lights: 1, crossGap: 110000, // intersections on/off, distance between stop lines
    route: 0,                   // index into routes (the order picks it)
  },
};

// === RULES BEGIN ===
// Integers only. idiv truncates toward zero like GDScript int "/".
function idiv(a, b) { return Math.trunc(a / b); }
function rngInt(s, n) {
  const r = DATA.rng; let x = s.rng;
  x ^= x << r.shiftA; x >>>= 0; x ^= x >>> r.shiftB; x ^= x << r.shiftC; x >>>= 0;
  s.rng = x; return x % n;
}
function smooth(from, to, t, total) { // smoothstep in per-mille, integer
  const u = idiv(t * 1000, total), e = idiv(u * u * (3000 - 2 * u), 1000000);
  return from + idiv((to - from) * e, 1000);
}
function xOverlap(s, o) { // |dx| < (w + playerW)/2 * hitbox/1000
  return 2000 * Math.abs(s.x - o.x) < (DATA.kinds[o.kind].w + DATA.playerW) * s.cfg.hitbox;
}
function zOverlap(o) { return 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen; }
function laneFree(s, lane, dz, len, skip) {
  for (const o of s.obs) {
    if (o === skip || (o.lane !== lane && o.to !== lane)) continue;
    if (2 * Math.abs(o.dz - dz) < len + DATA.kinds[o.kind].len + 2 * DATA.laneClear) return false;
  }
  return true;
}
function routeOf(s) { return DATA.routes[s.cfg.route] || DATA.routes[0]; }
function spawnOne(s, dz, ev) {
  const route = routeOf(s);
  let r = rngInt(s, 100), kind = 0;
  while (r >= DATA.kinds[kind].pick) { r -= DATA.kinds[kind].pick; kind++; }
  if (s.alleyT > 0 && rngInt(s, 100) < 55) kind = 2 + rngInt(s, 4); // the alley: junk, cones, puddles instead of cars
  let kd = DATA.kinds[kind];
  let lane = kd.curb ? (rngInt(s, 2) === 0 ? -DATA.half : DATA.half) : rngInt(s, 2 * DATA.half + 1) - DATA.half;
  let busV = -1;
  if (route.busLane && lane === DATA.half) { // bus-only lane: empty but for a fast bus now and then
    if (rngInt(s, 100) >= 30) return;
    kind = 1; kd = DATA.kinds[1]; busV = idiv(4000 + rngInt(s, 1001), DATA.tickRate);
  } else if (route.busLane && kd.curb) lane = -DATA.half; // ordinary buses stop on the far kerb
  for (const o of s.obs) if (o.lane === lane && Math.abs(o.dz - dz) < DATA.spawnClear) return;
  if (!kd.car && s.cross && Math.abs(s.dist + dz - s.cross.at - 5000) < 8000) return; // keep road junk off the crossing
  let v = 0;
  if (kd.car) {
    v = busV >= 0 ? busV : idiv(kd.vMin + rngInt(s, kd.vMax - kd.vMin + 1), DATA.tickRate);
    if (busV < 0 && kd.stopPct && rngInt(s, 100) < kd.stopPct) v = 0; // bus waiting at a stop
  }
  const o = { id: s.nextId++, kind, lane, to: lane, x: lane * 1000, fromX: lane * 1000, moveT: s.cfg.carLaneTicks,
    dz, v, cv: v, blink: 0, touch: false, brushed: false, pass: false };
  s.obs.push(o);
  if (ev) ev.push({ k: 'spawn', id: o.id, kind, lane });
}
const CYCLE = DATA.phases.reduce((a, p) => a + p.t, 0);
function phaseAt(s) { // {i, left}: current light phase of the next crossing and ticks until it changes
  let t = (s.tick + s.cross.off) % CYCLE, i = 0;
  while (t >= DATA.phases[i].t) { t -= DATA.phases[i].t; i++; }
  return { i, left: DATA.phases[i].t - t };
}
function laneMove(lane) { return lane === DATA.half ? 1 : lane === -DATA.half ? -1 : 0; } // 1 right turn, -1 left turn, 0 straight
function mayGo(s, move) { // right turns go on red; left turns wait for the arrow
  const k = DATA.phases[phaseAt(s).i].k;
  return move === 1 || (move === -1 ? k === 'L' : k === 'G' || k === 'Y');
}
function newCross(s, at) {
  const p = DATA.cross.turnPick, r = rngInt(s, 100);
  let turn = r < p[0] ? 0 : r < p[0] + p[1] ? 1 : -1;
  s.crossN++;
  const al = routeOf(s).alley, alley = !!al && al.n === s.crossN;
  if (alley) turn = 0; // the order wants straight on; turning right is the shortcut, not a mistake
  s.cross = { at: at + rngInt(s, DATA.cross.rand), turn, off: rngInt(s, CYCLE), alley };
}
function lineGap(s) { return s.cross ? s.cross.at - s.dist - idiv(DATA.playerLen, 2) : 1 << 30; } // your nose to the stop line
function held(s) { return !!s.cross && !s.commit && lineGap(s) > 0 && !mayGo(s, laneMove(s.lane)); }
function follow(target, aheadV, gap, keep) { // speed behind something moving at aheadV `gap` ahead: eases in from 3*keep, stops at keep
  if (gap >= 3 * keep) return target;
  if (gap <= keep) return Math.min(target, idiv(aheadV * Math.max(0, gap), keep));
  return Math.min(target, aheadV + idiv((gap - keep) * target, 2 * keep));
}
function playerSpeed(s) { // milli-units per tick: cruise, eased down behind the nearest solid thing in your path or a held stop line
  const k = s.cfg;
  let target = idiv(k.speed, DATA.tickRate);
  if (s.slow > 0) target = idiv(target * (DATA.slowFloor + idiv((1000 - DATA.slowFloor) * (DATA.slowTicks - s.slow), DATA.slowTicks)), 1000);
  if (s.boost > 0) target = idiv(target * DATA.boostPermille, 1000);
  if (s.turnSlow > 0) { // triangular: ramp down over turnRamp ticks, hold, ramp back
    const tri = Math.min(DATA.turnRamp, s.turnSlow, DATA.turnTicks - s.turnSlow);
    target = idiv(target * (1000 - idiv((1000 - DATA.turnPermille) * tri, DATA.turnRamp)), 1000);
  }
  for (const o of s.obs) {
    const kd = DATA.kinds[o.kind];
    if (!kd.solid || o.dz <= 0 || !xOverlap(s, o)) continue;
    const g = o.dz - idiv(kd.len + DATA.playerLen, 2);
    if ((kd.car && o.cv === 0) || o.pass) { if (g < DATA.followGap) target = Math.min(target, idiv(idiv(k.speed, DATA.tickRate) * DATA.filterPermille, 1000)); }
    else target = follow(target, o.cv, g, DATA.followGap);
  }
  if (held(s)) target = follow(target, 0, lineGap(s), DATA.followGap);
  return target;
}
function carSpeed(s, o, ph) { // target for one car: own pace, behind whatever is ahead in its lane (you included), held at the line
  const kd = DATA.kinds[o.kind];
  let t = o.v;
  for (const p of s.obs) {
    if (p === o || !DATA.kinds[p.kind].solid || p.dz <= o.dz || (p.lane !== o.lane && p.to !== o.lane)) continue;
    t = follow(t, p.cv, p.dz - o.dz - idiv(kd.len + DATA.kinds[p.kind].len, 2), DATA.carGap);
  }
  if (o.dz < 0 && s.lane === o.lane) t = follow(t, s.vp, -o.dz - idiv(kd.len + DATA.playerLen, 2), DATA.carGap);
  if (s.cross) {
    const g = s.cross.at - s.dist - o.dz - idiv(kd.len, 2), mv = laneMove(o.lane), pk = DATA.phases[ph].k;
    const go = mv === 1 || (mv === -1 ? pk === 'L' : pk === 'G' || (pk === 'Y' && g < DATA.cross.commit));
    if (g > 0 && !go) t = follow(t, 0, g, DATA.carGap);
  }
  return t;
}
const RULES = {
  init(data, seed, knobs) {
    const cfg = Object.assign({}, data.knobs, knobs || {});
    const s = { v: data.version, tick: 0, rng: (seed >>> 0) || 1, cfg,
      lane: 0, fromX: 0, x: 0, moveT: cfg.laneTicks, moveDir: 0, vp: 0, brake: false,
      dist: 0, goal: idiv(idiv(cfg.speed, data.tickRate) * cfg.runTicks * cfg.goalPct, 100),
      obs: [], nextId: 1, slow: 0, boost: 0, hits: 0, brushes: 0, squeezes: 0, squeezing: false, stuck: 0,
      cross: null, commit: false, redWait: 0, turns: 0, misses: 0, filtering: false, crossN: 0, turnSlow: 0, alleyT: 0, alleys: 0, fines: 0, camI: 0,
      done: false, win: false };
    for (let i = 0; i < cfg.cars; i++) spawnOne(s, 8000 + rngInt(s, 37000), null);
    if (cfg.lights) newCross(s, DATA.cross.first);
    return s;
  },
  apply(s, cmd) {
    const ev = [];
    if (cmd.k === 'lane' && !s.done) {
      const to = Math.max(-DATA.half, Math.min(DATA.half, s.lane + cmd.dir));
      if (to === s.lane) ev.push({ k: 'bump', dir: cmd.dir });
      else {
        ev.push({ k: 'lane', from: s.lane, to });
        s.fromX = s.x; s.lane = to; s.moveT = 0; s.moveDir = cmd.dir;
      }
    }
    if (cmd.k === 'brake' && !s.done && s.brake !== !!cmd.on) { s.brake = !!cmd.on; ev.push({ k: 'brake', on: s.brake }); }
    return { events: ev };
  },
  tick(s) {
    const ev = [];
    if (s.done) return { events: ev };
    const k = s.cfg;
    s.tick++;
    if (s.slow > 0) s.slow--;
    if (s.boost > 0) s.boost--;
    if (s.turnSlow > 0) s.turnSlow--;
    if (s.moveT < k.laneTicks) { s.moveT++; s.x = smooth(s.fromX, s.lane * 1000, s.moveT, k.laneTicks); }
    else s.x = s.lane * 1000;
    // a light you were allowed through stays yours once you are this close (no slamming on the brakes at the line)
    if (s.brake) s.commit = false; // braking gives the light back to the rules: stop on yellow if you want
    else if (s.cross && !s.commit && lineGap(s) < DATA.cross.commit && mayGo(s, laneMove(s.lane))) s.commit = true;
    const red = held(s) && lineGap(s) < 3 * DATA.followGap;
    // traffic and lines cut your speed at once (they are already eased by distance); you pick it back up at `accel`,
    // and the brake sheds `brakeDecel` per tick down to a stop
    const want = playerSpeed(s);
    const vp = s.brake ? Math.max(0, Math.min(want, s.vp - DATA.brakeDecel)) : want < s.vp ? want : Math.min(want, s.vp + DATA.accel);
    s.vp = vp; s.dist += vp;
    if (vp * 10 < idiv(k.speed, DATA.tickRate) * 7) { if (red) s.redWait++; else s.stuck++; }
    if (s.cross && s.dist >= s.cross.at) { // over the line: your lane was your move
      const c = s.cross, move = laneMove(s.lane);
      const gone = move !== 0 ? s.obs.filter(o => o.dz >= 3000).map(o => ({ kind: o.kind, x: o.x, dz: o.dz, v: o.cv })) : []; // view: they carry on straight, off to the side
      if (c.alley && move === 1) { s.alleys++; s.alleyT = DATA.alleyTicks; s.goal -= routeOf(s).alley.cut; ev.push({ k: 'alley' }); }
      else if (move !== c.turn) { s.misses++; s.goal += DATA.cross.missPenalty; ev.push({ k: 'miss', want: c.turn, move }); }
      ev.push({ k: 'cross', move, at: c.at, off: c.off, gone });
      if (move !== 0) { // new street: what was ahead went straight on; the new street's traffic is already there
        s.turns++; s.turnSlow = DATA.turnTicks; s.obs = s.obs.filter(o => o.dz < 3000);
        for (let i = 0; i < k.cars; i++) spawnOne(s, 8000 + rngInt(s, 37000), ev);
      }
      newCross(s, c.at + k.crossGap); s.commit = false;
    }
    if (s.alleyT > 0) s.alleyT--;
    const cams = routeOf(s).cams;
    if (cams && s.camI < cams.length && s.dist >= cams[s.camI]) { // enforcement camera: you are in the bus lane as it fires
      if (s.lane === DATA.half) { s.fines++; ev.push({ k: 'fine' }); }
      s.camI++;

    // traffic: speed (follow, lights), move, signal, change lanes
    const ph = s.cross ? phaseAt(s).i : 0;

      const t = carSpeed(s, o, ph);
      o.cv = t < o.cv ? t : Math.min(t, o.cv + DATA.carAccel);
    }
    for (const o of s.obs) {
      o.dz += o.cv - vp;
      if (o.blink > 0) {
        o.blink--;
        if (o.blink === 0) { o.fromX = o.x; o.lane = o.to; o.moveT = 0; }
      } else if (o.v > 0 && o.moveT >= k.carLaneTicks && o.dz > 2000 && rngInt(s, 10000) < k.carChange) {
        const to = o.lane + (rngInt(s, 2) === 0 ? -1 : 1);
        if (Math.abs(to) <= DATA.half && laneFree(s, to, o.dz, DATA.kinds[o.kind].len, o)) {
          o.to = to; o.blink = k.blinkTicks;
          ev.push({ k: 'blink', id: o.id, to });
        }
      }
      if (o.moveT < k.carLaneTicks) { o.moveT++; o.x = smooth(o.fromX, o.lane * 1000, o.moveT, k.carLaneTicks); }

      } else {
        o.touch = false;

  },

// === RULES END ===

// ---- determinism: canon + FNV-1a over the integer state (PORT.md) ----
function canon(v) {
  if (v === null || typeof v === 'boolean') return String(v);
  if (typeof v === 'number') { if (!Number.isSafeInteger(v)) throw Error('canon integer required: ' + v); return String(v); }
  if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}
function fnv(str) { let h = 2166136261; for (const b of new TextEncoder().encode(str)) h = Math.imul(h ^ b, 16777619) >>> 0; return h.toString(16).padStart(8, '0'); }
function replay(log) { // {seed, knobs, cmds:[{t,k,dir}], endTick} -> {hash, events, tick}; touches no view state
  const s = RULES.init(DATA, log.seed, log.knobs);
  let i = 0, events = 0;
  while (s.tick < log.endTick && !s.done) {
    while (i < log.cmds.length && log.cmds[i].t === s.tick) events += RULES.apply(s, log.cmds[i++]).events.length;
    events += RULES.tick(s).events.length;
  }
  return { hash: fnv(canon(s)), events, tick: s.tick };
}

// ---- dev knobs (view units -> integer rule knobs) ----
const KNOBS = [ // key, label, min, max, step, default (view units), toRule
  ['camBack', '카메라 거리', 2, 14, 0.5, 9, null],
  ['speed', '내 속도', 4, 16, 0.5, 7, v => Math.round(v * 1000)],

// ---- input: SWIPES (10-24 사람 "드래그 말고 스와이프"): one flick = one action, fired the moment the finger passes SWIPE_PX.
//   sideways = one lane · down = brake pulse (BRAKE_TICKS) · up = release the brake · last 100m: flick up, speed = power ----
const SWIPE_PX = 34, BRAKE_TICKS = 40;
let swipe = null, lastFlick = null, brakeUntil = 0;

function swipeAction(dx, dy) { // shared with the keyboard/test hooks
  if (Math.abs(dx) > Math.abs(dy)) command({ k: 'lane', dir: Math.sign(dx) });
  else if (dy > 0) { command({ k: 'brake', on: true }); brakeUntil = S.tick + BRAKE_TICKS; }
  else if (S.brake) { command({ k: 'brake', on: false }); brakeUntil = 0; }
}
cv.addEventListener('pointerdown', e => {

  // pace bot: decides every `react` seconds; leaves a lane when something solid is close ahead or a car signals into it,
  // picks the adjacent lane with the longest clear run whose side is free right now.
  bot(react, runs = 10, seed = 1, plan = 20, route = 0, alley = false) {
    const out = { win: 0, hits: 0, sq: 0, stuck: 0, ticks: 0, red: 0, miss: 0, fines: 0, alleys: 0 };
    const every = Math.max(1, Math.round(react * 60));

      const sideFree = l => !s.obs.some(o => DATA.kinds[o.kind].solid && inLane(o, l) && 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen + 1600);
