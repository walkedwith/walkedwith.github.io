<!doctype html>
<html lang="ko">
<head>

<style>
  html,body{margin:0;height:100dvh;background:#1b2238;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}

  #gear{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:8px;width:44px;height:44px;border-radius:22px;border:0;background:#0008;color:#fff;font-size:22px}
  #panel{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 60px);background:#0b1020e8;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;display:none}

<body>
<canvas id="c"></canvas>
<button id="gear">⚙</button>
<div id="panel"></div>
<script>
// Speed/timing test for the seoulroute motorbike segment. Port contract: PORT.md.
// RULES = pure integer state machine (60 ticks/s, milli-units, xorshift32) -> GDScript 1:1.
// Everything below RULES END is presentation: pseudo-3D road + depth-scaled sprites, reacting to events.

const DATA = {
  version: 3,
  tickRate: 60,
  rng: { shiftA: 13, shiftB: 17, shiftC: 5 },
  half: 2,                      // lanes are -half..half (5 lanes); edge lanes are turn-only (left -half, right +half)
  playerW: 420, playerLen: 900, // milli-lanes, milli-units
  slowTicks: 96, slowFloor: 150, boostTicks: 90, boostPermille: 1150,
  followGap: 1400,              // bumper gap kept behind a solid thing in your lane
  carGap: 900, carAccel: 3,
  accel: 3, brakeDecel: 5,      // your speed rises this much per tick (milli-units/tick), and falls this much while braking
  filterPermille: 450,          // a stopped car does not block you: you ease past it on the lane line at this share of cruise     // cars keep this gap and speed back up this much per tick, so queues pull away one by one
  spawnDz: 45000, despawnBehind: 9000, spawnClear: 4000, laneClear: 1500,
  brushGap: 160,                // side gap (milli-lanes) that counts as brushing past
  // Intersections: one stop line at a time. Your lane at the line is your move (left lane turns left, right lane turns
  // right, middle goes straight); the order card says which move it wants. Wrong move = detour added to the goal.
  cross: { first: 60000, rand: 30000, missPenalty: 35000, commit: 2500, turnPick: [40, 30, 30] }, // straight/right/left of 100
  phases: [ { k: 'G', t: 240 }, { k: 'Y', t: 45 }, { k: 'L', t: 120 }, { k: 'R', t: 135 } ], // straight green, yellow, left arrow, red
  kinds: [                      // w milli-lanes, len milli-units, v milli-units/s; pick = weight out of 100
    { id: 'sedan', w: 800, len: 1700, solid: true, car: true, vMin: 2000, vMax: 5000, pick: 60 },
    { id: 'bus', w: 920, len: 3000, solid: true, car: true, vMin: 1500, vMax: 3500, pick: 15, curb: true, stopPct: 40 },
    { id: 'manhole', w: 500, len: 500, solid: false, pick: 6 },
    { id: 'cone', w: 300, len: 400, solid: true, pick: 8 },
    { id: 'puddle', w: 650, len: 700, solid: false, pick: 6 },
    { id: 'barrier', w: 850, len: 500, solid: true, pick: 5 },
  ],
  knobs: {                      // integer rule tunables; the gear panel edits these
    speed: 7000,                // your cruising speed, milli-units per second (10-24 phone: 9 still felt fast)
    cars: 15,                   // things kept ahead of you
    carChange: 12,              // per 10000 per tick, per car: chance to start signalling a lane change
    blinkTicks: 48,             // turn signal before a car moves over
    carLaneTicks: 30, laneTicks: 9,
    hitbox: 800,                // per-mille of sprite width that collides
    runTicks: 2700,             // time limit
    goalPct: 75,                // goal distance = cruising nonstop for this % of the limit
    lights: 1, crossGap: 110000, // intersections on/off, distance between stop lines
  },
};

// === RULES BEGIN ===
// Integers only. idiv truncates toward zero like GDScript int "/".
function idiv(a, b) { return Math.trunc(a / b); }
function rngInt(s, n) {
  const r = DATA.rng; let x = s.rng;
  x ^= x << r.shiftA; x >>>= 0; x ^= x >>> r.shiftB; x ^= x << r.shiftC; x >>>= 0;
  s.rng = x; return x % n;
}
function smooth(from, to, t, total) { // smoothstep in per-mille, integer
  const u = idiv(t * 1000, total), e = idiv(u * u * (3000 - 2 * u), 1000000);
  return from + idiv((to - from) * e, 1000);
}
function xOverlap(s, o) { // |dx| < (w + playerW)/2 * hitbox/1000
  return 2000 * Math.abs(s.x - o.x) < (DATA.kinds[o.kind].w + DATA.playerW) * s.cfg.hitbox;
}
function zOverlap(o) { return 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen; }
function laneFree(s, lane, dz, len, skip) {
  for (const o of s.obs) {
    if (o === skip || (o.lane !== lane && o.to !== lane)) continue;
    if (2 * Math.abs(o.dz - dz) < len + DATA.kinds[o.kind].len + 2 * DATA.laneClear) return false;
  }
  return true;
}
function spawnOne(s, dz, ev) {
  let r = rngInt(s, 100), kind = 0;
  while (r >= DATA.kinds[kind].pick) { r -= DATA.kinds[kind].pick; kind++; }
  const kd = DATA.kinds[kind];
  const lane = kd.curb ? (rngInt(s, 2) === 0 ? -DATA.half : DATA.half) : rngInt(s, 2 * DATA.half + 1) - DATA.half;
  for (const o of s.obs) if (o.lane === lane && Math.abs(o.dz - dz) < DATA.spawnClear) return;
  if (!kd.car && s.cross && Math.abs(s.dist + dz - s.cross.at - 5000) < 8000) return; // keep road junk off the crossing
  let v = 0;
  if (kd.car) {
    v = idiv(kd.vMin + rngInt(s, kd.vMax - kd.vMin + 1), DATA.tickRate);
    if (kd.stopPct && rngInt(s, 100) < kd.stopPct) v = 0; // bus waiting at a stop
  }
  const o = { id: s.nextId++, kind, lane, to: lane, x: lane * 1000, fromX: lane * 1000, moveT: s.cfg.carLaneTicks,
    dz, v, cv: v, blink: 0, touch: false, brushed: false, pass: false };
  s.obs.push(o);
  if (ev) ev.push({ k: 'spawn', id: o.id, kind, lane });
}
const CYCLE = DATA.phases.reduce((a, p) => a + p.t, 0);
function phaseAt(s) { // {i, left}: current light phase of the next crossing and ticks until it changes
  let t = (s.tick + s.cross.off) % CYCLE, i = 0;
  while (t >= DATA.phases[i].t) { t -= DATA.phases[i].t; i++; }
  return { i, left: DATA.phases[i].t - t };
}
function laneMove(lane) { return lane === DATA.half ? 1 : lane === -DATA.half ? -1 : 0; } // 1 right turn, -1 left turn, 0 straight
function mayGo(s, move) { // right turns go on red; left turns wait for the arrow
  const k = DATA.phases[phaseAt(s).i].k;
  return move === 1 || (move === -1 ? k === 'L' : k === 'G' || k === 'Y');
}
function newCross(s, at) {
  const p = DATA.cross.turnPick, r = rngInt(s, 100);
  const turn = r < p[0] ? 0 : r < p[0] + p[1] ? 1 : -1;
  s.cross = { at: at + rngInt(s, DATA.cross.rand), turn, off: rngInt(s, CYCLE) };
}
function lineGap(s) { return s.cross ? s.cross.at - s.dist - idiv(DATA.playerLen, 2) : 1 << 30; } // your nose to the stop line
function held(s) { return !!s.cross && !s.commit && lineGap(s) > 0 && !mayGo(s, laneMove(s.lane)); }
function follow(target, aheadV, gap, keep) { // speed behind something moving at aheadV `gap` ahead: eases in from 3*keep, stops at keep
  if (gap >= 3 * keep) return target;
  if (gap <= keep) return Math.min(target, idiv(aheadV * Math.max(0, gap), keep));
  return Math.min(target, aheadV + idiv((gap - keep) * target, 2 * keep));
}
function playerSpeed(s) { // milli-units per tick: cruise, eased down behind the nearest solid thing in your path or a held stop line
  const k = s.cfg;
  let target = idiv(k.speed, DATA.tickRate);
  if (s.slow > 0) target = idiv(target * (DATA.slowFloor + idiv((1000 - DATA.slowFloor) * (DATA.slowTicks - s.slow), DATA.slowTicks)), 1000);
  if (s.boost > 0) target = idiv(target * DATA.boostPermille, 1000);
  for (const o of s.obs) {
    const kd = DATA.kinds[o.kind];
    if (!kd.solid || o.dz <= 0 || !xOverlap(s, o)) continue;
    const g = o.dz - idiv(kd.len + DATA.playerLen, 2);
    if ((kd.car && o.cv === 0) || o.pass) { if (g < DATA.followGap) target = Math.min(target, idiv(idiv(k.speed, DATA.tickRate) * DATA.filterPermille, 1000)); }
    else target = follow(target, o.cv, g, DATA.followGap);
  }
  if (held(s)) target = follow(target, 0, lineGap(s), DATA.followGap);
  return target;
}
function carSpeed(s, o, ph) { // target for one car: own pace, behind whatever is ahead in its lane (you included), held at the line
  const kd = DATA.kinds[o.kind];
  let t = o.v;
  for (const p of s.obs) {
    if (p === o || !DATA.kinds[p.kind].solid || p.dz <= o.dz || (p.lane !== o.lane && p.to !== o.lane)) continue;
    t = follow(t, p.cv, p.dz - o.dz - idiv(kd.len + DATA.kinds[p.kind].len, 2), DATA.carGap);
  }
  if (o.dz < 0 && s.lane === o.lane) t = follow(t, s.vp, -o.dz - idiv(kd.len + DATA.playerLen, 2), DATA.carGap);
  if (s.cross) {
    const g = s.cross.at - s.dist - o.dz - idiv(kd.len, 2), mv = laneMove(o.lane), pk = DATA.phases[ph].k;
    const go = mv === 1 || (mv === -1 ? pk === 'L' : pk === 'G' || (pk === 'Y' && g < DATA.cross.commit));
    if (g > 0 && !go) t = follow(t, 0, g, DATA.carGap);
  }
  return t;
}
const RULES = {
  init(data, seed, knobs) {
    const cfg = Object.assign({}, data.knobs, knobs || {});
    const s = { v: data.version, tick: 0, rng: (seed >>> 0) || 1, cfg,
      lane: 0, fromX: 0, x: 0, moveT: cfg.laneTicks, moveDir: 0, vp: 0, brake: false,
      dist: 0, goal: idiv(idiv(cfg.speed, data.tickRate) * cfg.runTicks * cfg.goalPct, 100),
      obs: [], nextId: 1, slow: 0, boost: 0, hits: 0, brushes: 0, squeezes: 0, squeezing: false, stuck: 0,
      cross: null, commit: false, redWait: 0, turns: 0, misses: 0, filtering: false,
      done: false, win: false };
    for (let i = 0; i < cfg.cars; i++) spawnOne(s, 8000 + rngInt(s, 37000), null);
    if (cfg.lights) newCross(s, DATA.cross.first);
    return s;
  },
  apply(s, cmd) {
    const ev = [];
    if (cmd.k === 'lane' && !s.done) {
      const to = Math.max(-DATA.half, Math.min(DATA.half, s.lane + cmd.dir));
      if (to === s.lane) ev.push({ k: 'bump', dir: cmd.dir });
      else {
        ev.push({ k: 'lane', from: s.lane, to });
        s.fromX = s.x; s.lane = to; s.moveT = 0; s.moveDir = cmd.dir;
      }
    }
    if (cmd.k === 'brake' && !s.done && s.brake !== !!cmd.on) { s.brake = !!cmd.on; ev.push({ k: 'brake', on: s.brake }); }
    return { events: ev };
  },
  tick(s) {
    const ev = [];
    if (s.done) return { events: ev };
    const k = s.cfg;
    s.tick++;
    if (s.slow > 0) s.slow--;
    if (s.boost > 0) s.boost--;
    if (s.moveT < k.laneTicks) { s.moveT++; s.x = smooth(s.fromX, s.lane * 1000, s.moveT, k.laneTicks); }
    else s.x = s.lane * 1000;
    // a light you were allowed through stays yours once you are this close (no slamming on the brakes at the line)
    if (s.brake) s.commit = false; // braking gives the light back to the rules: stop on yellow if you want
    else if (s.cross && !s.commit && lineGap(s) < DATA.cross.commit && mayGo(s, laneMove(s.lane))) s.commit = true;
    const red = held(s) && lineGap(s) < 3 * DATA.followGap;
    // traffic and lines cut your speed at once (they are already eased by distance); you pick it back up at `accel`,
    // and the brake sheds `brakeDecel` per tick down to a stop
    const want = playerSpeed(s);
    const vp = s.brake ? Math.max(0, Math.min(want, s.vp - DATA.brakeDecel)) : want < s.vp ? want : Math.min(want, s.vp + DATA.accel);
    s.vp = vp; s.dist += vp;
    if (vp * 10 < idiv(k.speed, DATA.tickRate) * 7) { if (red) s.redWait++; else s.stuck++; }
    if (s.cross && s.dist >= s.cross.at) { // over the line: your lane was your move
      const c = s.cross, move = laneMove(s.lane);
      if (move !== c.turn) { s.misses++; s.goal += DATA.cross.missPenalty; ev.push({ k: 'miss', want: c.turn, move }); }
      ev.push({ k: 'cross', move, at: c.at, off: c.off });
      if (move !== 0) { // new street: what was ahead went straight on; the new street's traffic is already there
        s.turns++; s.obs = s.obs.filter(o => o.dz < 3000);
        for (let i = 0; i < k.cars; i++) spawnOne(s, 8000 + rngInt(s, 37000), ev);
      }
      newCross(s, c.at + k.crossGap); s.commit = false;
    }
    // traffic: speed (follow, lights), move, signal, change lanes
    const ph = s.cross ? phaseAt(s).i : 0;
    for (const o of s.obs) {
      const t = carSpeed(s, o, ph);
      o.cv = t < o.cv ? t : Math.min(t, o.cv + DATA.carAccel);
    }
    for (const o of s.obs) {
      o.dz += o.cv - vp;
      if (o.blink > 0) {
        o.blink--;
        if (o.blink === 0) { o.fromX = o.x; o.lane = o.to; o.moveT = 0; }
      } else if (o.v > 0 && o.moveT >= k.carLaneTicks && o.dz > 2000 && rngInt(s, 10000) < k.carChange) {
        const to = o.lane + (rngInt(s, 2) === 0 ? -1 : 1);
        if (Math.abs(to) <= DATA.half && laneFree(s, to, o.dz, DATA.kinds[o.kind].len, o)) {
          o.to = to; o.blink = k.blinkTicks;
          ev.push({ k: 'blink', id: o.id, to });
        }
      }
      if (o.moveT < k.carLaneTicks) { o.moveT++; o.x = smooth(o.fromX, o.lane * 1000, o.moveT, k.carLaneTicks); }
    }
    // contact with you: crash (solid), splash (puddle/manhole), brush past (close side gap), squeeze (cars both sides)
    let left = false, right = false;
    s.filtering = false;
    for (const o of s.obs) {
      const kd = DATA.kinds[o.kind], zo = zOverlap(o), xo = xOverlap(s, o);
      if (zo && xo && kd.car && (o.cv === 0 || o.pass)) { o.pass = true; s.filtering = true; continue; } // riding the lane line past a stopped car
      o.pass = false;
      if (zo && xo) {
        if (!o.touch) {
          o.touch = true;
          if (kd.solid) { s.hits++; s.slow = DATA.slowTicks; ev.push({ k: 'hit', id: o.id }); }
          else { s.slow = Math.max(s.slow, idiv(DATA.slowTicks, 3)); ev.push({ k: 'splash', id: o.id }); }
        }
      } else {
        o.touch = false;
        if (zo && kd.car) {
          if (o.x < s.x) left = true; else right = true;
          const side = 2 * Math.abs(s.x - o.x) - kd.w - DATA.playerW;
          if (!o.brushed && side < 2 * DATA.brushGap) { o.brushed = true; s.brushes++; ev.push({ k: 'brush', id: o.id }); }
        }
      }
    }
    if (left && right && !s.squeezing) { s.squeezes++; s.boost = DATA.boostTicks; ev.push({ k: 'squeeze' }); }
    s.squeezing = left && right;
    s.obs = s.obs.filter(o => o.dz > -DATA.despawnBehind && o.dz < DATA.spawnDz + 20000);
    let ahead = 0;
    for (const o of s.obs) if (o.dz > 0) ahead++;
    if (ahead < k.cars) spawnOne(s, DATA.spawnDz + rngInt(s, 10000), ev);
    if (s.dist >= s.goal || s.tick >= k.runTicks) {
      s.done = true; s.win = s.dist >= s.goal;
      ev.push({ k: 'done', win: s.win, tick: s.tick });
    }
    return { events: ev };
  },
};
// === RULES END ===

// ---- determinism: canon + FNV-1a over the integer state (PORT.md) ----
function canon(v) {
  if (v === null || typeof v === 'boolean') return String(v);
  if (typeof v === 'number') { if (!Number.isSafeInteger(v)) throw Error('canon integer required: ' + v); return String(v); }
  if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}
function fnv(str) { let h = 2166136261; for (const b of new TextEncoder().encode(str)) h = Math.imul(h ^ b, 16777619) >>> 0; return h.toString(16).padStart(8, '0'); }
function replay(log) { // {seed, knobs, cmds:[{t,k,dir}], endTick} -> {hash, events, tick}; touches no view state
  const s = RULES.init(DATA, log.seed, log.knobs);
  let i = 0, events = 0;
  while (s.tick < log.endTick && !s.done) {
    while (i < log.cmds.length && log.cmds[i].t === s.tick) events += RULES.apply(s, log.cmds[i++]).events.length;
    events += RULES.tick(s).events.length;
  }
  return { hash: fnv(canon(s)), events, tick: s.tick };
}

// ---- dev knobs (view units -> integer rule knobs) ----
const KNOBS = [ // key, label, min, max, step, default (view units), toRule
  ['camBack', '카메라 거리', 2, 14, 0.5, 9, null],
  ['speed', '내 속도', 4, 16, 0.5, 7, v => Math.round(v * 1000)],
  ['cars', '차 수', 3, 20, 1, 15, v => v],
  ['carChange', '끼어들기 빈도', 0, 40, 1, 12, v => v],
  ['blinkTicks', '깜빡이 초', 0.3, 1.5, 0.05, 0.8, v => Math.round(v * 60)],
  ['laneTicks', '차선 이동 ms', 80, 300, 10, 150, v => Math.max(1, Math.round(v * 60 / 1000))],
  ['hitbox', '판정 크기', 0.5, 1.0, 0.05, 0.8, v => Math.round(v * 1000)],
  ['runTicks', '제한 시간 초', 20, 90, 5, 45, v => v * 60],
  ['goalPct', '목표 거리 %', 50, 100, 1, 75, v => v],
  ['lights', '신호등 켬', 0, 1, 1, 1, v => v],
  ['crossGap', '교차로 간격', 60, 240, 10, 110, v => v * 1000],
];
const KNOB_KEY = 'proto_seoulroute_knobs7'; // bumped with v3 defaults so old phone values do not override them
const V = {};
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KNOB_KEY) || '{}'); } catch (e) {}
const panel = document.getElementById('panel');
for (const [k, label, min, max, step, def] of KNOBS) {
  V[k] = saved[k] ?? def;
  const row = document.createElement('label');
  row.innerHTML = `<span class="n">${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${V[k]}"><span class="v">${V[k]}</span>`;
  const input = row.querySelector('input'), out = row.querySelector('.v');
  input.oninput = () => {
    V[k] = +input.value; out.textContent = input.value;
    try { localStorage.setItem(KNOB_KEY, JSON.stringify(V)); } catch (e) {}
  };
  panel.appendChild(row);
}
document.getElementById('gear').onclick = () => { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; };
const ruleKnobs = () => Object.fromEntries(KNOBS.filter(r => r[6]).map(r => [r[0], r[6](V[r[0]])]));

// ---- presentation ----
const W = 720, HORIZON = 457, ROAD_TEX_W = 848 / 160, TILE_LEN = 20, CELL = 256, LANE_PX = 128; // road5.png: 5 lanes x 160px + curbs
let H = 1280, PLAYER_Y = 1090, CAM_H = 3.63;
const zPlayer = () => V.camBack;                                    // view-only camera distance
const focal = () => zPlayer() * (PLAYER_Y - HORIZON) / CAM_H;
const PROP_CELL = { sedan: 0, bus: 1, manhole: 2, cone: 3, puddle: 4, barrier: 5 };
// feel (view only, rules untouched): px/pv = drawn x spring that overshoots the lane and settles; tilt/tv = lean spring;
// bx/bv = the box on the rack lagging the bike; stop = hit-stop seconds; gust = side cars shiver after a squeeze
const FX = { pops: [], shake: 0, flash: 0, flashCol: '#fff', bend: null, filt: 0, age: {}, px: 0, pv: 0, tilt: 0, tv: 0, bx: 0, bv: 0, stop: 0, gust: 0 };

// ---- run (state + command log for replay) ----
let S, LOG;
function reset(seed = (Date.now() >>> 0)) {
  S = RULES.init(DATA, seed, ruleKnobs());
  LOG = { seed: (seed >>> 0) || 1, knobs: ruleKnobs(), cmds: [], endTick: 0 }; // init already advanced S.rng
  FX.pops = []; FX.shake = 0; FX.flash = 0; FX.bend = null; FX.lastCross = null; FX.age = {};
  FX.px = 0; FX.pv = 0; FX.tilt = 0; FX.tv = 0; FX.bx = 0; FX.bv = 0; FX.stop = 0; FX.gust = 0;
}
function command(cmd) {
  if (S.done) return;
  LOG.cmds.push(Object.assign({ t: S.tick }, cmd));
  onEvents(RULES.apply(S, cmd).events);
}

const img = src => { const i = new Image(); i.src = src; return i; };
const IMG = { road: img('art/sprites/road5.png'), props: img('art/sprites/props.png'), hero: img('art/sprites/boy.png') };
// Area themes (view only): backdrop + roadside sheet (4x2 cells of 256x512) + placements.
// x in lanes from road center (signed unless both), w in lanes, period/offset in world units.
const AREAS = {
  street: { back: 'art/sprites/backdrop.png', sheet: 'art/sprites/roadside.png', side: [
    { cell: 0, x: 3.1, w: 1.0, period: 8, off: 0, both: true },     // streetlight
    { cell: 7, x: 3.0, w: 1.6, period: 3, off: 1.5, both: true },   // hedge + guardrail

  const leanIn = S.moveT < S.cfg.laneTicks ? S.moveDir : 0;
  [FX.tilt, FX.tv] = spring(FX.tilt, FX.tv, leanIn * 0.8 + FX.pv * 0.35, 220, 12, dt); // lean: into the move, then recoil with the overshoot
  [FX.bx, FX.bv] = spring(FX.bx, FX.bv, FX.px, 90, 7, dt);                   // box on the rack: lags, swings, keeps swinging a beat
  const p = project(zPlayer()), x = W / 2 + FX.px * p.s, foot = PLAYER_Y + Math.sin(S.tick / 2) * 1.5;
  let cell = 0;
  if (S.slow > DATA.slowTicks / 2) cell = 3;
  else if (S.moveT < S.cfg.laneTicks) cell = S.moveDir < 0 ? 1 : 2;
  else if (bendAmt() > 0.35) cell = FX.bend.dir < 0 ? 1 : 2; // lean into the turn
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, PLAYER_Y, 0.3 * p.s, 0.06 * p.s, 0, 0, Math.PI * 2); ctx.fill();
  if (!IMG.hero.complete || !IMG.hero.naturalWidth) return;
  // the sprite in two slices around the foot: wheels/bike (bottom 45%) stay put, rider+box (top 55%) tilt and sway
  const b = bbox(IMG.hero, cell, CELL, CELL), k = 0.62 * p.s / b.w, left = x - b.w * k / 2, top = foot - b.h * k;
  const split = Math.round(b.h * 0.45), sx = (cell % 4) * CELL + b.x, sy = Math.floor(cell / 4) * CELL + b.y;
  const sway = (FX.bx - FX.px) * p.s * 0.6, tilt = Math.max(-0.35, Math.min(0.35, FX.tilt * 0.22));
  ctx.save(); ctx.translate(x, foot); ctx.rotate(tilt); ctx.translate(-x, -foot);
  ctx.drawImage(IMG.hero, sx, sy + b.h - split, b.w, split, left, top + (b.h - split) * k, b.w * k, split * k);
  ctx.drawImage(IMG.hero, sx, sy, b.w, b.h - split, left + sway, top, b.w * k, (b.h - split) * k);
  ctx.restore();
  if (S.brake) glow(x, PLAYER_Y - 0.2 * p.s, 0.07 * p.s, '#ff2a2a', 0.95); // tail lamp
}

function bar(x, y, w, h, f, col) {
  ctx.fillStyle = '#0b1020cc'; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x + 3, y + 3, Math.max(0, (w - 6) * f), h - 6, (h - 6) / 2); ctx.fill();
}
function drawHud(v) {
  const limit = S.cfg.runTicks;
  ctx.fillStyle = '#0b1020b0'; ctx.beginPath(); ctx.roundRect(20, 112, 670, S.cross ? 222 : 152, 22); ctx.fill(); // HUD backing over bright skylines
  ctx.textAlign = 'left'; ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('남은 시간', 40, 152); bar(170, 130, 500, 30, Math.max(0, 1 - S.tick / limit), limit - S.tick < 360 ? '#ff5a4a' : '#ffb340');
  ctx.fillText('남은 거리', 40, 200); bar(170, 178, 500, 30, Math.max(0, 1 - S.dist / S.goal), '#5ad1ff');
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`속도 ${v.toFixed(1)}   틈새 ${S.squeezes}   쿵 ${S.hits}   막힘 ${(S.stuck / 60).toFixed(1)}초`, 40, 248);
  if (S.cross) { // navigation: the move the order wants at the next line, and that line's light
    const c = S.cross, m = Math.max(0, Math.round((c.at - S.dist) / 1000 * 2.5)), ok = laneMove(S.lane) === c.turn;
    ctx.font = 'bold 38px sans-serif'; ctx.fillStyle = ok ? '#7dffb0' : '#ffd84a';
    ctx.fillText(`${['↰', '↑', '↱'][c.turn + 1]} ${['좌회전', '직진', '우회전'][c.turn + 1]} ${m}m`, 40, 306);
    ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#c9d4ff';
    ctx.fillText(held(S) && S.vp === 0 ? '신호 대기' : ok ? '차선 OK' : c.turn ? `${c.turn > 0 ? '맨 오른쪽' : '맨 왼쪽'} 차선으로` : '가운데 세 차선으로', 330, 302);
    const ph = phaseAt(S), key = DATA.phases[ph.i].k, col = ['#ff3b30', '#ffc400', '#2bff88'];
    const lit = { G: [2], Y: [1], L: [0, 2], R: [0] }[key];
    ctx.fillStyle = '#05070d'; ctx.beginPath(); ctx.roundRect(536, 274, 142, 44, 22); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const x = 560 + i * 42, on = lit.includes(i);
      if (on && key === 'L' && i === 2) { ctx.fillStyle = col[2]; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('←', x, 307); ctx.textAlign = 'left'; }
      else glow(x, 296, 14, on ? col[i] : '#2a2d38');
    }
    ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
    ctx.fillText(`${Math.ceil(ph.left / 60)}`, 528, 304); ctx.textAlign = 'left';
  }
  if (S.tick < 300 && !S.done) { // first seconds: how to steer
    ctx.globalAlpha = Math.min(1, (300 - S.tick) / 60); ctx.textAlign = 'center'; ctx.font = 'bold 28px sans-serif';
    ctx.strokeStyle = '#0b1020'; ctx.lineWidth = 6; ctx.fillStyle = '#fff';
    const t = '← → 밀어서 차선   ·   ↓ 누르고 있으면 브레이크';
    ctx.strokeText(t, W / 2, H - 60); ctx.fillText(t, W / 2, H - 60); ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  if (S.done) {
    ctx.fillStyle = '#0b1020e0'; ctx.beginPath(); ctx.roundRect(70, 420, 580, 420, 30); ctx.fill();
    ctx.fillStyle = S.win ? '#ffd84a' : '#ff6a5a'; ctx.textAlign = 'center'; ctx.font = 'bold 54px sans-serif';
    ctx.fillText(S.win ? `도착 ${(S.tick / 60).toFixed(1)}초` : '시간 초과', W / 2, 500);
    ctx.fillStyle = '#fff'; ctx.font = '30px sans-serif';
    ctx.fillText(`막힘 ${(S.stuck / 60).toFixed(1)}초 · 신호 대기 ${(S.redWait / 60).toFixed(1)}초`, W / 2, 570);
    ctx.fillText(`틈새 ${S.squeezes} · 스침 ${S.brushes} · 쿵 ${S.hits}`, W / 2, 620);
    if (S.cfg.lights) ctx.fillText(`회전 ${S.turns} · 길 잘못 듦 ${S.misses}`, W / 2, 670);
    ctx.fillStyle = '#9fb3ff'; ctx.fillText('탭해서 다시', W / 2, 780);
  }
}

// ---- input: lane change fires mid-swipe, not on release ----
let anchor = null, anchorY = 0;
cv.addEventListener('pointerdown', e => {
  audioOn();
  if (S.done) { reset(); if (engGain) engGain.gain.value = 0.05; return; }
  anchor = e.clientX; anchorY = e.clientY;
});
cv.addEventListener('pointermove', e => { // sideways = lane change; held below where the finger landed = brake
  if (anchor === null) return;
  const dx = e.clientX - anchor;
  if (Math.abs(dx) > 28) { command({ k: 'lane', dir: Math.sign(dx) }); anchor = e.clientX; }
  const dy = e.clientY - anchorY;
  if (dy > 36 && !S.brake) command({ k: 'brake', on: true });
  if (dy < 18 && S.brake) command({ k: 'brake', on: false });
});
addEventListener('pointerup', () => { anchor = null; if (S.brake) command({ k: 'brake', on: false }); });
addEventListener('pointercancel', () => { anchor = null; if (S.brake) command({ k: 'brake', on: false }); });
addEventListener('keydown', e => {
  audioOn();
  if (e.key === 'ArrowLeft') command({ k: 'lane', dir: -1 });
  if (e.key === 'ArrowRight') command({ k: 'lane', dir: 1 });
  if (e.key === 'ArrowDown' && !S.brake) command({ k: 'brake', on: true });
  if ((e.key === ' ' || e.key === 'Enter') && S.done) reset();
});
addEventListener('keyup', e => { if (e.key === 'ArrowDown' && S.brake) command({ k: 'brake', on: false }); });

// ---- fixed 60-tick loop ----
reset();
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (FX.stop > 0) FX.stop -= dt; // hit-stop: the world holds for a beat (ticks resume after; replay unaffected)
  else if (!window.__pause) {
    acc += dt;
    while (acc >= 1 / 60) { acc -= 1 / 60; onEvents(RULES.tick(S).events); }
  }
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- test hooks ----
window.T = {
  state: () => S, log: () => LOG, hash: () => fnv(canon(S)), replay, reset, command,
  // pace bot: decides every `react` seconds; leaves a lane when something solid is close ahead or a car signals into it,
  // picks the adjacent lane with the longest clear run whose side is free right now.
  bot(react, runs = 10, seed = 1, plan = 20) {
    const out = { win: 0, hits: 0, sq: 0, stuck: 0, ticks: 0, red: 0, miss: 0 };
    const every = Math.max(1, Math.round(react * 60));
    for (let r = 0; r < runs; r++) {
      const s = RULES.init(DATA, seed + r, ruleKnobs());
      const inLane = (o, l) => o.lane === l || o.to === l;
      const clearAhead = l => Math.min(99999, ...s.obs.filter(o => DATA.kinds[o.kind].solid && inLane(o, l) && o.dz > 0).map(o => o.dz));
      const sideFree = l => !s.obs.some(o => DATA.kinds[o.kind].solid && inLane(o, l) && 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen + 1600);
      // within `plan` of a stop line only the lanes that make the wanted move count; get into one, then weave inside them
      const okLane = l => !s.cross || s.cross.at - s.dist > plan * 1000 || laneMove(l) === s.cross.turn;
      while (!s.done) {
        if (s.tick % every === 0 && s.moveT >= s.cfg.laneTicks) {
          if (!okLane(s.lane)) {
            const dir = s.cross.turn ? s.cross.turn : -Math.sign(s.lane);
            if (sideFree(s.lane + dir)) RULES.apply(s, { k: 'lane', dir });
          } else if (clearAhead(s.lane) < 6000) {
            const opts = [s.lane - 1, s.lane + 1].filter(l => Math.abs(l) <= DATA.half && okLane(l) && sideFree(l)).sort((a, b) => clearAhead(b) - clearAhead(a));
            if (opts.length && clearAhead(opts[0]) > clearAhead(s.lane)) RULES.apply(s, { k: 'lane', dir: Math.sign(opts[0] - s.lane) });
          }
        }
        RULES.tick(s);
      }
      out.win += s.win ? 1 : 0; out.hits += s.hits; out.sq += s.squeezes; out.stuck += s.stuck; out.ticks += s.tick;
      out.red += s.redWait; out.miss += s.misses;
    }
    const n = runs;
    return `${react}s 승${out.win}/${n} 쿵${(out.hits / n).toFixed(1)} 틈새${(out.sq / n).toFixed(1)} 막힘${(out.stuck / n / 60).toFixed(1)}초 신호${(out.red / n / 60).toFixed(1)}초 잘못${(out.miss / n).toFixed(1)} ${(out.ticks / n / 60).toFixed(1)}초`;
  },
};
</script>
