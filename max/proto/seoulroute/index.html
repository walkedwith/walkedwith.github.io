<body>
<canvas id="c"></canvas>
<button id="gear">⚙</button>
<div id="panel"></div>
<script>
// Speed/timing test for the seoulroute motorbike segment. Port contract: PORT.md.
// RULES = pure integer state machine (60 ticks/s, milli-units, xorshift32) -> GDScript 1:1.
// Everything below RULES END is presentation: pseudo-3D road + depth-scaled sprites, reacting to events.

const DATA = {
  version: 2,
  tickRate: 60,
  rng: { shiftA: 13, shiftB: 17, shiftC: 5 },
  half: 2,                      // lanes are -half..half (5 lanes)
  playerW: 420, playerLen: 900, // milli-lanes, milli-units
  slowTicks: 96, slowFloor: 150, boostTicks: 90, boostPermille: 1150,
  followGap: 1400,              // bumper gap kept behind a solid thing in your lane
  spawnDz: 45000, despawnBehind: 9000, spawnClear: 4000, laneClear: 1500,
  brushGap: 160,                // side gap (milli-lanes) that counts as brushing past
  kinds: [                      // w milli-lanes, len milli-units, v milli-units/s; pick = weight out of 100
    { id: 'sedan', w: 800, len: 1700, solid: true, car: true, vMin: 3000, vMax: 7000, pick: 60 },
    { id: 'bus', w: 920, len: 3000, solid: true, car: true, vMin: 2500, vMax: 5000, pick: 15, curb: true, stopPct: 40 },
    { id: 'manhole', w: 500, len: 500, solid: false, pick: 6 },
    { id: 'cone', w: 300, len: 400, solid: true, pick: 8 },
    { id: 'puddle', w: 650, len: 700, solid: false, pick: 6 },
    { id: 'barrier', w: 850, len: 500, solid: true, pick: 5 },
  ],
  knobs: {                      // integer rule tunables; the gear panel edits these
    speed: 9000,                // your cruising speed, milli-units per second
    cars: 15,                   // things kept ahead of you (10-24 bot: idle never wins, weaving wins 7~9/10)
    carChange: 12,              // per 10000 per tick, per car: chance to start signalling a lane change
    blinkTicks: 48,             // turn signal before a car moves over
    carLaneTicks: 30, laneTicks: 9,
    hitbox: 800,                // per-mille of sprite width that collides
    runTicks: 2400,             // time limit
    goalPct: 90,                // goal distance = cruising nonstop for this % of the limit
  },
};

// === RULES BEGIN ===
// Integers only. idiv truncates toward zero like GDScript int "/".
function idiv(a, b) { return Math.trunc(a / b); }
function rngInt(s, n) {
  const r = DATA.rng; let x = s.rng;
  x ^= x << r.shiftA; x >>>= 0; x ^= x >>> r.shiftB; x ^= x << r.shiftC; x >>>= 0;
  s.rng = x; return x % n;
}
function smooth(from, to, t, total) { // smoothstep in per-mille, integer
  const u = idiv(t * 1000, total), e = idiv(u * u * (3000 - 2 * u), 1000000);
  return from + idiv((to - from) * e, 1000);
}
function xOverlap(s, o) { // |dx| < (w + playerW)/2 * hitbox/1000
  return 2000 * Math.abs(s.x - o.x) < (DATA.kinds[o.kind].w + DATA.playerW) * s.cfg.hitbox;
}
function zOverlap(o) { return 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen; }
function laneFree(s, lane, dz, len, skip) {
  for (const o of s.obs) {
    if (o === skip || (o.lane !== lane && o.to !== lane)) continue;
    if (2 * Math.abs(o.dz - dz) < len + DATA.kinds[o.kind].len + 2 * DATA.laneClear) return false;
  }
  return true;
}
function spawnOne(s, dz, ev) {
  let r = rngInt(s, 100), kind = 0;
  while (r >= DATA.kinds[kind].pick) { r -= DATA.kinds[kind].pick; kind++; }
  const kd = DATA.kinds[kind];
  const lane = kd.curb ? (rngInt(s, 2) === 0 ? -DATA.half : DATA.half) : rngInt(s, 2 * DATA.half + 1) - DATA.half;
  for (const o of s.obs) if (o.lane === lane && Math.abs(o.dz - dz) < DATA.spawnClear) return;
  let v = 0;
  if (kd.car) {
    v = idiv(kd.vMin + rngInt(s, kd.vMax - kd.vMin + 1), DATA.tickRate);
    if (kd.stopPct && rngInt(s, 100) < kd.stopPct) v = 0; // bus waiting at a stop
  }
  const o = { id: s.nextId++, kind, lane, to: lane, x: lane * 1000, fromX: lane * 1000, moveT: s.cfg.carLaneTicks,
    dz, v, blink: 0, touch: false, brushed: false };
  s.obs.push(o);
  if (ev) ev.push({ k: 'spawn', id: o.id, kind, lane });
}
function playerSpeed(s) { // milli-units per tick: cruise, eased down behind the nearest solid thing in your path
  const k = s.cfg;
  let target = idiv(k.speed, DATA.tickRate);
  if (s.slow > 0) target = idiv(target * (DATA.slowFloor + idiv((1000 - DATA.slowFloor) * (DATA.slowTicks - s.slow), DATA.slowTicks)), 1000);
  if (s.boost > 0) target = idiv(target * DATA.boostPermille, 1000);
  let ahead = null, gap = 0;
  for (const o of s.obs) {
    const kd = DATA.kinds[o.kind];
    if (!kd.solid || o.dz <= 0 || !xOverlap(s, o)) continue;
    const g = o.dz - idiv(kd.len + DATA.playerLen, 2);
    if (ahead === null || g < gap) { ahead = o; gap = g; }
  }
  if (ahead === null || gap >= 3 * DATA.followGap) return target;
  if (gap <= DATA.followGap) return Math.min(target, idiv(ahead.v * Math.max(0, gap), DATA.followGap));
  return Math.min(target, ahead.v + idiv((gap - DATA.followGap) * target, 2 * DATA.followGap));
}
const RULES = {
  init(data, seed, knobs) {
    const cfg = Object.assign({}, data.knobs, knobs || {});
    const s = { v: data.version, tick: 0, rng: (seed >>> 0) || 1, cfg,
      lane: 0, fromX: 0, x: 0, moveT: cfg.laneTicks, moveDir: 0, vp: 0,
      dist: 0, goal: idiv(idiv(cfg.speed, data.tickRate) * cfg.runTicks * cfg.goalPct, 100),
      obs: [], nextId: 1, slow: 0, boost: 0, hits: 0, brushes: 0, squeezes: 0, squeezing: false, stuck: 0,
      done: false, win: false };
    for (let i = 0; i < cfg.cars; i++) spawnOne(s, 8000 + rngInt(s, 37000), null);
    return s;
  },
  apply(s, cmd) {
    const ev = [];
    if (cmd.k === 'lane' && !s.done) {
      const to = Math.max(-DATA.half, Math.min(DATA.half, s.lane + cmd.dir));
      if (to === s.lane) ev.push({ k: 'bump', dir: cmd.dir });
      else {
        ev.push({ k: 'lane', from: s.lane, to });
        s.fromX = s.x; s.lane = to; s.moveT = 0; s.moveDir = cmd.dir;
      }
    }
    return { events: ev };
  },
  tick(s) {
    const ev = [];
    if (s.done) return { events: ev };
    const k = s.cfg;
    s.tick++;
    if (s.slow > 0) s.slow--;
    if (s.boost > 0) s.boost--;
    if (s.moveT < k.laneTicks) { s.moveT++; s.x = smooth(s.fromX, s.lane * 1000, s.moveT, k.laneTicks); }
    else s.x = s.lane * 1000;
    const vp = playerSpeed(s);
    s.vp = vp; s.dist += vp;
    if (vp * 10 < idiv(k.speed, DATA.tickRate) * 7) s.stuck++;
    // traffic: move, signal, change lanes
    for (const o of s.obs) {
      o.dz += o.v - vp;
      if (o.blink > 0) {
        o.blink--;
        if (o.blink === 0) { o.fromX = o.x; o.lane = o.to; o.moveT = 0; }
      } else if (o.v > 0 && o.moveT >= k.carLaneTicks && o.dz > 2000 && rngInt(s, 10000) < k.carChange) {
        const to = o.lane + (rngInt(s, 2) === 0 ? -1 : 1);
        if (Math.abs(to) <= DATA.half && laneFree(s, to, o.dz, DATA.kinds[o.kind].len, o)) {
          o.to = to; o.blink = k.blinkTicks;
          ev.push({ k: 'blink', id: o.id, to });
        }
      }
      if (o.moveT < k.carLaneTicks) { o.moveT++; o.x = smooth(o.fromX, o.lane * 1000, o.moveT, k.carLaneTicks); }
    }
    // contact with you: crash (solid), splash (puddle/manhole), brush past (close side gap), squeeze (cars both sides)
    let left = false, right = false;
    for (const o of s.obs) {
      const kd = DATA.kinds[o.kind], zo = zOverlap(o), xo = xOverlap(s, o);
      if (zo && xo) {
        if (!o.touch) {
          o.touch = true;
          if (kd.solid) { s.hits++; s.slow = DATA.slowTicks; ev.push({ k: 'hit', id: o.id }); }
          else { s.slow = Math.max(s.slow, idiv(DATA.slowTicks, 3)); ev.push({ k: 'splash', id: o.id }); }
        }
      } else {
        o.touch = false;
        if (zo && kd.car) {
          if (o.x < s.x) left = true; else right = true;
          const side = 2 * Math.abs(s.x - o.x) - kd.w - DATA.playerW;
          if (!o.brushed && side < 2 * DATA.brushGap) { o.brushed = true; s.brushes++; ev.push({ k: 'brush', id: o.id }); }
        }
      }
    }
    if (left && right && !s.squeezing) { s.squeezes++; s.boost = DATA.boostTicks; ev.push({ k: 'squeeze' }); }
    s.squeezing = left && right;
    s.obs = s.obs.filter(o => o.dz > -DATA.despawnBehind && o.dz < DATA.spawnDz + 20000);
    let ahead = 0;
    for (const o of s.obs) if (o.dz > 0) ahead++;
    if (ahead < k.cars) spawnOne(s, DATA.spawnDz + rngInt(s, 10000), ev);
    if (s.dist >= s.goal || s.tick >= k.runTicks) {
      s.done = true; s.win = s.dist >= s.goal;
      ev.push({ k: 'done', win: s.win, tick: s.tick });
    }
    return { events: ev };
  },
};
// === RULES END ===

// ---- determinism: canon + FNV-1a over the integer state (PORT.md) ----
function canon(v) {
  if (v === null || typeof v === 'boolean') return String(v);
  if (typeof v === 'number') { if (!Number.isSafeInteger(v)) throw Error('canon integer required: ' + v); return String(v); }
  if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}
function fnv(str) { let h = 2166136261; for (const b of new TextEncoder().encode(str)) h = Math.imul(h ^ b, 16777619) >>> 0; return h.toString(16).padStart(8, '0'); }
function replay(log) { // {seed, knobs, cmds:[{t,k,dir}], endTick} -> {hash, events, tick}; touches no view state
  const s = RULES.init(DATA, log.seed, log.knobs);
  let i = 0, events = 0;
  while (s.tick < log.endTick && !s.done) {
    while (i < log.cmds.length && log.cmds[i].t === s.tick) events += RULES.apply(s, log.cmds[i++]).events.length;
    events += RULES.tick(s).events.length;
  }
  return { hash: fnv(canon(s)), events, tick: s.tick };
}

// ---- dev knobs (view units -> integer rule knobs) ----
const KNOBS = [ // key, label, min, max, step, default (view units), toRule
  ['camBack', '카메라 거리', 2, 12, 0.5, 6, null],
  ['speed', '내 속도', 4, 16, 0.5, 9, v => Math.round(v * 1000)],
  ['cars', '차 수', 3, 20, 1, 15, v => v],
  ['carChange', '끼어들기 빈도', 0, 40, 1, 12, v => v],
  ['blinkTicks', '깜빡이 초', 0.3, 1.5, 0.05, 0.8, v => Math.round(v * 60)],
  ['laneTicks', '차선 이동 ms', 80, 300, 10, 150, v => Math.max(1, Math.round(v * 60 / 1000))],
  ['hitbox', '판정 크기', 0.5, 1.0, 0.05, 0.8, v => Math.round(v * 1000)],
  ['runTicks', '제한 시간 초', 20, 60, 5, 40, v => v * 60],
  ['goalPct', '목표 거리 %', 50, 100, 2, 90, v => v],
];
const V = {};
let saved = {};
try { saved = JSON.parse(localStorage.getItem('proto_seoulroute_knobs6') || '{}'); } catch (e) {}
const panel = document.getElementById('panel');
for (const [k, label, min, max, step, def] of KNOBS) {
  V[k] = saved[k] ?? def;
  const row = document.createElement('label');
  row.innerHTML = `<span class="n">${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${V[k]}"><span class="v">${V[k]}</span>`;
  const input = row.querySelector('input'), out = row.querySelector('.v');
  input.oninput = () => {
    V[k] = +input.value; out.textContent = input.value;
    try { localStorage.setItem('proto_seoulroute_knobs6', JSON.stringify(V)); } catch (e) {}
  };
  panel.appendChild(row);
}
document.getElementById('gear').onclick = () => { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; };
const ruleKnobs = () => Object.fromEntries(KNOBS.filter(r => r[6]).map(r => [r[0], r[6](V[r[0]])]));

// ---- presentation ----
const W = 720, HORIZON = 457, ROAD_TEX_W = 848 / 160, TILE_LEN = 20, CELL = 256, LANE_PX = 128; // road5.png: 5 lanes x 160px + curbs
let H = 1280, PLAYER_Y = 1090, CAM_H = 3.63;
const zPlayer = () => V.camBack;                                    // view-only camera distance
const focal = () => zPlayer() * (PLAYER_Y - HORIZON) / CAM_H;
const PROP_CELL = { sedan: 0, bus: 1, manhole: 2, cone: 3, puddle: 4, barrier: 5 };
const FX = { pops: [], shake: 0, flash: 0, flashCol: '#fff' };

// ---- run (state + command log for replay) ----
let S, LOG;
function reset(seed = (Date.now() >>> 0)) {
  S = RULES.init(DATA, seed, ruleKnobs());
  LOG = { seed: (seed >>> 0) || 1, knobs: ruleKnobs(), cmds: [], endTick: 0 }; // init already advanced S.rng
  FX.pops = []; FX.shake = 0; FX.flash = 0;
}
function command(cmd) {
  if (S.done) return;
  LOG.cmds.push(Object.assign({ t: S.tick }, cmd));
  onEvents(RULES.apply(S, cmd).events);
}

const img = src => { const i = new Image(); i.src = src; return i; };
const IMG = { road: img('art/sprites/road5.png'), props: img('art/sprites/props.png'), hero: img('art/sprites/boy.png') };
// Area themes (view only): backdrop + roadside sheet (4x2 cells of 256x512) + placements.
// x in lanes from road center (signed unless both), w in lanes, period/offset in world units.
const AREAS = {
  street: { back: 'art/sprites/backdrop.png', sheet: 'art/sprites/roadside.png', side: [
    { cell: 0, x: 3.1, w: 1.0, period: 8, off: 0, both: true },     // streetlight
    { cell: 7, x: 3.0, w: 1.6, period: 3, off: 1.5, both: true },   // hedge + guardrail
    { cell: 1, x: 3.9, w: 1.8, period: 8, off: 4, both: true },     // ginkgo
    { cell: 3, x: 3.6, w: 0.9, period: 24, off: 10 },               // utility pole
    { cell: 2, x: -3.4, w: 1.0, period: 40, off: 20 },              // traffic signal
    { cell: 4, x: -4.6, w: 2.4, period: 50, off: 33 },              // bus stop
    { cell: 5, x: 5.4, w: 3.2, period: 20, off: 6, both: true },    // corner shop
    { cell: 6, x: 6.6, w: 4.0, period: 20, off: 16, both: true },   // apartment slice
  ] },
  gangnam: { back: 'art/sprites/gangnam-back.png', sheet: 'art/sprites/gangnam.png', side: [
    { cell: 3, x: 3.1, w: 1.1, period: 7, off: 0, both: true },     // twin-arm LED streetlight
    { cell: 7, x: 3.1, w: 1.4, period: 3.5, off: 1.7, both: true }, // planter + bollards
    { cell: 5, x: 3.9, w: 1.6, period: 7, off: 3.5, both: true },   // zelkova
    { cell: 6, x: 4.3, w: 1.6, period: 13, off: 5, both: true },    // pedestrians with umbrellas
    { cell: 4, x: -3.5, w: 2.4, period: 45, off: 22 },              // median-style bus stop
    { cell: 0, x: 6.2, w: 3.6, period: 12, off: 0, both: true },    // glass tower
    { cell: 1, x: 6.2, w: 3.6, period: 12, off: 4, both: true },    // LED billboard tower
    { cell: 2, x: 6.2, w: 3.6, period: 12, off: 8, both: true },    // dark glass tower
  ] },
};
const AREA_KEY = (new URLSearchParams(location.search).get('area') || 'gangnam');
const AREA = AREAS[AREA_KEY] || AREAS.gangnam;
IMG.back = img(AREA.back); IMG.side = img(AREA.sheet);
const SIDE = AREA.side;
const bboxCache = new Map();
function bbox(image, cell, cw, ch) { // tight alpha box of one cell; whole cell if the canvas is tainted (file://)
  const key = image.src + cell;
  if (bboxCache.has(key)) return bboxCache.get(key);
  let box = { x: 0, y: 0, w: cw, h: ch };
  try {
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    g.drawImage(image, (cell % 4) * cw, Math.floor(cell / 4) * ch, cw, ch, 0, 0, cw, ch);
    const d = g.getImageData(0, 0, cw, ch).data;
    let x0 = cw, y0 = ch, x1 = 0, y1 = 0;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) if (d[(y * cw + x) * 4 + 3] > 40) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 > x0) box = { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  } catch (e) {}
  bboxCache.set(key, box);
  return box;
}
function drawCell(image, cell, cx, footY, widthPx, alpha = 1, cw = CELL, ch = CELL) {
  if (!image.complete || !image.naturalWidth) return;
  const b = bbox(image, cell, cw, ch), k = widthPx / b.w;
  ctx.globalAlpha = alpha;
  ctx.drawImage(image, (cell % 4) * cw + b.x, Math.floor(cell / 4) * ch + b.y, b.w, b.h, cx - b.w * k / 2, footY - b.h * k, b.w * k, b.h * k);
  ctx.globalAlpha = 1;
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0;
function resize() { // logical width fixed, height follows the phone: tall phones get more road, not bands
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  H = Math.max(1280, Math.round(W * innerHeight / innerWidth));
  PLAYER_Y = H - 190;
  CAM_H = (PLAYER_Y - HORIZON) / LANE_PX; // one lane = LANE_PX wide at the player on every phone
  scale = Math.min(innerWidth / W, innerHeight / H) * dpr;
  offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

let ac = null, eng = null, engGain = null;
function audioOn() {
  if (ac) return;
  try {
    ac = new AudioContext();
    eng = ac.createOscillator(); eng.type = 'sawtooth';
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    engGain = ac.createGain(); engGain.gain.value = 0.05;
    eng.connect(lp).connect(engGain).connect(ac.destination); eng.start();
  } catch (e) { ac = null; }
}
function blip(freq, len, type = 'sine', vol = 0.2, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len);
}

function onEvents(events) {
  for (const e of events) {
    if (e.k === 'lane') blip(220, 0.08, 'triangle', 0.08, 1.6);
    if (e.k === 'bump') FX.shake = Math.max(FX.shake, 0.08);
    if (e.k === 'hit') { FX.shake = 0.35; FX.flash = 0.25; FX.flashCol = '#ff3b3b'; blip(90, 0.35, 'square', 0.25, 0.5); }
    if (e.k === 'splash') { FX.shake = Math.max(FX.shake, 0.12); FX.flash = 0.12; FX.flashCol = '#7fc8ff'; blip(300, 0.15, 'sine', 0.1, 0.6); }
    if (e.k === 'brush') { FX.pops.push({ text: '스침!', size: 34, t: 0 }); blip(700, 0.1, 'sine', 0.08, 1.5); }
    if (e.k === 'squeeze') { FX.flash = 0.18; FX.flashCol = '#ffd84a'; FX.pops.push({ text: '틈새!', size: 50, t: 0 }); blip(900, 0.2, 'sine', 0.14, 1.8); }
    if (e.k === 'blink') blip(1200, 0.04, 'square', 0.03);
    if (e.k === 'done') { LOG.endTick = e.tick; if (engGain) engGain.gain.value = 0.015; }
  }
  if (eng) eng.frequency.value = 50 + speedView() * 3.2;
}

const rain = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 20 + Math.random() * 30 }));
function project(z) { return { y: HORIZON + CAM_H * focal() / z, s: focal() / z }; }
const camZ = () => S.dist / 1000;
const speedView = () => S.vp * DATA.tickRate / 1000; // units per second, for effects only

function draw(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b2238'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = FX.shake > 0 ? FX.shake * 30 : 0;
  ctx.setTransform(scale, 0, 0, scale, offX + (Math.random() - 0.5) * sh * scale, offY + (Math.random() - 0.5) * sh * scale);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const bs = HORIZON / 520; // backdrop horizon sits at y=520 of 768
  if (IMG.back.complete) ctx.drawImage(IMG.back, (W - 1024 * bs) / 2, 0, 1024 * bs, 768 * bs);
  const F = focal();
  for (let y = HORIZON + 1; y < H; y++) { // ground bands every 4 units = classic pseudo-3D speed cue
    const z = CAM_H * F / (y - HORIZON);
    ctx.fillStyle = Math.floor((camZ() + z) / 4) % 2 ? '#3a4560' : '#323c55';
    ctx.fillRect(0, y, W, 1.5);
  }
  if (IMG.road.complete && IMG.road.naturalWidth) {
    const th = IMG.road.naturalHeight, tw = IMG.road.naturalWidth;
    for (let y = HORIZON + 1; y < H; y++) {
      const dy = y - HORIZON, z = CAM_H * F / dy, w = ROAD_TEX_W * dy / CAM_H;
      const ty = (th - 1 - Math.floor(((camZ() + z) / TILE_LEN * th) % th) + th) % th;
      ctx.drawImage(IMG.road, 0, ty, tw, 1, W / 2 - w / 2, y, w, 1.5);
    }
    const fog = ctx.createLinearGradient(0, HORIZON, 0, HORIZON + 90);
    fog.addColorStop(0, 'rgba(40,48,90,0.9)'); fog.addColorStop(1, 'rgba(40,48,90,0)');
    ctx.fillStyle = fog; ctx.fillRect(0, HORIZON, W, 90);
  }
  const items = S.obs.map(o => ({ z: zPlayer() + o.dz / 1000, o }));
  items.push({ z: zPlayer(), player: true });
  const near = camZ() - zPlayer() + 0.4, far = camZ() - zPlayer() + 90;
  for (const d of SIDE) for (let n = Math.ceil((near - d.off) / d.period); n * d.period + d.off < far; n++) {
    const z = n * d.period + d.off - camZ() + zPlayer();
    for (const x of d.both ? [-d.x, d.x] : [d.x]) items.push({ z, side: d, x });
  }
  items.sort((a, b) => b.z - a.z);
  for (const it of items) {
    if (it.player) { drawPlayer(); continue; }
    if (it.side) {
      const p = project(it.z);
      drawCell(IMG.side, it.side.cell, W / 2 + it.x * p.s, p.y, it.side.w * p.s, Math.min(1, (90 - it.z) / 20), 256, 512);
      continue;
    }
    const o = it.o, p = project(it.z), kd = DATA.kinds[o.kind];
    if (it.z <= 0.3 || p.y > H + 200) continue;
    const cx = W / 2 + o.x / 1000 * p.s;
    drawCell(IMG.props, PROP_CELL[kd.id], cx, p.y, kd.w / 1000 * p.s, Math.min(1, (90 - it.z) / 20));
    if (o.blink > 0 && (S.tick >> 3) & 1) { // turn signal: orange lamp on the side it is moving to
      const side = o.to < o.lane ? -1 : 1, r = Math.max(4, 0.09 * p.s);
      ctx.fillStyle = '#ffae2a'; ctx.shadowColor = '#ffae2a'; ctx.shadowBlur = r * 2;
      ctx.beginPath(); ctx.arc(cx + side * kd.w / 2000 * p.s * 0.85, p.y - 0.25 * p.s, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  for (const p of FX.pops) {
    p.t += dt;
    const pp = project(zPlayer()), x = W / 2 + S.x / 1000 * pp.s, y = PLAYER_Y - 160 - p.t * 120;
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.6); ctx.fillStyle = '#ffd84a'; ctx.font = `bold ${p.size}px sans-serif`; ctx.textAlign = 'center';
    ctx.strokeStyle = '#3a2400'; ctx.lineWidth = 8; ctx.strokeText(p.text, x, y); ctx.fillText(p.text, x, y); ctx.globalAlpha = 1;
  }
  FX.pops = FX.pops.filter(p => p.t < 0.6);
  const v = speedView(), lean = v * 0.9;
  ctx.strokeStyle = 'rgba(190,210,255,0.35)'; ctx.lineWidth = 2;
  for (const r of rain) {
    r.y += v * 1.4; r.x -= lean * 0.15;
    if (r.y > H) { r.y = -40; r.x = Math.random() * (W + 200); }
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + lean * 0.25, r.y - r.l); ctx.stroke();
  }
  const over = 0;
  if (S.boost > 0) {
    ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.5, over * 0.6 + (S.boost > 0 ? 0.25 : 0))})`; ctx.lineWidth = 3;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, r0 = 380 + Math.random() * 80, cx = W / 2, cy = HORIZON + 80;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 1.4);
      ctx.lineTo(cx + Math.cos(a) * (r0 + 160), cy + Math.sin(a) * (r0 + 160) * 1.4); ctx.stroke();
    }
  }
  if (FX.flash > 0) { ctx.globalAlpha = FX.flash * 1.4; ctx.fillStyle = FX.flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  FX.shake = Math.max(0, FX.shake - dt); FX.flash = Math.max(0, FX.flash - dt);
  drawHud(v);
  ctx.restore();
}

function drawPlayer() {
  const p = project(zPlayer()), x = W / 2 + S.x / 1000 * p.s;
  let cell = 0;
  if (S.slow > DATA.slowTicks / 2) cell = 3;
  else if (S.moveT < S.cfg.laneTicks) cell = S.moveDir < 0 ? 1 : 2;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, PLAYER_Y, 0.3 * p.s, 0.06 * p.s, 0, 0, Math.PI * 2); ctx.fill();
  drawCell(IMG.hero, cell, x, PLAYER_Y + Math.sin(S.tick / 2) * 1.5, 0.62 * p.s);
}

function bar(x, y, w, h, f, col) {
  ctx.fillStyle = '#0b1020cc'; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x + 3, y + 3, Math.max(0, (w - 6) * f), h - 6, (h - 6) / 2); ctx.fill();
}
function drawHud(v) {
  const limit = S.cfg.runTicks;
  ctx.fillStyle = '#0b1020b0'; ctx.beginPath(); ctx.roundRect(20, 112, 670, 152, 22); ctx.fill(); // HUD backing over bright skylines
  ctx.textAlign = 'left'; ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('남은 시간', 40, 152); bar(170, 130, 500, 30, Math.max(0, 1 - S.tick / limit), limit - S.tick < 360 ? '#ff5a4a' : '#ffb340');
  ctx.fillText('남은 거리', 40, 200); bar(170, 178, 500, 30, Math.max(0, 1 - S.dist / S.goal), '#5ad1ff');
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`속도 ${v.toFixed(1)}   틈새 ${S.squeezes}   쿵 ${S.hits}   막힘 ${(S.stuck / 60).toFixed(1)}초`, 40, 248);
  if (S.done) {
    ctx.fillStyle = '#0b1020e0'; ctx.beginPath(); ctx.roundRect(70, 420, 580, 420, 30); ctx.fill();
    ctx.fillStyle = S.win ? '#ffd84a' : '#ff6a5a'; ctx.textAlign = 'center'; ctx.font = 'bold 54px sans-serif';
    ctx.fillText(S.win ? `도착 ${(S.tick / 60).toFixed(1)}초` : '시간 초과', W / 2, 500);
    ctx.fillStyle = '#fff'; ctx.font = '30px sans-serif';
    ctx.fillText(`막혀서 잃은 시간 ${(S.stuck / 60).toFixed(1)}초`, W / 2, 570);
    ctx.fillText(`틈새 ${S.squeezes} · 스침 ${S.brushes} · 쿵 ${S.hits}`, W / 2, 620);
    ctx.fillStyle = '#9fb3ff'; ctx.fillText('탭해서 다시', W / 2, 780);
  }
}

// ---- input: lane change fires mid-swipe, not on release ----
let anchor = null;
cv.addEventListener('pointerdown', e => {
  audioOn();
  if (S.done) { reset(); if (engGain) engGain.gain.value = 0.05; return; }
  anchor = e.clientX;
});
cv.addEventListener('pointermove', e => {
  if (anchor === null) return;
  const dx = e.clientX - anchor;
  if (Math.abs(dx) > 28) { command({ k: 'lane', dir: Math.sign(dx) }); anchor = e.clientX; }
});
addEventListener('pointerup', () => { anchor = null; });
addEventListener('keydown', e => {
  audioOn();
  if (e.key === 'ArrowLeft') command({ k: 'lane', dir: -1 });
  if (e.key === 'ArrowRight') command({ k: 'lane', dir: 1 });
  if ((e.key === ' ' || e.key === 'Enter') && S.done) reset();
});

// ---- fixed 60-tick loop ----
reset();
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!window.__pause) {
    acc += dt;
    while (acc >= 1 / 60) { acc -= 1 / 60; onEvents(RULES.tick(S).events); }
  }
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- test hooks ----
window.T = {
  state: () => S, log: () => LOG, hash: () => fnv(canon(S)), replay, reset, command,
  // pace bot: decides every `react` seconds; leaves a lane when something solid is close ahead or a car signals into it,
  // picks the adjacent lane with the longest clear run whose side is free right now.
  bot(react, runs = 10, seed = 1) {
    const out = { win: 0, hits: 0, sq: 0, stuck: 0, ticks: 0 };
    const every = Math.max(1, Math.round(react * 60));
    for (let r = 0; r < runs; r++) {
      const s = RULES.init(DATA, seed + r, ruleKnobs());
      const inLane = (o, l) => o.lane === l || o.to === l;
      const clearAhead = l => Math.min(99999, ...s.obs.filter(o => DATA.kinds[o.kind].solid && inLane(o, l) && o.dz > 0).map(o => o.dz));
      const sideFree = l => !s.obs.some(o => DATA.kinds[o.kind].solid && inLane(o, l) && 2 * Math.abs(o.dz) < DATA.kinds[o.kind].len + DATA.playerLen + 1600);
      while (!s.done) {
        if (s.tick % every === 0 && s.moveT >= s.cfg.laneTicks && clearAhead(s.lane) < 6000) {
          const opts = [s.lane - 1, s.lane + 1].filter(l => Math.abs(l) <= DATA.half && sideFree(l)).sort((a, b) => clearAhead(b) - clearAhead(a));
          if (opts.length && clearAhead(opts[0]) > clearAhead(s.lane)) RULES.apply(s, { k: 'lane', dir: Math.sign(opts[0] - s.lane) });
        }
        RULES.tick(s);
      }
      out.win += s.win ? 1 : 0; out.hits += s.hits; out.sq += s.squeezes; out.stuck += s.stuck; out.ticks += s.tick;
    }
    const n = runs;
    return `${react}s 승${out.win}/${n} 쿵${(out.hits / n).toFixed(1)} 틈새${(out.sq / n).toFixed(1)} 막힘${(out.stuck / n / 60).toFixed(1)}초 ${(out.ticks / n / 60).toFixed(1)}초`;
  },
};
</script>
</body>
</html>
