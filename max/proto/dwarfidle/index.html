function hit(x,y,box){return box&&Math.abs(x-box.x)<=box.w/2&&Math.abs(y-box.y)<=box.h/2;}
function input(kind,x=540,y=geom.H/2){if(statsMode)return;if(kind==='down'){pointer={x,y};return;}if(kind==='cancel'){pointer=null;return;}if(kind==='up'){if(!pointer)return;const first=pointer;pointer=null;if(Math.hypot(x-first.x,y-first.y)>35)return;kind='tap';}
 if(kind==='wanted'){if(recording()&&typeof x==='boolean'){daily().wanted=x;save();}render();return;}
 if(kind==='validation'){if(recording()){endLoop(true);archive.validation={build:BUILD,date:dateKey()};for(const row of Object.values(archive.dates)){row.active=0;row.voluntary=0;}if(rules.phase==='fight')beginLoop();save();}render();return;}
 if(kind==='tap'){layout();if(intro>0){intro=0;save();return;}for(const id of ['validation','yes','no'])if(hit(x,y,geom.buttons[id])){input(id==='validation'?'validation':'wanted',id==='yes');return;}
 if(hit(x,y,geom.recordStrip))return;
 if(forgeOpen){for(const item of ['level','pick','close'])if(hit(x,y,geom.modalButtons[item])){if(item==='close')forgeOpen=false;else command({k:'buy',item});render();return;}return;}
 for(let i=0;i<5;i++)if(hit(x,y,geom.portraits[i])){command({k:'skill',who:i});render();return;}
 for(const id of ['forge','chest','challenge'])if(hit(x,y,geom.buttons[id])){if(id==='forge'){registerInput();forgeOpen=true;}else command({k:id});render();return;}return;}
 if(kind==='forge'){registerInput();forgeOpen=!forgeOpen;}else if(kind==='skill')command({k:'skill',who:x});else if(kind==='buy')command({k:'buy',item:x});else if(kind==='challenge'||kind==='chest')command({k:kind});else if(kind==='resume')command({k:'resume',seconds:x});render();
}
function simulate(dt){game.clock+=dt;if(intro>0){intro=Math.max(0,intro-dt);if(intro===0)save();return;}if(statsMode)return;
 if(loopRow&&loopRow.date!==dateKey()){endLoop(true);if(rules.phase==='fight')beginLoop();}if(rules.phase==='walk')game.scroll+=dt*140;const fighting=rules.phase==='fight';if(fighting){game.playTime+=dt;if(loopRow)loopRow.duration+=dt;if(recording()&&validationActive())daily().active+=dt;}
 present(RULES.tick(rules));for(const p of fx){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.text)p.vy+=300*dt;}fx=fx.filter(p=>p.life>0);shake=Math.max(0,shake-dt*35);flash=Math.max(0,flash-dt);glow=Math.max(0,glow-dt*.5);
 if(recording()&&game.clock-lastSave>=5){lastSave=game.clock;save();}}
function advance(seconds){if(!Number.isFinite(seconds)||seconds<0)throw Error('step seconds');accumulator+=seconds;while(accumulator+1e-9>=DT){simulate(DT);accumulator-=DT;}}
function step(seconds=0){advance(seconds);render();return state();}

function load(n=1){endLoop(true);rules=RULES.init(DATA,2463534242);if(typeof n==='object'){rules=copy(n);}else if(n>1){rules.floor=Math.min(10,Math.floor(n));rules.blocked=rules.floor;rules.cleared=rules.floor-1;}game={clock:0,playTime:0,scroll:0};loopRow=null;fx=[];anims={};pointer=null;accumulator=0;shake=flash=glow=0;banner=failCard=null;forgeOpen=false;render();return state();}
function check(){const s=RULES.init(DATA,2463534242),initial=JSON.stringify(s);let skills=0,checkSeed=918273;for(let i=0;i<3600;i++){if(i%37===0){checkSeed^=checkSeed<<13;checkSeed^=checkSeed>>>17;checkSeed^=checkSeed<<5;const roll=checkSeed>>>0,cmd=roll%4===0?{k:'buy',item:roll%2?'pick':'level'}:roll%4===1?{k:'challenge'}:roll%4===2?{k:'chest'}:{k:'skill',who:roll%5};const result=RULES.apply(s,cmd);skills+=result.events.filter(e=>e.k==='skill').length;}RULES.tick(s);}const idle=RULES.init(DATA,2463534242);for(let i=0;i<3600;i++)RULES.tick(idle);const info=assets(),stateChanged=JSON.stringify(s)!==initial;return {seconds:60,ok:errors.length===0&&info.failed===0&&info.pending===0&&info.silhouettes===0&&stateChanged&&!idle.fire,errors:errors.slice(),assets:info,initiallyUnfinished:true,stateChanged,idleCannotWin:!idle.fire,skills};}
