function check(){const s=RULES.init(DATA,2463534242),initial=JSON.stringify(s);let skills=0,checkSeed=918273;for(let i=0;i<3600;i++){if(i%37===0){checkSeed^=checkSeed<<13;checkSeed^=checkSeed>>>17;checkSeed^=checkSeed<<5;const roll=checkSeed>>>0,cmd=roll%4===0?roll%2?{k:'buy',item:'pick'}:{k:'buy',who:roll%5}:roll%4===1?{k:'sortie',stage:s.stage}:roll%4===2?{k:'chest'}:{k:'skill',who:roll%5};const result=RULES.apply(s,s.phase==='result'?{k:'close'}:cmd);skills+=result.events.filter(e=>e.k==='skill').length;}RULES.tick(s);}const idle=RULES.init(DATA,2463534242);for(let i=0;i<3600;i++)RULES.tick(idle);const info=assets(),stateChanged=JSON.stringify(s)!==initial;return {seconds:60,ok:errors.length===0&&info.failed===0&&info.pending===0&&info.silhouettes===0&&stateChanged&&!idle.fire,errors:errors.slice(),assets:info,initiallyUnfinished:true,stateChanged,idleCannotWin:!idle.fire,skills};}
function showStats(){const el=document.getElementById('stats');el.style.display='block';const escape=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const table=(headers,rows)=>'<table><tr>'+headers.map(v=>'<th>'+escape(v)+'</th>').join('')+'</tr>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+escape(v)+'</td>').join('')+'</tr>').join('')+'</table>';
 el.innerHTML='<h2>'+escape(S('title'))+' '+escape(S('stats'))+'</h2><p>'+escape(S('bias'))+'</p>'+table(DATA.strings.headers,Object.entries(archive.dates).map(([d,r])=>[d,Math.floor(r.active),r.voluntary,r.wanted===null?'—':S(r.wanted?'yes':'no'),r.inputs]))+'<h3>'+escape(S('loop'))+'</h3>'+table(DATA.strings.loopHeaders,archive.loops.map(r=>[(r.stage?stageLabel(r.stage)+' #':'')+r.round,r.date,r.firstInput,r.inputs,r.duration.toFixed(2),r.failures,r.aborted,r.voluntary]))+'<h3>강화 선택</h3>'+table(['틱','동료 / pick','레벨','광석 잔액'],(archive.upgrades??[]).map(r=>[r.tick,r.who,r.level,Math.floor(r.ore)]));}
window.T={state,step,input,load,assets,check,bot};
function pointerXY(e){const box=canvas.getBoundingClientRect();return[(e.clientX-box.left)*W/box.width,(e.clientY-box.top)*geom.H/box.height];}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(pointer)return;canvas.setPointerCapture(e.pointerId);input('down',...pointerXY(e));if(pointer)pointer.id=e.pointerId;});
canvas.addEventListener('pointerup',e=>{e.preventDefault();if(pointer?.id===e.pointerId)input('up',...pointerXY(e));});
for(const kind of ['pointercancel','lostpointercapture'])canvas.addEventListener(kind,()=>input('cancel'));canvas.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());window.addEventListener('resize',resize);
function hide(){if(pausedAt!==null)return;pausedAt=Date.now();pointer=null;save(pausedAt);lastFrame=null;}
function resume(){lastFrame=null;if(pausedAt!==null){present(RULES.apply(rules,{k:'resume',seconds:Math.max(0,(Date.now()-pausedAt)/1000)}));pausedAt=null;save();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hide();else resume();});window.addEventListener('pagehide',hide);window.addEventListener('pageshow',resume);
// Read only in stats; check never reads or writes persisted gameplay.
if(!checkMode&&!sceneMode){try{const stored=JSON.parse(localStorage.getItem(storageKey+'records')||'null');if(stored?.build===BUILD)archive=stored;const saved=JSON.parse(localStorage.getItem(storageKey+'game')||'null');if(saved?.build===BUILD&&saved.rules?.balance&&saved.rules?.party?.length===5){rules=copy(saved.rules);loopRow=saved.loop??null;if(saved.introSeen)intro=0;if(!statsMode)RULES.apply(rules,{k:'resume',seconds:Math.max(0,(Date.now()-saved.savedAt)/1000)});}}catch(_){}}
resize();
for(const spec of SPEC){const key=spec.file.replace(/\.(png|jpg)$/, ''),pic=new Image();pictures[key]=pic;const info=assetInfo[key]={...spec,src:'art/sprites/'+spec.file,loaded:false,failed:false};pic.onload=()=>{info.loaded=true;render();};pic.onerror=()=>{info.failed=true;render();};pic.src=info.src;}
if(rules.phase==='fight'&&!loopRow)beginLoop();
const scene=query.get('scene');if(scene){intro=0;if(scene==='hold'){rules.phase='hold';}else if(scene==='hall'){rules.hall=true;present({events:[{k:'hall_restored'}]});}else if(scene==='fire'){rules.fire=true;rules.hall=true;present({events:[{k:'forge_lit'}]});}else if(scene==='fight'||scene==='boss'||scene==='result'||scene==='fail'){rules.cleared=scene==='boss'?14:0;present(RULES.apply(rules,{k:'sortie',stage:scene==='boss'?15:1}));if(scene==='boss'){rules.tick=390;rules.fightTick=390;rules.party.forEach(p=>p.next=rules.tick+60);rules.enemies[0].next=rules.tick+60;present({events:[{k:'warning',who:0}]});}if(scene==='result'||scene==='fail'){rules.party.forEach(p=>p.hp=0);present(RULES.tick(rules));}}else if(scene==='forge')forgeOpen=true;else if(scene==='chest'){rules.chest=1234;}else if(scene==='reward')present({events:[{k:'level_up'}]});}
restoreWarnings();if(statsMode)showStats();render();
function frame(ms){if(!document.hidden&&!statsMode){if(lastFrame!==null)advance(Math.min(.1,(ms-lastFrame)/1000));if(checkMode&&checkResult===null&&assets().pending===0)checkResult=check();render();lastFrame=ms;}else lastFrame=null;requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
