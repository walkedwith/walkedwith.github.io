<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E3A24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>셋이 간다</title>
<style>
  /* 단일 파일 · 외부 요청 0 · 그림과 소리 전부 절차 생성.
     1차 목표는 하나 — 버튼 셋을 누르는 게 재미있는가. */
  :root{ color-scheme:light }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{margin:0; height:100%; overflow:hidden; background:#1E2717;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
  #wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center}
  #stage{position:relative}
  canvas{display:block; touch-action:none}

  /* 기술 — 셋이니까 버튼도 셋. 엄지가 닿는 아래에 둔다 */
  #keys{position:absolute; left:0; right:0; bottom:0; display:flex; gap:8px; padding:10px 12px 16px}
  .key{flex:1; position:relative; border:none; border-radius:16px; padding:0; height:74px;
    background:#F3E9D2; box-shadow:0 4px 0 #2B2118, inset 0 0 0 3px #2B2118;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    color:#2B2118; font-family:inherit; transition:transform .06s, box-shadow .06s}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #2B2118, inset 0 0 0 3px #2B2118}
  .key .ic{font-size:24px; line-height:1}
  .key .nm{font-size:12px; font-weight:800; letter-spacing:-.02em}
  .key.cool{background:#BFB7A4}
  .key.cool .ic,.key.cool .nm{opacity:.38}
  .key .fill{position:absolute; left:0; right:0; bottom:0; border-radius:0 0 13px 13px;
    background:rgba(43,33,24,.16); pointer-events:none}
  .key.ready{animation:pop .32s}
  @keyframes pop{0%{box-shadow:0 4px 0 #2B2118, inset 0 0 0 3px #2B2118, 0 0 0 0 rgba(255,213,79,.9)}
                 100%{box-shadow:0 4px 0 #2B2118, inset 0 0 0 3px #2B2118, 0 0 0 14px rgba(255,213,79,0)}}

  #over{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(20,26,14,.82); backdrop-filter:blur(2px)}
  #over.on{display:flex}
  .sheet{background:#F3E9D2; border:3px solid #2B2118; border-radius:18px; padding:22px 24px;
    text-align:center; color:#2B2118; max-width:290px; box-shadow:0 6px 0 #2B2118}
  .sheet h2{margin:0 0 4px; font-size:22px}
  .sheet .big{font-size:40px; font-weight:900; letter-spacing:-.03em; margin:6px 0}
  .sheet p{margin:6px 0 0; font-size:13px; line-height:1.6; color:#6B5E4A}
  .sheet button{margin-top:16px; width:100%; border:none; border-radius:13px; padding:13px;
    background:#D95E2B; color:#fff; font-family:inherit; font-size:16px; font-weight:800;
    box-shadow:0 4px 0 #8E3A18}
  .sheet button:active{transform:translateY(3px); box-shadow:0 1px 0 #8E3A18}
  .sheet .keys{display:flex; gap:10px; justify-content:center; margin-top:12px; font-size:12px; color:#6B5E4A}
  .sheet .keys b{display:block; font-size:18px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="keys">
    <button class="key" id="k0"><span class="ic">🪓</span><span class="nm">후려치기</span><i class="fill"></i></button>
    <button class="key" id="k1"><span class="ic">🗡️</span><span class="nm">돌진</span><i class="fill"></i></button>
    <button class="key" id="k2"><span class="ic">🏹</span><span class="nm">꿰뚫기</span><i class="fill"></i></button>
  </div>
  <div id="over"><div class="sheet" id="sheet"></div></div>
</div></div>

<script>
/* ══════════════════════════════════════════════════════════════
   셋이 간다 — 1차 프로토타입
   셋은 자동으로 나아가고 자동으로 때린다.
   플레이어가 정하는 건 기술 셋을 '언제' 쓰느냐 하나뿐이다.
   ══════════════════════════════════════════════════════════════ */

const W=390, H=720, KEYS_H=100;          // 아래 100px 은 버튼 자리
const P={
  grassA:'#8CC63F', grassB:'#7CB332', road:'#C9A227', roadB:'#B8921E',
  edge:'#2B2118',
  orc:'#7BA23F', orcHi:'#96BE58', orcCloth:'#6B4A8C',
  wolf:'#8D8D96', wolfHi:'#A8A8B2',
  tank:'#5E7A9E', tankHi:'#7B98BC',
  h0:'#D95E2B', h0h:'#F2A23C',           // 도끼잡이
  h1:'#3E7CB1', h1h:'#8C6239',           // 순찰자
  h2:'#4CAF6E', h2h:'#F5E05C',           // 궁수
  skin:'#F0C89A', steel:'#D8DEE6', wood:'#8D6E4A',
  blood:'#B4361F', num:'#FFD54F', numBig:'#FF7043', heal:'#7ED957',
};

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
function fit(){
  const s=Math.min(innerWidth/W, innerHeight/H), dpr=Math.min(devicePixelRatio||1,2.5);
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  stage.style.width=(W*s)+'px'; stage.style.height=(H*s)+'px';
  stage.style.transform=''; ctx.setTransform(dpr,0,0,dpr,0,0);
  document.getElementById('keys').style.transform=`scale(${s})`;
  document.getElementById('keys').style.transformOrigin='bottom left';
  document.getElementById('keys').style.width=W+'px';
}
addEventListener('resize',fit); fit();

const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n);
let sd=7; const srand=()=>((sd=sd*1664525+1013904223|0)>>>8)/16777216;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

/* ── 소리 ── */
let AC=null; const ac=()=>{ if(!AC){ try{AC=new (window.AudioContext||webkitAudioContext)();}catch(e){} } return AC; };
function tone(f,d,ty='triangle',g=.14){ const a=ac(); if(!a) return;
  const o=a.createOscillator(), gn=a.createGain(); o.type=ty; o.frequency.value=f;
  gn.gain.setValueAtTime(0,a.currentTime); gn.gain.linearRampToValueAtTime(g,a.currentTime+.006);
  gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+d+.02); }
function sweep(f0,f1,d,g=.16){ const a=ac(); if(!a) return;
  const o=a.createOscillator(), gn=a.createGain(); o.type='sawtooth';
  o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(f1,a.currentTime+d);
  gn.gain.setValueAtTime(g,a.currentTime); gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+d+.02); }
function noise(d=.08,g=.2,hp=800){ const a=ac(); if(!a) return;
  const n=a.sampleRate*d, b=a.createBuffer(1,n,a.sampleRate), dd=b.getChannelData(0);
  for(let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const gn=a.createGain(); gn.gain.value=g; s.connect(f); f.connect(gn); gn.connect(a.destination); s.start(); }

/* ── 그리기 도우미 — 두꺼운 외곽선이 이 화풍의 전부다 ── */
function circle(x,y,r,fill,lw=3){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
  ctx.fillStyle=fill; ctx.fill(); if(lw){ ctx.lineWidth=lw; ctx.strokeStyle=P.edge; ctx.stroke(); } }
function rrect(x,y,w,h,r,fill,lw=3){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  if(lw){ ctx.lineWidth=lw; ctx.strokeStyle=P.edge; ctx.lineJoin='round'; ctx.stroke(); } }
function blob(pts,fill,lw=3){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ const p=pts[i];
    if(p.length===4) ctx.quadraticCurveTo(p[0],p[1],p[2],p[3]); else ctx.lineTo(p[0],p[1]); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=lw; ctx.strokeStyle=P.edge; ctx.lineJoin='round'; ctx.stroke(); }
function shade(x,y,rx,ry){ ctx.fillStyle='rgba(30,40,20,.26)';
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,6.2832); ctx.fill(); }

/* ══════════ 판 ══════════ */
const FIELD_H=H-KEYS_H;                  // 전장 높이
let G=null;
function reset(){
  G={ t:0, dist:0, hp:100, maxhp:100, run:true, over:false,
      kills:0, shake:0, hitstop:0, flash:0, scroll:0,
      foes:[], parts:[], nums:[], slashes:[], shots:[] };
  heroes.forEach((h,i)=>{ h.cd=0; h.atk=0; h.lungeT=0; h.lx=0; h.ly=0; });
  spawnT=420;
}

/* ── 셋 — 삼각 대형. 순찰자가 앞, 둘이 뒤 ── */
const heroes=[
  { id:0, kind:'axe',    nm:'도끼잡이', x:126, y:560, body:P.h0, hair:P.h0h,
    rng:64,  hit:1.05, dmg:4,  cd:0, cdMax:7.0,  atk:0, lungeT:0, lx:0, ly:0 },
  { id:1, kind:'ranger', nm:'순찰자',   x:195, y:512, body:P.h1, hair:P.h1h,
    rng:72,  hit:0.62, dmg:3,  cd:0, cdMax:4.0,  atk:0, lungeT:0, lx:0, ly:0 },
  { id:2, kind:'bow',    nm:'궁수',     x:264, y:560, body:P.h2, hair:P.h2h,
    rng:190, hit:0.80, dmg:2,  cd:0, cdMax:5.0,  atk:0, lungeT:0, lx:0, ly:0 },
];

/* ── 적 ── */
const FOES={
  wolf:{hp:8,  spd:76, dmg:4,  r:15, col:P.wolf, hi:P.wolfHi, nm:'늑대'},
  orc: {hp:18, spd:48, dmg:7,  r:18, col:P.orc,  hi:P.orcHi,  nm:'오크'},
  tank:{hp:42, spd:34, dmg:11, r:22, col:P.tank, hi:P.tankHi, nm:'방패오크'},
};
let spawnT=420;
function spawn(){
  const d=G.dist;
  const pool = d<160 ? ['wolf','wolf','orc'] : d<420 ? ['wolf','orc','orc','tank'] : ['wolf','orc','tank','tank'];
  const k=pool[ri(pool.length)], f=FOES[k];
  const up=Math.floor(d/160);
  G.foes.push({ k, x:rnd(36,W-36), y:-30-rnd(0,70),
    hp:f.hp+up*4, maxhp:f.hp+up*4, spd:f.spd*rnd(.88,1.14), dmg:f.dmg+up,
    r:f.r*rnd(.92,1.1), ph:rnd(0,6.28), kx:0, ky:0, dead:0, hitT:0,
    swing:rnd(0,6.28), cool:0 });
}

/* ── 효과 ── */
function burst(x,y,n,col,pw=1){ for(let i=0;i<n;i++){ const a=rnd(0,6.28), v=rnd(50,170)*pw;
  G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:190,life:1,dec:rnd(1.5,2.9),
    col,w:rnd(3,6.5),rot:rnd(0,6.28),spin:rnd(-9,9)}); } }
function num(x,y,txt,size,col){ G.nums.push({x,y,txt,size,col,life:1,vy:-46,pop:0}); }
function quake(n){ G.shake=Math.max(G.shake,n); }

function hurtFoe(f,dmg,fromX,fromY,knock){
  if(f.dead) return 0;
  f.hp-=dmg; f.hitT=.16;
  const d=Math.max(1,Math.hypot(f.x-fromX,f.y-fromY));
  f.kx+=(f.x-fromX)/d*knock; f.ky+=(f.y-fromY)/d*knock;
  burst(f.x,f.y-6, 3+ri(3), P.blood, .8);
  if(f.hp<=0){ f.dead=.001; G.kills++;
    burst(f.x,f.y-6, 8+ri(5), P.blood, 1.3);
    burst(f.x,f.y-6, 5+ri(4), '#FFE082', 1.1);
    return 1; }
  return 0;
}

/* ══════════ 기술 — 이 게임의 전부 ══════════ */
function useSkill(i){
  const h=heroes[i];
  if(!G.run || h.cd>0) return;
  h.cd=h.cdMax;
  const live=G.foes.filter(f=>!f.dead);
  let killed=0;

  if(i===0){                                    // 🪓 후려치기 — 주변을 한 바퀴 벤다
    const R=104;
    h.lungeT=.26; h.lx=0; h.ly=-8;
    G.slashes.push({x:h.x, y:h.y-6, r:R, life:1, kind:'ring', col:'#FFE9B8'});
    for(const f of live) if(dist(f,{x:h.x,y:h.y-6})<R+f.r) killed+=hurtFoe(f, 26, h.x, h.y, 190);
    quake(11); G.hitstop=Math.max(G.hitstop,.075); G.flash=.28;
    noise(.13,.26,420); tone(98,.34,'sine',.22); sweep(420,90,.22,.14);

  } else if(i===1){                             // 🗡️ 돌진 — 앞으로 튀어나가 꿰뚫는다
    const L=210, WID=46;
    h.lungeT=.34; h.lx=0; h.ly=-64;
    G.slashes.push({x:h.x, y:h.y-20, w:WID, len:L, life:1, kind:'lance', col:'#FFF4D6'});
    for(const f of live) if(Math.abs(f.x-h.x)<WID/2+f.r && f.y<h.y && f.y>h.y-L)
      killed+=hurtFoe(f, 20, h.x, h.y+40, 240);
    quake(8); G.hitstop=Math.max(G.hitstop,.055); G.flash=.20;
    noise(.09,.20,900); sweep(900,320,.16,.13);

  } else {                                      // 🏹 꿰뚫기 — 화면 끝까지 관통
    const WID=30;
    h.lungeT=.22; h.lx=0; h.ly=-6;
    G.shots.push({x:h.x, y:h.y-18, life:1});
    G.slashes.push({x:h.x, y:0, w:WID, len:h.y-10, life:1, kind:'beam', col:'#CFE9FF'});
    for(const f of live) if(Math.abs(f.x-h.x)<WID/2+f.r && f.y<h.y)
      killed+=hurtFoe(f, 15, h.x, h.y+60, 120);
    quake(5); G.hitstop=Math.max(G.hitstop,.04); G.flash=.14;
    noise(.07,.15,1500); sweep(1500,600,.14,.10);
  }

  if(killed){ num(h.x, h.y-72, '×'+killed, killed>=4?38:killed>=2?29:22,
                  killed>=4?P.numBig:P.num);
    tone(330+killed*44,.15,'triangle',.14); tone(660+killed*88,.11,'sine',.07); }
}
for(let i=0;i<3;i++){
  const b=document.getElementById('k'+i);
  const go=e=>{ e.preventDefault(); ac(); useSkill(i); };
  b.addEventListener('pointerdown',go);
}

/* ══════════ 그리기 ══════════ */
const TUFT=Array.from({length:64},()=>({x:srand()*W, y:srand()*900, h:3+srand()*4, p:srand()*6.28}));
const ROCK=Array.from({length:14},()=>({x:srand()*W, y:srand()*900, r:5+srand()*7}));
function drawField(){
  const off=G.scroll%64;
  for(let ry=-1; ry<Math.ceil(FIELD_H/64)+1; ry++) for(let cx=0; cx<Math.ceil(W/64)+1; cx++){
    const gy=Math.floor((G.scroll/64))+ry;
    ctx.fillStyle=((gy+cx)%2===0)?P.grassA:P.grassB;
    ctx.fillRect(cx*64, ry*64+off, 64, 64);
  }
  // 가운데를 지나는 길 — 셋이 이 길을 따라 올라간다
  const rw=150, rx=(W-rw)/2;
  for(let ry=-1; ry<Math.ceil(FIELD_H/64)+1; ry++){
    const gy=Math.floor((G.scroll/64))+ry;
    ctx.fillStyle=(gy%2===0)?P.road:P.roadB;
    ctx.fillRect(rx, ry*64+off, rw, 64);
  }
  ctx.strokeStyle='rgba(70,55,20,.30)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(rx,0); ctx.lineTo(rx,FIELD_H);
  ctx.moveTo(rx+rw,0); ctx.lineTo(rx+rw,FIELD_H); ctx.stroke();
  // 풀·돌
  ctx.strokeStyle='rgba(45,80,20,.34)'; ctx.lineWidth=2; ctx.lineCap='round';
  for(const t of TUFT){ const y=((t.y+G.scroll)%900)-90; if(y<-10||y>FIELD_H+10) continue;
    if(t.x>rx&&t.x<rx+rw) continue;
    const sw=Math.sin(G.t*2+t.p)*1.7;
    ctx.beginPath(); ctx.moveTo(t.x,y); ctx.lineTo(t.x+sw,y-t.h); ctx.stroke(); }
  for(const r of ROCK){ const y=((r.y+G.scroll)%900)-90; if(y<-20||y>FIELD_H+20) continue;
    if(r.x>rx-14&&r.x<rx+rw+14) continue; circle(r.x,y,r.r,'#9AA88C',2.4); }
}

function drawFoe(f){
  const dying=f.dead>0, k=dying?clamp(f.dead/.30,0,1):0;
  const s=f.r/18*(dying?1+k*.45:1), bob=Math.sin(G.t*6+f.ph)*1.9;
  ctx.save(); ctx.globalAlpha=dying?1-k:1;
  ctx.translate(f.x+f.kx, f.y+f.ky+bob);
  ctx.rotate(Math.sin(G.t*4+f.swing)*.05 + k*.8);
  shade(0, 15*s, 15*s, 6*s);
  const C=FOES[f.k], lit=f.hitT>0;
  if(f.k==='wolf'){
    blob([[-16*s,2*s],[-20*s,-14*s,-4*s,-12*s],[6*s,-16*s,15*s,-6*s],[17*s,6*s]], lit?'#FFF1C4':C.col,3);
    circle(-13*s,-9*s,7*s, lit?'#FFF1C4':C.hi,3);
    ctx.fillStyle=P.edge; ctx.beginPath(); ctx.arc(-16*s,-11*s,1.9*s,0,6.28); ctx.fill();
    blob([[-8*s,-15*s],[-12*s,-25*s,-4*s,-17*s]], C.hi,2.4);
    ctx.strokeStyle=P.edge; ctx.lineWidth=2.6; ctx.beginPath();
    ctx.moveTo(15*s,0); ctx.quadraticCurveTo(26*s,-8*s,22*s,-16*s); ctx.stroke();
  } else {
    rrect(-15*s,-4*s,30*s,20*s,9*s, f.k==='tank'?'#3F5A78':P.orcCloth,3);
    circle(-13*s,8*s,4.6*s, lit?'#FFF1C4':C.col,2.6);
    circle( 13*s,8*s,4.6*s, lit?'#FFF1C4':C.col,2.6);
    circle(0,-6*s,14*s, lit?'#FFF1C4':C.hi,3);
    blob([[-13*s,-9*s],[-22*s,-16*s,-15*s,-2*s]], lit?'#FFF1C4':C.col,2.6);
    blob([[ 13*s,-9*s],[ 22*s,-16*s, 15*s,-2*s]], lit?'#FFF1C4':C.col,2.6);
    ctx.fillStyle=P.edge;
    ctx.beginPath(); ctx.ellipse(-5*s,-2*s,2.4*s,3*s,-.2,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 5*s,-2*s,2.4*s,3*s, .2,0,6.28); ctx.fill();
    ctx.fillStyle='#FFF8E1'; ctx.strokeStyle=P.edge; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-4*s,4*s); ctx.lineTo(-2*s,9*s); ctx.lineTo(0,4*s); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 4*s,4*s); ctx.lineTo( 2*s,9*s); ctx.lineTo(0,4*s); ctx.closePath(); ctx.fill(); ctx.stroke();
    if(f.k==='tank'){ ctx.save(); ctx.translate(-20*s,0);   // 방패
      rrect(-9*s,-14*s,17*s,28*s,5*s,'#B9C3CE',3); ctx.restore(); }
  }
  ctx.restore();
  if(!dying && f.hp<f.maxhp){                    // 체력 — 다친 놈만
    const w=26*s;
    ctx.fillStyle='rgba(30,25,15,.55)'; ctx.fillRect(f.x-w/2, f.y-f.r-13, w, 5);
    ctx.fillStyle='#D94F3D'; ctx.fillRect(f.x-w/2, f.y-f.r-13, w*clamp(f.hp/f.maxhp,0,1), 5);
  }
}

function drawHero(h){
  const L=h.lungeT>0 ? Math.sin(clamp(h.lungeT/.34,0,1)*Math.PI) : 0;
  const bob=Math.sin(G.t*2.6+h.id)*1.4, sw=h.atk>0?Math.sin((1-h.atk)*Math.PI):0;
  ctx.save(); ctx.translate(h.x+h.lx*L, h.y+h.ly*L+bob); ctx.scale(1.22,1.22);
  shade(0,17,17,6.4);
  if(h.kind==='axe'){
    ctx.save(); ctx.rotate(-.5+Math.max(L,sw)*2.6); ctx.translate(20,0);
      rrect(-2.6,-4,5,30,2.5,P.wood,2.6);
      blob([[-2,-4],[14,-12,11,6],[0,3]], P.steel,3); ctx.restore();
    rrect(-21,-1,42,24,11,h.body,3);
    circle(-21,8,6.4,P.skin,3); circle(21,8,6.4,P.skin,3);
    circle(0,-9,18,h.hair,3); circle(0,-6,13.5,P.skin,3);
    blob([[-13,-11],[0,-24,13,-11],[7,-8],[0,-13],[-7,-8]], h.hair,2.6);
    ctx.fillStyle=P.edge; ctx.beginPath(); ctx.arc(-5,-5,2.3,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-5,2.3,0,6.28); ctx.fill();
    blob([[-8,2],[0,14,8,2],[0,8]], h.hair,2.4);
  } else if(h.kind==='ranger'){
    ctx.save(); ctx.rotate(-.35+Math.max(L,sw)*2.2); ctx.translate(20,0);
      rrect(-2,-30,4,34,2,P.steel,2.6); rrect(-7,2,14,4,2,P.wood,2.4); ctx.restore();
    blob([[-19,-2],[0,29,19,-2],[16,18],[0,23],[-16,18]], h.body,3);
    circle(-19,6,6,P.skin,3); circle(19,6,6,P.skin,3);
    circle(0,-8,17,h.hair,3); circle(0,-5,13,P.skin,3);
    blob([[-12,-10],[0,-22,12,-10],[6,-7],[0,-12],[-6,-7]], h.hair,2.6);
    ctx.fillStyle=P.edge; ctx.beginPath(); ctx.arc(-4.6,-4,2.2,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(4.6,-4,2.2,0,6.28); ctx.fill();
  } else {
    ctx.save(); ctx.translate(21,0);
      ctx.strokeStyle=P.edge; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,0,15,-1.25,1.25); ctx.stroke();
      ctx.strokeStyle=P.wood; ctx.lineWidth=3.4; ctx.beginPath(); ctx.arc(0,0,15,-1.25,1.25); ctx.stroke();
      ctx.strokeStyle=P.edge; ctx.lineWidth=1.4; ctx.beginPath();
      ctx.moveTo(15*Math.cos(-1.25),15*Math.sin(-1.25));
      ctx.lineTo(-5-Math.max(L,sw)*9,0);
      ctx.lineTo(15*Math.cos(1.25),15*Math.sin(1.25)); ctx.stroke(); ctx.restore();
    rrect(-17,-1,34,22,10,h.body,3);
    circle(-17,7,5.6,P.skin,3); circle(17,7,5.6,P.skin,3);
    blob([[-15,-4],[-17,7,-9,9],[0,12,9,9],[17,7,15,-4],[0,-24,-15,-4]], h.hair,3);
    circle(0,-6,12.5,P.skin,3);
    blob([[-12,-10],[0,-21,12,-10],[5,-7],[0,-12],[-5,-7]], h.hair,2.6);
    ctx.fillStyle=P.edge; ctx.beginPath(); ctx.arc(-4.4,-5,2.1,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(4.4,-5,2.1,0,6.28); ctx.fill();
  }
  ctx.restore();
}

/* ══════════ 루프 ══════════ */
let last=performance.now();
function frame(now){
  let dt=Math.min(.042,(now-last)/1000); last=now;
  if(G.hitstop>0){ G.hitstop-=dt; dt*=.10; }     // 히트스톱 — 멈췄다 쏟아져야 쏟아진다
  G.t+=dt;

  if(G.run){
    /* 전진 — 화면은 고정, 땅이 흐른다 */
    const speed=92+Math.min(38, G.dist*.06);
    G.scroll+=speed*dt; G.dist+=speed*dt/10;

    spawnT-=dt*1000;
    const rate=Math.max(300, 1000-G.dist*1.3);
    if(spawnT<=0){ spawn(); if(G.dist>220&&Math.random()<.45) spawn(); spawnT=rnd(rate*.7,rate*1.25); }

    /* 적 */
    for(let i=G.foes.length-1;i>=0;i--){ const f=G.foes[i];
      if(f.dead){ f.dead+=dt; if(f.dead>.34){ G.foes.splice(i,1); continue; } }
      else {
        const tgt=heroes.reduce((a,b)=>dist(b,f)<dist(a,f)?b:a);
        const d=dist(tgt,f);
        if(d>f.r+22){ const k=f.spd*dt/Math.max(1,d);
          f.x+=(tgt.x-f.x)*k; f.y+=(tgt.y-f.y)*k; }
        else { f.cool-=dt; if(f.cool<=0){ f.cool=1.1;
          G.hp-=f.dmg; num(tgt.x+rnd(-12,12), tgt.y-46, '-'+f.dmg, 19, '#FF6B5A');
          burst(tgt.x,tgt.y-20, 4, '#FF8A6E', .8);
          quake(5); noise(.08,.14,500); tone(150,.13,'square',.10);
          if(G.hp<=0){ G.hp=0; gameOver(); } } }
      }
      f.kx*=Math.pow(.02,dt); f.ky*=Math.pow(.02,dt); if(f.hitT>0) f.hitT-=dt;
      if(f.y>FIELD_H+60) f.y=FIELD_H+60;
    }

    /* 셋 — 자동 평타 */
    for(const h of heroes){
      if(h.cd>0) h.cd=Math.max(0,h.cd-dt);
      if(h.lungeT>0) h.lungeT-=dt;
      if(h.atk>0) h.atk-=dt*4.5;
      h.tick=(h.tick||0)-dt;
      if(h.tick<=0){
        const live=G.foes.filter(f=>!f.dead && dist(f,h)<h.rng);
        if(live.length){
          live.sort((a,b)=>a.y-b.y);              // 제일 앞선 놈부터
          const f=live[live.length-1];
          h.atk=1; h.tick=h.hit;
          if(h.kind==='bow'){ G.shots.push({x:h.x,y:h.y-18,tx:f.x,ty:f.y,life:1}); noise(.04,.07,1800); }
          else noise(.05,.09,1100);
          const k=hurtFoe(f,h.dmg,h.x,h.y,60);
          if(k) tone(392,.10,'triangle',.08);
        } else h.tick=.12;
      }
    }

    /* 효과 갱신 */
    for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.rot+=p.spin*dt; p.life-=p.dec*dt;
      if(p.life<=0) G.parts.splice(i,1); }
    for(let i=G.nums.length-1;i>=0;i--){ const n=G.nums[i];
      n.pop=Math.min(1,n.pop+dt*7); n.y+=n.vy*dt; n.vy*=Math.pow(.12,dt); n.life-=dt*1.1;
      if(n.life<=0) G.nums.splice(i,1); }
    for(let i=G.slashes.length-1;i>=0;i--){ G.slashes[i].life-=dt*4.2; if(G.slashes[i].life<=0) G.slashes.splice(i,1); }
    for(let i=G.shots.length-1;i>=0;i--){ G.shots[i].life-=dt*5.5; if(G.shots[i].life<=0) G.shots.splice(i,1); }
    G.shake*=Math.pow(.0016,dt); G.flash*=Math.pow(.0009,dt);
  }

  /* ── 그리기 ── */
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,FIELD_H); ctx.clip();
  ctx.translate((Math.random()-.5)*G.shake, (Math.random()-.5)*G.shake);
  drawField();

  for(const s of G.slashes){                     // 기술 자국
    ctx.globalAlpha=s.life*.9;
    if(s.kind==='ring'){ const rr=s.r*(1.10-s.life*.22);
      ctx.fillStyle=`rgba(255,233,184,${s.life*.30})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,6.2832); ctx.fill();
      ctx.strokeStyle=s.col; ctx.lineWidth=13*s.life;
      ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,6.2832); ctx.stroke();
      ctx.strokeStyle=P.edge; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,6.2832); ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${s.life*.8})`; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(s.x,s.y,rr*.62,.4,4.2); ctx.stroke(); }
    else { const w=s.w*s.life;
      ctx.fillStyle=s.col; ctx.fillRect(s.x-w/2, s.y-(s.kind==='beam'?0:s.len), w, s.len);
      ctx.strokeStyle=P.edge; ctx.lineWidth=2; ctx.strokeRect(s.x-w/2, s.y-(s.kind==='beam'?0:s.len), w, s.len); }
  }
  ctx.globalAlpha=1;

  G.foes.sort((a,b)=>a.y-b.y);
  for(const f of G.foes) drawFoe(f);
  for(const h of heroes) drawHero(h);

  for(const s of G.shots){ if(s.tx===undefined) continue;
    const p=1-s.life, x=s.x+(s.tx-s.x)*p, y=s.y+(s.ty-s.y)*p;
    const a=Math.atan2(s.ty-s.y,s.tx-s.x);
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.strokeStyle=P.edge; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(7,0); ctx.stroke();
    ctx.strokeStyle=P.wood; ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(7,0); ctx.stroke();
    ctx.restore(); }

  for(const p of G.parts){ ctx.globalAlpha=clamp(p.life,0,1);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.col; ctx.strokeStyle=P.edge; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(0,0,p.w*clamp(p.life,0,1),0,6.2832); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.globalAlpha=1;

  if(G.flash>.01){ ctx.fillStyle=`rgba(255,252,225,${G.flash})`; ctx.fillRect(0,0,W,FIELD_H); }

  for(const n of G.nums){ const pop=1+Math.sin(Math.min(1,n.pop)*Math.PI)*.45;
    ctx.save(); ctx.translate(n.x,n.y); ctx.scale(pop,pop);
    ctx.globalAlpha=clamp(n.life*1.6,0,1);
    ctx.font=`800 ${n.size}px system-ui,sans-serif`; ctx.textAlign='center';
    ctx.lineWidth=6; ctx.strokeStyle=P.edge; ctx.lineJoin='round'; ctx.strokeText(n.txt,0,0);
    ctx.fillStyle=n.col; ctx.fillText(n.txt,0,0); ctx.restore(); }
  ctx.globalAlpha=1;
  ctx.restore();

  /* ── 계기판 — 위에 얹는다. 엄지가 아래를 가리기 때문이다 ── */
  ctx.fillStyle='#2E3A24'; ctx.fillRect(0,FIELD_H,W,KEYS_H);
  const hg=ctx.createLinearGradient(0,0,0,78);
  hg.addColorStop(0,'rgba(20,26,14,.55)'); hg.addColorStop(1,'rgba(20,26,14,0)');
  ctx.fillStyle=hg; ctx.fillRect(0,0,W,78);
  rrect(12,10,W-24,22,11,'#8D6E4A',3);
  const hw=(W-32)*clamp(G.hp/G.maxhp,0,1);
  if(hw>0) rrect(16,14,Math.max(8,hw),14,7, G.hp/G.maxhp<.3?'#D94F3D':'#6FBF6A',0);
  ctx.font='800 12px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#2B2118';
  ctx.fillText(`${Math.ceil(G.hp)} / ${G.maxhp}`, W/2, 26);
  // 거리·처치
  ctx.textAlign='left'; ctx.font='800 22px system-ui,sans-serif';
  ctx.lineWidth=5; ctx.strokeStyle=P.edge; ctx.lineJoin='round';
  const dt1=`${Math.floor(G.dist)}m`;
  ctx.strokeText(dt1,14,58); ctx.fillStyle='#FFF3D0'; ctx.fillText(dt1,14,58);
  ctx.textAlign='right'; ctx.font='800 18px system-ui,sans-serif';
  const kt=`⚔ ${G.kills}`;
  ctx.strokeText(kt,W-14,57); ctx.fillStyle='#FFF3D0'; ctx.fillText(kt,W-14,57);
  ctx.textAlign='left';

  /* 버튼 쿨다운 */
  for(let i=0;i<3;i++){ const h=heroes[i], b=document.getElementById('k'+i);
    const r=h.cd/h.cdMax;
    b.querySelector('.fill').style.height=(r*100)+'%';
    const cool=h.cd>0;
    if(cool!==b.classList.contains('cool')){
      b.classList.toggle('cool',cool);
      if(!cool){ b.classList.remove('ready'); void b.offsetWidth; b.classList.add('ready');
        tone(880,.07,'sine',.05); }
    }
  }

  requestAnimationFrame(frame);
}

/* ══════════ 시작·끝 ══════════ */
const over=document.getElementById('over'), sheet=document.getElementById('sheet');
const best=()=>{ try{ return +(localStorage.getItem('three.best')||0); }catch(e){ return 0; } };
function gameOver(){
  G.run=false; G.over=true;
  const d=Math.floor(G.dist); let b=best();
  if(d>b){ b=d; try{ localStorage.setItem('three.best',String(d)); }catch(e){} }
  quake(16); G.flash=.5; tone(110,.7,'sine',.2); tone(82,.9,'triangle',.14);
  sheet.innerHTML=`<h2>셋이 쓰러졌다</h2>
    <div class="big">${d}m</div>
    <p>벤 수 ${G.kills} · 최고 ${b}m</p>
    <div class="keys">
      <span>🪓<b>${heroes[0].nm}</b></span><span>🗡️<b>${heroes[1].nm}</b></span><span>🏹<b>${heroes[2].nm}</b></span>
    </div>
    <button id="again">다시 간다</button>`;
  over.classList.add('on');
  document.getElementById('again').onclick=()=>{ over.classList.remove('on'); reset(); };
}
function title(){
  sheet.innerHTML=`<h2>⚔️ 셋이 간다</h2>
    <p>셋은 알아서 나아가고 알아서 벱니다.<br>당신이 정하는 건 <b>기술 셋을 언제 쓰느냐</b>뿐입니다.</p>
    <div class="keys">
      <span>🪓<b>주변</b>후려치기</span><span>🗡️<b>앞으로</b>돌진</span><span>🏹<b>끝까지</b>꿰뚫기</span>
    </div>
    ${best()?`<p>최고 ${best()}m</p>`:''}
    <button id="again">간다</button>`;
  over.classList.add('on');
  document.getElementById('again').onclick=()=>{ ac(); over.classList.remove('on'); reset(); };
}
reset(); G.run=false; title();
requestAnimationFrame(frame);
</script>
